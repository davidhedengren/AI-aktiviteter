<style>
:root{
  --canvas:#F4F5F7; --surface:#FFFFFF; --sunken:#EDEEF1;
  --ink:#2B2527; --ink-2:#5C575E; --muted:#8A858E; --line:#E4E3E6; --line-2:#EFEEF0;
  --ed:#B43123; --ed-dark:#8E2519; --ed-tint:#FBF0EE; --ed-ring:rgba(180,49,35,.18);
  --nE:#0F6B4F; --nC:#2A5D9E; --nA:#6E3B86;
  --nE-bg:#E9F3EF; --nC-bg:#EAF0F8; --nA-bg:#F2ECF6;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 1px 2px rgba(43,37,39,.05), 0 1px 3px rgba(43,37,39,.04);
  --sh-2:0 4px 12px rgba(43,37,39,.07), 0 1px 3px rgba(43,37,39,.05);
  --sh-3:0 12px 32px rgba(43,37,39,.12);
  --ui:'Instrument Sans',system-ui,sans-serif;
  --las:'Atkinson Hyperlegible',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ui);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--ed-ring)}
[hidden]{display:none!important}

/* ── kursväljaren · premium 2026 ── */
.kursval{
  position:fixed;inset:0;z-index:100;overflow:auto;
  display:block;padding:clamp(22px,4vw,54px);
  background:
    radial-gradient(900px 520px at 8% -10%,rgba(180,49,35,.075),transparent 66%),
    radial-gradient(720px 520px at 96% 104%,rgba(43,37,39,.055),transparent 68%),
    #F5F5F7;
  isolation:isolate;
}
.kursval::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.33;
  background-image:linear-gradient(rgba(43,37,39,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(43,37,39,.025) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 70%);
          mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 70%);
}
.kv-inner{width:min(1180px,100%);min-height:calc(100vh - clamp(44px,8vw,108px));margin:0 auto;display:flex;flex-direction:column}
.kv-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:58px}
.kv-brand{display:flex;align-items:center;gap:14px;min-width:0}
.kv-logo-shell{width:54px;height:54px;display:grid;place-items:center;background:#fff;border:1px solid rgba(43,37,39,.07);border-radius:15px;box-shadow:0 1px 2px rgba(43,37,39,.04),0 8px 24px rgba(43,37,39,.05);overflow:hidden}
.kv-logo-shell img{width:48px;height:48px;object-fit:contain;display:block}
.kv-brandtext{min-width:0}
.kv-brandname{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv-brandmeta{display:block;margin-top:1px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kv-navnote{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.kv-navnote::before{content:"";width:6px;height:6px;border-radius:50%;background:#1F8A65;box-shadow:0 0 0 4px rgba(31,138,101,.1)}

.kv-hero{padding:clamp(60px,9vh,112px) 0 clamp(38px,5vw,58px);max-width:930px}
.kv-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ed-dark)}
.kv-eyebrow::before{content:"";width:28px;height:1.5px;background:var(--ed);border-radius:99px}
.kv-hero h1{margin:0;max-width:850px;font-size:clamp(42px,5vw,70px);line-height:.99;font-weight:700;letter-spacing:-.055em;color:#211D1F;text-wrap:balance}
.kv-hero h1 .kv-accent{color:var(--ed)}
.kv-intro{margin:24px 0 0;max-width:670px;font-family:var(--las);font-size:clamp(17px,1.55vw,20px);line-height:1.55;color:var(--ink-2);text-wrap:pretty}

.kv-sektionstopp{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
.kv-sektionstopp h2{margin:0;font-size:13px;font-weight:700;letter-spacing:-.01em}
.kv-sektionstopp span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)}
.kv-kort{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.kurskort{
  --mx:50%;--my:50%;position:relative;overflow:hidden;text-align:left;min-height:290px;
  display:flex;flex-direction:column;padding:27px 28px 25px;
  color:var(--ink);background:rgba(255,255,255,.82);
  border:1px solid rgba(43,37,39,.09);border-radius:24px;cursor:pointer;font-family:inherit;
  box-shadow:0 1px 2px rgba(43,37,39,.025),0 10px 36px rgba(43,37,39,.035);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateZ(0);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .24s,box-shadow .28s,background .24s;
}
.kurskort::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(180,49,35,.09),transparent 48%);
  transition:opacity .25s;
}
.kurskort::after{
  content:"";position:absolute;left:28px;right:28px;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--ed),#D2685C 62%,transparent);
  transform:scaleX(0);transform-origin:left;transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.kurskort:hover{transform:translateY(-5px);border-color:rgba(180,49,35,.24);background:rgba(255,255,255,.94);box-shadow:0 16px 48px rgba(43,37,39,.09),0 2px 6px rgba(43,37,39,.04)}
.kurskort:hover::before{opacity:1}.kurskort:hover::after{transform:scaleX(1)}
.kurskort:active{transform:translateY(-2px) scale(.997)}
.kurskort:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ed-ring),0 16px 48px rgba(43,37,39,.09);border-color:var(--ed)}
.kk-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.kk-index{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kk-index::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--ed);box-shadow:0 0 0 5px var(--ed-tint)}
.kk-number{font-size:58px;line-height:.78;font-weight:700;letter-spacing:-.075em;color:#ECEBED;user-select:none;transition:color .25s,transform .28s cubic-bezier(.2,.8,.2,1)}
.kurskort:hover .kk-number{color:#F2E4E1;transform:translateY(-2px)}
.kk-namn{position:relative;margin:34px 0 10px;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.045em;color:#221E20}
.kk-text{position:relative;margin:0;max-width:42ch;font-family:var(--las);font-size:15.5px;line-height:1.52;color:var(--ink-2)}
.kk-taggar{position:relative;display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.kk-tag{display:inline-flex;align-items:center;height:27px;padding:0 9px;border:1px solid #E9E7EA;background:rgba(247,247,249,.82);border-radius:999px;font-family:var(--mono);font-size:9px;letter-spacing:.035em;color:#77727A}
.kk-fot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:auto;padding-top:25px}
.kk-status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2)}
.kk-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#C9C7CC}
.kurskort[data-ready="true"] .kk-status::before{background:#1F8A65}
.kk-cta{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#F1F0F2;color:var(--ink);transition:background .22s,color .22s,transform .28s cubic-bezier(.2,.8,.2,1)}
.kk-cta svg{width:17px;height:17px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.kurskort:hover .kk-cta{background:var(--ed);color:#fff;transform:scale(1.04)}
.kurskort:hover .kk-cta svg{transform:translateX(1.5px)}
.kurskort.laddar{pointer-events:none}.kurskort.laddar .kk-status::before{background:transparent;border:1.5px solid #C8C5CA;border-top-color:var(--ed);animation:kvspin .65s linear infinite;width:10px;height:10px}
.kurskort.laddar .kk-cta{background:var(--ed-tint);color:var(--ed)}
@keyframes kvspin{to{transform:rotate(360deg)}}

.kv-fel{margin:16px 0 0;font-size:13px;line-height:1.6;color:var(--ed-dark);background:rgba(251,240,238,.88);border:1px solid rgba(180,49,35,.12);border-radius:14px;padding:14px 16px}
.kv-fel code{font-family:var(--mono);font-size:12px}
.kv-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:auto;padding-top:34px;color:var(--muted);font-size:11.5px}
.kv-footer .kv-footmono{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.kv-footer strong{color:var(--ink-2);font-weight:600}

@media (max-width:760px){
  .kursval{padding:20px}.kv-navnote{display:none}.kv-logo-shell{width:48px;height:48px;border-radius:14px}.kv-logo-shell img{width:42px;height:42px}
  .kv-hero{padding:55px 0 36px}.kv-hero h1{font-size:clamp(38px,12vw,54px)}.kv-intro{font-size:17px}
  .kv-kort{grid-template-columns:1fr}.kurskort{min-height:255px;padding:24px;border-radius:20px}.kk-namn{margin-top:28px;font-size:27px}.kk-number{font-size:50px}
  .kv-sektionstopp span,.kv-footer .kv-footmono{display:none}.kv-footer{padding-top:24px}
}
@media (max-width:420px){.kursval{padding:16px}.kv-brandname{font-size:12.5px}.kv-brandmeta{font-size:8.5px}.kv-hero{padding-top:45px}.kurskort{padding:21px}.kk-taggar{gap:5px}}

.märke img{height:46px;width:auto;display:block}
.titel{display:flex;flex-direction:column;min-width:0}
.titel h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.titel span{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.top .fyll{flex:1}

/* ── knappar ── */
.knapp{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
  border-radius:var(--r-s);padding:9px 14px;font-weight:500;font-size:13.5px;
  background:var(--sunken);color:var(--ink);transition:background .15s,transform .08s,box-shadow .15s}
.knapp:hover{background:#E3E5E9}
.knapp:active{transform:translateY(.5px)}
.knapp.primär{background:var(--ed);color:#fff;box-shadow:var(--sh-1)}
.knapp.primär:hover{background:var(--ed-dark)}
.knapp.tyst{background:transparent;color:var(--ink-2)}
.knapp.tyst:hover{background:var(--sunken);color:var(--ink)}
.knapp.tyst[aria-pressed="true"]{background:var(--ed-tint);color:var(--ed-dark)}
.knapp.tyst[aria-pressed="true"]:hover{background:var(--ed-tint)}
.knapp.liten{padding:6px 10px;font-size:12px;gap:5px}
.knapp.liten svg{width:12.5px;height:12.5px}

/* ── slumpa-popover ── */
.slumpwrap{position:relative}
.slumpwrap .knapp[aria-expanded="true"]{background:var(--ed-tint);color:var(--ed-dark)}
.slumppanel{position:absolute;top:calc(100% + 8px);right:0;width:220px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-3);padding:14px;z-index:30;
  display:none}
.slumppanel.öppen{display:block}
.slumppanel label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.slumprad{display:flex;gap:8px}
.slumprad input{width:64px;border:1px solid transparent;background:var(--sunken);border-radius:9px;
  padding:9px 10px;font-size:14px;font-weight:600;color:var(--ink);text-align:center;
  font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s,box-shadow .15s}
.slumprad input:hover{background:#E7E7EB}
.slumprad input:focus{outline:none;background:var(--surface);border-color:var(--ed);box-shadow:0 0 0 3.5px var(--ed-ring)}
.slumprad .knapp{flex:1;justify-content:center;padding:9px 10px}
.knapp:disabled{opacity:.4;cursor:not-allowed;transform:none}
.knapp:focus-visible,input:focus-visible,.omrad:focus-visible,.kort:focus-visible{
  outline:2px solid var(--ed);outline-offset:2px}
.knapp svg{width:15px;height:15px;flex:none}

/* ── kryssrutor i mittraden ── */
.kryss{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
  position:relative;font-size:13px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-s);padding:7px 13px 7px 10px;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.kryss:hover{border-color:#D3D1D6;color:var(--ink)}
.kryss input{position:absolute;opacity:0;width:0;height:0}
.kryss .ruta{width:17px;height:17px;border-radius:5px;border:1.5px solid #CFCDD3;
  background:var(--surface);display:grid;place-items:center;flex:none;transition:.15s}
.kryss .ruta svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.6);transition:.15s}
.kryss input:checked~.ruta{background:var(--ed);border-color:var(--ed)}
.kryss input:checked~.ruta svg{opacity:1;transform:scale(1)}
.kryss input:focus-visible~.ruta{outline:2px solid var(--ed);outline-offset:2px}
.kryss:has(input:checked){background:var(--ed-tint);border-color:transparent;color:var(--ed-dark)}
.kryssgrupp{display:flex;gap:8px;flex-wrap:wrap}

/* ── tre paneler ── */
.arbetsyta{display:grid;grid-template-columns:272px minmax(0,1fr) 360px;
  height:calc(100vh - 80px);overflow:hidden}
.panel{overflow-y:auto;overscroll-behavior:contain}
.panel::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb{background:#D6D5D9;border-radius:99px;border:3px solid var(--canvas)}
.panel::-webkit-scrollbar-track{background:transparent}

/* ── vänster: områden ── */
.vänster{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 40px}
.sök{position:relative;margin:0 4px 14px}
.sök input{width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:var(--r-s);
  padding:9px 12px 9px 33px;font-size:13.5px}
.sök input::placeholder{color:var(--muted)}
.sök svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.etikett{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;padding:0 8px;font-weight:600}
.nivåfilter{display:flex;gap:6px;margin:0 4px 18px}
.nivåfilter button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);
  padding:7px 0;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s}
.nivåfilter button[aria-pressed="true"].E{background:var(--nE-bg);color:var(--nE);border-color:transparent}
.nivåfilter button[aria-pressed="true"].C{background:var(--nC-bg);color:var(--nC);border-color:transparent}
.nivåfilter button[aria-pressed="true"].A{background:var(--nA-bg);color:var(--nA);border-color:transparent}
.kapgrupp{margin-bottom:4px}
.kaprad{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;cursor:pointer;
  padding:7px 8px;border-radius:var(--r-s);text-align:left;font-weight:600;font-size:13.5px;color:var(--ink)}
.kaprad:hover{background:var(--canvas)}
.kaprad .pil{width:12px;height:12px;color:var(--muted);transition:transform .18s}
.kapgrupp.stängd .pil{transform:rotate(-90deg)}
.kaprad .nr{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.kaprad .antal{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.omrlista{padding-left:6px}
.kapgrupp.stängd .omrlista{display:none}
.omrad{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;cursor:pointer;
  padding:6px 8px 6px 14px;border-radius:var(--r-s);text-align:left;font-size:13px;color:var(--ink-2);
  position:relative;transition:background .13s,color .13s}
.omrad:hover{background:var(--canvas);color:var(--ink)}
.omrad[aria-pressed="true"]{background:var(--ed-tint);color:var(--ed-dark);font-weight:500}
.omrad[aria-pressed="true"]::before{content:"";position:absolute;left:3px;top:7px;bottom:7px;width:2.5px;
  border-radius:2px;background:var(--ed)}
.omrad{align-items:flex-start}
.omrad>span:first-child{line-height:1.35}
.omrad .antal{margin-left:auto;padding-left:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;padding-top:1px}
.omrad[aria-pressed="true"] .antal{color:var(--ed)}

/* ── mitten: uppgifter ── */
.mitten{background:var(--canvas);padding:0 22px 60px}
.mittopp{position:sticky;top:0;background:linear-gradient(var(--canvas) 72%,transparent);
  padding:18px 0 12px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.träffar{font-size:13.5px;color:var(--ink-2)}
.träffar b{color:var(--ink);font-weight:600}
.mittopp .fyll{flex:1}
.kort{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:15px 17px 15px 15px;margin-bottom:9px;display:grid;grid-template-columns:22px 1fr;gap:13px;
  cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.kort:hover{border-color:#D3D1D6;box-shadow:var(--sh-1)}
.kort.vald{border-color:var(--ed);box-shadow:0 0 0 3px var(--ed-ring)}
.kort.vald .id{color:var(--ed-dark)}
.bock{width:20px;height:20px;border-radius:6px;border:1.5px solid #CFCDD3;background:var(--surface);
  margin-top:2px;display:grid;place-items:center;transition:.15s}
.bock svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.6);transition:.15s}
.kort.vald .bock{background:var(--ed);border-color:var(--ed)}
.kort.vald .bock svg{opacity:1;transform:scale(1)}
.kortmeta{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.id{font-family:var(--ui);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
.nivå{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:2.5px 7px;border-radius:5px}
.nivå.E{background:var(--nE-bg);color:var(--nE)} .nivå.C{background:var(--nC-bg);color:var(--nC)}
.nivå.A{background:var(--nA-bg);color:var(--nA)}
.område{font-size:11.5px;color:var(--muted)}
.poäng{margin-left:auto;font-family:var(--ui);font-size:11.5px;color:var(--muted);font-weight:500}
.kroppen{font-family:var(--las);font-size:14.5px;line-height:1.62;color:var(--ink)}
.kroppen p{margin:0 0 8px;max-width:66ch}
.kroppen p:last-child{margin-bottom:0}
.kroppen ol{margin:9px 0 4px;padding-left:0;list-style:none;counter-reset:d}
.kroppen li{margin-bottom:5px;padding-left:26px;position:relative;max-width:62ch}
.kroppen li::before{counter-increment:d;content:counter(d,lower-alpha) ")";position:absolute;left:0;
  font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ed)}
table.data{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin:9px 0}
table.data th,table.data td{border:1px solid var(--line);padding:5px 12px;text-align:right}
table.data th{background:var(--sunken);font-weight:600}
.facitknapp{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;padding:3px 0}
.facitknapp:hover{color:var(--ed)}
.facit{display:none;margin-top:9px;padding:11px 14px;background:var(--sunken);border-radius:var(--r-s)}
.facit.öppen{display:block}
.facit p{margin:3px 0;font-family:var(--mono);font-size:12.5px;line-height:1.75}
.facit .steg{position:relative;padding-left:27px;margin:7px 0}
.facit .stegnr{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:5px;
  background:var(--ed);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  font-family:var(--ui);line-height:1}
.facit .stegprick{background:none;color:var(--ed);font-size:15px}
.facit .komm{padding-left:27px;font-family:var(--las);font-size:13px;color:var(--ink-2);line-height:1.55}
.facit strong{color:var(--ed-dark)}
.tomt{text-align:center;padding:70px 20px;color:var(--muted)}
.tomt h3{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.tomt p{margin:0;font-size:13.5px;max-width:34ch;margin-inline:auto}

/* ── höger: övningsbladet ── */
.höger{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.bladtopp{padding:20px 18px 16px;border-bottom:1px solid var(--line-2)}
.bladtopp h2{margin:0 0 13px;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.fält{display:flex;flex-direction:column;gap:8px}
.fält input{border:1px solid transparent;background:var(--sunken);border-radius:11px;padding:10px 13px;
  font-size:13.5px;color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s}
.fält input::placeholder{color:var(--muted)}
.fält input:hover{background:#E7E7EB}
.fält input:focus{outline:none;background:var(--surface);border-color:var(--ed);box-shadow:0 0 0 3.5px var(--ed-ring)}
.fält .rad{display:flex;gap:8px}
.fält .rad input{flex:1;min-width:0}

/* signaturen: poängmätaren */
.mätare{padding:19px 18px;border-bottom:1px solid var(--line-2)}
.mätarhuvud{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
.summa{font-family:var(--ui);font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums}
.summa small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:-.01em}
.mätarhuvud .antal{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500;padding-bottom:3px}
.stapel{height:10px;border-radius:99px;background:var(--sunken);display:flex;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(43,37,39,.06)}
.stapel span{transition:width .5s cubic-bezier(.4,0,.2,1)}
.stapel .sE{background:var(--nE)} .stapel .sC{background:var(--nC)} .stapel .sA{background:var(--nA)}
.mätarnyckel{display:flex;gap:16px;margin-top:12px;font-family:var(--ui);font-size:12.5px;color:var(--ink-2)}
.mätarnyckel b{font-weight:700;color:var(--ink)}
.mätarnyckel i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.gränser{margin-top:16px}
.gränser .gränsrubrik{display:block;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);
  margin-bottom:8px}
.gränsrad{display:flex;gap:6px}
.chip{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;border-radius:9px;
  padding:6px 4px;font-family:var(--ui);font-size:12px;font-weight:600}
.chip b{font-size:13px;font-weight:700}
.chip.E{background:var(--nE-bg);color:var(--nE)} .chip.C{background:var(--nC-bg);color:var(--nC)}
.chip.A{background:var(--nA-bg);color:var(--nA)}

.bladlista{flex:1;overflow-y:auto;padding:10px 12px 20px}
.brad{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:flex-start;padding:10px 9px;
  border-radius:var(--r-m);transition:background .15s}
.brad:hover{background:var(--canvas)}
.brad .num{width:22px;height:22px;border-radius:50%;background:var(--sunken);color:var(--ink-2);
  font-family:var(--ui);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.brad .txt{font-size:12.5px;line-height:1.5;color:var(--ink-2);min-width:0}
.bmeta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.bid{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)}
.bniva{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1.5px 6px;border-radius:5px}
.bniva.E{background:var(--nE-bg);color:var(--nE)} .bniva.C{background:var(--nC-bg);color:var(--nC)}
.bniva.A{background:var(--nA-bg);color:var(--nA)}
.bpoäng{font-family:var(--ui);font-size:11px;color:var(--muted);font-weight:500}
.brad .txt .btext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2)}
.bverktyg{display:flex;gap:1px;opacity:0;transition:opacity .13s}
.brad:hover .bverktyg,.brad:focus-within .bverktyg{opacity:1}
.bverktyg button{width:25px;height:25px;border:none;background:none;border-radius:7px;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;transition:background .13s,color .13s}
.bverktyg button:hover{background:var(--sunken);color:var(--ink)}
.bverktyg button.bort:hover{background:var(--ed-tint);color:var(--ed)}
.bverktyg svg{width:13px;height:13px}
.bladfot{padding:16px 18px 20px;border-top:1px solid var(--line-2);background:var(--surface)}
.exportrad{display:flex;gap:9px}
.exportrad .knapp{flex:1;justify-content:center;padding:11px 14px;border-radius:11px;font-weight:600}
.exportrad .knapp.primär{box-shadow:0 2px 8px rgba(180,49,35,.22)}
.växel{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13.5px;font-weight:500;
  color:var(--ink-2);cursor:pointer}
.växel input{appearance:none;width:38px;height:22px;border-radius:99px;background:#D6D5D9;position:relative;
  cursor:pointer;transition:background .18s;flex:none;box-shadow:inset 0 1px 2px rgba(43,37,39,.08)}
.växel input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(43,37,39,.25);transition:transform .18s cubic-bezier(.4,0,.2,1)}
.växel input:checked{background:var(--ed)}
.växel input:checked::after{transform:translateX(16px)}


/* ── figurer ────────────────────────────────────────────────
   Klasserna styr ram och storlek. Färger sätts som attribut direkt
   i SVG-koden, så att en uppgift kan klippas ut och fungera fristående. */
.fig{margin:12px 0;max-width:520px}
.fig.smal{max-width:380px}
.fig.bred{max-width:620px}
.fig svg{display:block;width:100%;height:auto}
.fig-axel{stroke:#2B2527;stroke-width:2}
.fig-rutnat{stroke:#E4E3E6;stroke-width:1}
.fig-kurva{fill:none;stroke:#B43123;stroke-width:2.4;stroke-linejoin:round}
.fig-kurva2{fill:none;stroke:#2A5D9E;stroke-width:2.4;stroke-linejoin:round}
.fig-area{fill:#B43123;fill-opacity:.12}
.fig-hjalp{stroke:#9A959C;stroke-width:1.2;stroke-dasharray:4 3}
.fig-kropp{fill:#fff;stroke:#2B2527;stroke-width:2}
.fig-underlag{fill:#EDEEF1;stroke:#2B2527;stroke-width:2}
.fig-vatska{fill:#DCE6F2}
.fig-pil{stroke:#B43123;stroke-width:2.3;fill:none}
.fig-pilspets{fill:#B43123}
.fig-num{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#5C575E}
.fig-namn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;fill:#2B2527}
.fig-etikett{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;fill:#B43123}


/* ── redigera uppgift före tillägg ── */
.redigera-uppgift{
  position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;
  background:rgba(32,28,30,.34);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.redigera-uppgift[hidden]{display:none}
.ru-dialog{
  width:min(880px,calc(100vw - 32px));max-height:min(820px,calc(100vh - 32px));
  overflow:hidden;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid rgba(43,37,39,.10);border-radius:20px;box-shadow:0 24px 70px rgba(43,37,39,.22);
}
.ru-topp{
  flex:none;display:flex;align-items:center;gap:10px;padding:17px 20px;
  border-bottom:1px solid var(--line-2);
}
.ru-topp h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.015em}
.ru-id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ru-stäng{
  margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--muted)
}
.ru-stäng:hover{background:var(--sunken);color:var(--ink)}
.ru-stäng svg{width:17px;height:17px}
.ru-body{padding:20px;overflow:auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:20px}
.ru-sektion{min-width:0}
.ru-label{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;
  font-size:11.5px;font-weight:700;color:var(--ink-2)
}
.ru-hjälp{font-size:10.5px;font-weight:400;color:var(--muted)}
.ru-text{
  width:100%;min-height:220px;resize:vertical;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--canvas);font-family:var(--las);font-size:14px;line-height:1.55;
  color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s
}
.ru-text:focus{outline:none;background:#fff;border-color:var(--ed);box-shadow:0 0 0 3.5px var(--ed-ring)}
.ru-kopiera-rad{display:flex;justify-content:flex-end;margin-top:8px}
.ru-bildbox{
  min-height:220px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--canvas);
  display:grid;place-items:center;overflow:hidden
}
.ru-bildbox .fig{margin:0;max-width:100%;width:100%}
.ru-bildbox .fig svg,.ru-bildbox .fig img{display:block;max-width:100%;max-height:270px;width:auto;height:auto;margin:auto}
.ru-ingenbild{font-size:12px;color:var(--muted);text-align:center}

<script>
/* ═══════════════ kurser ═══════════════
   Varje kurs pekar ut sina egna filer och sina egna globala namn.
   Vill du lägga till Fysik 3 eller Matematik räcker det att lägga till
   ett objekt här och skapa motsvarande två filer. Namnen i "globaler"
   måste vara unika mellan kurserna, annars krockar deklarationerna. */
const KURSER=[
  {
    id:'fy1',
    titel:'Fysik 1',
    siffra:'1',

      'Tryck',
      'Värme och temperatur',
      'Elektricitet',
      'Partikel- och kärnfysik'

    filer:['struktur.js','uppgifter.js'],
    globaler:{bank:'BANK',kapnamn:'KAPNAMN',omr:'OMR'}
  },
  {
    id:'fy2',
    titel:'Fysik 2',
    siffra:'2',
    taggar:[
      'Rörelse och krafter',
      'Ljud och andra mekaniska vågor',
      'Elektromagnetism',
      'Vågor och partiklar',
      'Astrofysik',
      'Relativitetsteori'

    globaler:{bank:'BANK2',kapnamn:'KAPNAMN2',omr:'OMR2'}
  }

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const svgBock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';
const svgPil='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
/* Logotypen bäddas in som data-URL när sidan laddas, så att den följer med
   i Word-exporten. Misslyckas hämtningen (till exempel vid file://) används
   den vanliga sökvägen, som ändå fungerar vid utskrift från sidan. */
let LOGO='logo.png';
(async()=>{ try{
  const svar=await fetch('logo.png');
  const blob=await svar.blob();
  LOGO=await new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(blob);});
}catch(e){} })();

/* ═══ tillstånd ═══ */
let AKTIV=null;                                   /* vald kurs */
let DB={bank:[],kapnamn:{},omr:{}};               /* kursens data */
const state={omr:new Set(),nivåer:new Set(['E','C','A']),sök:'',blad:[],visaPoäng:false,sorteraNivå:false};
const NIVÅORDNING={E:0,C:1,A:2};
const nyckel=x=>x.kap+':'+x.omr;

/* Strukturerar ett facit.
   Har uppgiften deluppgifter (a, b, c) används de bokstäverna som markörer.
   Annars numreras räknestegen 1, 2, 3. Rader utan beräkning blir förklaringar. */
function LOS(html){
  const bitar=[...html.matchAll(/<p>([\s\S]*?)<\/p>/g)].map(m=>m[1]);
  if(!bitar.length) return html;
  const bokstav=b=>/^\s*<?[a-z]?>?\s*([a-e])\)/.exec(b.replace(/<[^>]+>/g,'').trim());
  const harDelar=bitar.some(bokstav);
  let n=0;
  return bitar.map(b=>{
    const bo=bokstav(b);
    if(bo) return `<p class="steg"><span class="stegnr">${bo[1]}</span>${b.replace(/^(\s*)([a-e])\)\s*/,'$1')}</p>`;
    const räkne=/[=→]/.test(b)||/<strong>/.test(b);
    if(räkne&&!harDelar){n++;return `<p class="steg"><span class="stegnr">${n}</span>${b}</p>`;}
    if(räkne) return `<p class="steg"><span class="stegnr stegprick">·</span>${b}</p>`;
    return `<p class="komm">${b}</p>`;
  }).join('');
}

function laddaSkript(src){
  return new Promise((ok,fel)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>ok(); s.onerror=()=>fel(new Error(src));
    document.head.appendChild(s);
  });
}
/* Läser en global oavsett om filen använder window.NAMN eller const NAMN. */
function hämtaGlobal(namn){
  if(namn in window && window[namn]!==undefined) return window[namn];
  try{ return (0,eval)(namn); }catch(e){ return undefined; }
}
async function väljKurs(kurs,kort){
  $('#kvFel').hidden=true;
  if(kurs.data){ startaKurs(kurs); return; }
  kort.classList.add('laddar');
  let status=kort.querySelector('.kk-status');
  if(!status){
    status=document.createElement('span');
    status.className='kk-status';
    kort.querySelector('.kk-fot').prepend(status);
  }
  status.textContent='Läser in…';
  try{
    for(const f of kurs.filer) await laddaSkript(f);
    const bank=hämtaGlobal(kurs.globaler.bank);
    const kapnamn=hämtaGlobal(kurs.globaler.kapnamn);
    const omr=hämtaGlobal(kurs.globaler.omr);
    if(!Array.isArray(bank)||!kapnamn||!omr) throw new Error('data saknas');
    kurs.data={bank,kapnamn,omr};
    startaKurs(kurs);
  }catch(e){
    $('#kvFel').innerHTML=`<b>${kurs.titel} kunde inte läsas in.</b><br>
      Kontrollera att <code>${kurs.filer.join('</code> och <code>')}</code> ligger i samma mapp
      som sidan, och att de sätter
      <code>window.${kurs.globaler.bank}</code>,
      <code>window.${kurs.globaler.kapnamn}</code> och
      <code>window.${kurs.globaler.omr}</code>.`;
    $('#kvFel').hidden=false;
  }finally{
    kort.classList.remove('laddar');
    ritaKursval();
  }
}
function visaKursval(){
  AKTIV=null;
  document.querySelector('.top').hidden=true;
  document.querySelector('.arbetsyta').hidden=true;
  $('#kursval').hidden=false;
  $('#kvFel').hidden=true;
  ritaKursval();
}
function startaKurs(kurs){
  AKTIV=kurs; DB=kurs.data;
  DB.bank.forEach(x=>{ if(!x.familj) x.familj=x.id.replace(/[a-z]$/,''); });
  state.omr.clear(); state.blad=[]; state.sök='';
  state.nivåer=new Set(['E','C','A']); state.sorteraNivå=false; state.visaPoäng=false;
  $('#sökfält').value=''; $('#visaPoäng').checked=false;
  $('#sorteraKnapp').setAttribute('aria-pressed','false');
  $('#sorteraLabel').textContent='Sortera: ID';
  $$('.nivåfilter button').forEach(b=>b.setAttribute('aria-pressed','true'));
  $('#slumpaAntal').value=12;
  $('#bTitel').value='Övningsblad '+kurs.titel;
  $('#banktal').textContent=kurs.titel+' · '+DB.bank.length+' uppgifter';
  byggTräd();
  $('#kursval').hidden=true;
  document.querySelector('.top').hidden=false;
  document.querySelector('.arbetsyta').hidden=false;
  rita(); ritaBlad();
}

/* ── urvalet ── */
function urval(){
  return DB.bank.filter(x=>{
    if(!state.nivåer.has(x.niva)) return false;
    if(state.omr.size && !state.omr.has(nyckel(x))) return false;
    if(state.sök){
      const t=(x.t+' '+x.id+' '+DB.omr[x.kap][x.omr]).replace(/<[^>]+>/g,' ').toLowerCase();
      if(!t.includes(state.sök)) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(state.sorteraNivå && a.niva!==b.niva) return NIVÅORDNING[a.niva]-NIVÅORDNING[b.niva];
    return a.id.localeCompare(b.id,'sv',{numeric:true});
  });
}

function vippa(id){
  const i=state.blad.findIndex(x=>x.id===id);
  if(i>=0) state.blad.splice(i,1); else state.blad.push(DB.bank.find(x=>x.id===id));
  const k=document.querySelector(`.kort[data-id="${id}"]`);
  if(k){ k.classList.toggle('vald',i<0); k.setAttribute('aria-pressed',i<0); }
  ritaBlad();
}

/* ── övningsbladet ── */
function ritaBlad(){
  const b=state.blad, vp=state.visaPoäng;
  const p={E:0,C:0,A:0}, antalN={E:0,C:0,A:0};
  b.forEach(x=>{const m=x.poang.match(/(\d+)\/(\d+)\/(\d+)/);p.E+=+m[1];p.C+=+m[2];p.A+=+m[3];antalN[x.niva]++;});
  const tot=p.E+p.C+p.A;
  const antalTot=b.length;
  $('#summa').style.display=vp?'':'none';
  $('#summa').innerHTML=tot+'<small>p</small>';
  $('#bAntal').textContent=b.length?b.length+(b.length===1?' uppgift':' uppgifter'):'inga uppgifter';
  document.querySelector('.stapel').style.display='';
  ['E','C','A'].forEach(n=>{
    const bas=vp?tot:antalTot;
    const värde=vp?p[n]:antalN[n];
    $('#st'+n).style.width=(bas?värde/bas*100:0)+'%';
    $('#p'+n).textContent=vp?p[n]:antalN[n];
  });
  $('#gränser').style.display=vp?'':'none';
  $('#gränser').innerHTML=tot
    ? `<span class="gränsrubrik">Förslag på gränser</span>
       <div class="gränsrad">
         <span class="chip E">E <b>${Math.round(tot*.28)}p</b></span>
         <span class="chip C">C <b>${Math.round(tot*.55)}p</b></span>
         <span class="chip A">A <b>${Math.round(tot*.78)}p</b></span>
       </div>`
    : '<span class="gränsrubrik">Kryssa i uppgifter så räknas poängen ihop här.</span>';

  $('#blad').innerHTML=b.length ? b.map((x,i)=>`
    <div class="brad">
      <span class="num">${i+1}</span>
      <span class="txt">
        <span class="bmeta">
          <span class="bid">${x.id}</span>
          <span class="bniva ${x.niva.split('/')[0]}${ändrad(x)?' ändrad':''}" data-red="${x.id}" role="button"
            tabindex="0" title="${REDTITEL}">${x.niva}</span>
          ${vp?`<span class="bpoäng${ändrad(x)?' ändrad':''}" data-red="${x.id}" role="button"
            tabindex="0" title="${REDTITEL}">${x.poang}</span>`:''}
        </span>
        <span class="btext">${x.t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}…</span>
      </span>
      <span class="bverktyg">
        <button class="redigera" data-redigera-blad="${i}" title="Redigera uppgift">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
        </button>
        <button data-upp="${i}" title="Flytta upp" ${i===0?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button data-ner="${i}" title="Flytta ned" ${i===b.length-1?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="bort" data-bort="${x.id}" title="Ta bort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </span>
    </div>`).join('')
    : `<div class="tomt" style="padding:44px 16px"><h3>Bladet är tomt</h3>
       <p>Klicka på uppgifterna i mitten för att lägga till dem här.</p></div>`;

  $$('[data-redigera-blad]').forEach(k=>{
    k.addEventListener('pointerdown',e=>e.stopPropagation());
    k.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      öppnaUppgiftsredigering(state.blad[+k.dataset.redigeraBlad],true);
    });
  });
  $$('[data-upp]').forEach(k=>k.addEventListener('click',()=>{const i=+k.dataset.upp;
    [state.blad[i-1],state.blad[i]]=[state.blad[i],state.blad[i-1]];ritaBlad();}));
  $$('[data-ner]').forEach(k=>k.addEventListener('click',()=>{const i=+k.dataset.ner;
    [state.blad[i+1],state.blad[i]]=[state.blad[i],state.blad[i+1]];ritaBlad();}));
  $$('[data-bort]').forEach(k=>k.addEventListener('click',()=>vippa(k.dataset.bort)));
  $('#expPdf').disabled=$('#expWord').disabled=!b.length;

/* ── redigera uppgift före tillägg ── */
const UR=$('#uppgiftsred');
let urOriginal=null;
let urKopia=null;
let urRedigerarBlad=false;
let urBildHTML='';
let urOriginalBildHTML='';
let urBildBredd=100;
let urBildStorlekÄndrad=false;

function djupKopia(x){
  return JSON.parse(JSON.stringify(x));
}
function figurUr(html){
  const m=html.match(/<span class="fig[^"]*"[^>]*>[\s\S]*?<\/span>/i);
  if(m) return m[0];
  const s=html.match(/<svg\b[\s\S]*?<\/svg>/i);
  if(s) return `<span class="fig">${s[0]}</span>`;
  const im=html.match(/<img\b[^>]*>/i);
  return im?`<span class="fig">${im[0]}</span>`:'';
}
function utanFigur(html){
  return html
    .replace(/<span class="fig[^"]*"[^>]*>[\s\S]*?<\/span>/ig,'')
    .replace(/<svg\b[\s\S]*?<\/svg>/ig,'')
    .replace(/<img\b[^>]*>/ig,'')
    .trim();
}
function htmlTillRedigerbarText(html){
  const d=document.createElement('div');
  d.innerHTML=utanFigur(html);
  d.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  d.querySelectorAll('li').forEach(li=>{
    const p=li.parentElement;
    const idx=[...p.children].indexOf(li);
    li.insertAdjacentText('afterbegin',String.fromCharCode(97+idx)+') ');
    li.append('\n');
  });
  d.querySelectorAll('p').forEach(p=>p.append('\n\n'));
  return d.textContent.replace(/\n{3,}/g,'\n\n').trim();
}
function redigerbarTextTillHTML(text){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rader=text.replace(/\r/g,'').split('\n');
  let out='', lista=[];
  const tömLista=()=>{
    if(lista.length){ out+='<ol>'+lista.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'; lista=[]; }
  };
  rader.forEach(rad=>{
    const s=rad.trim();
    const m=/^[a-e]\)\s*(.*)$/i.exec(s);
    if(m){ lista.push(m[1]); return; }
    tömLista();
    if(s) out+='<p>'+esc(s)+'</p>';
  });
  tömLista();
  return out;
}

function figurBreddUrHTML(figHTML){
  const m=figHTML.match(/style\s*=\s*["'][^"']*width\s*:\s*(\d+(?:\.\d+)?)%/i);
  return m?Math.max(10,Math.min(180,Math.round(+m[1]/5)*5)):null;
}
function sättFigurBreddHTML(figHTML,pct){
  if(!figHTML)return figHTML;
  const box=document.createElement('div');
  box.innerHTML=figHTML;
  const fig=box.querySelector('.fig')||box.firstElementChild;
  if(!fig)return figHTML;
  fig.style.width=pct+'%';
  fig.style.maxWidth='none';
  return box.innerHTML;
}

function ritaUrBild(){
  const box=$('#ruBildbox');
  box.innerHTML=urBildHTML||'<span class="ru-ingenbild">Ingen figur i uppgiften</span>';
  if(urBildHTML&&urBildStorlekÄndrad){
    const fig=box.querySelector('.fig')||box.firstElementChild;
    if(fig){fig.style.width=urBildBredd+'%';fig.style.maxWidth='none';}
  }
  $('#ruBildstatus').textContent=urBildHTML?'Bild finns':'Ingen bild';
  $('#ruKopieraBild').disabled=!urBildHTML;
  $('#ruTaBortBild').disabled=!urBildHTML;
  $('#ruÅterBild').disabled=urBildHTML===urOriginalBildHTML;
  $('#ruBildStorlek').disabled=!urBildHTML;
  $('#ruÅterStorlek').disabled=!urBildHTML||!urBildStorlekÄndrad;
  $('#ruBildStorlek').value=urBildBredd;
  $('#ruBildStorlekVärde').textContent=urBildHTML?(urBildStorlekÄndrad?urBildBredd+' %':'Original'):'—';
}
function öppnaUppgiftsredigering(x,frånBlad=false){
  if(!x) return;
  urOriginal=x;
  urKopia=djupKopia(x);
  urRedigerarBlad=frånBlad;

async function figurSomPngBlob(figHTML){
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
  holder.innerHTML=figHTML;
  document.body.appendChild(holder);
  const svg=holder.querySelector('svg');
  const img0=holder.querySelector('img');
  try{
    let src,w=900,h=600;
    if(svg){
      const vb=svg.viewBox?.baseVal;
      if(vb&&vb.width&&vb.height){w=900;h=Math.round(900*vb.height/vb.width);}
      const xml=new XMLSerializer().serializeToString(svg);
      src=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
    }else if(img0){
      src=img0.src;
      w=img0.naturalWidth||900; h=img0.naturalHeight||600;
      const scale=Math.min(1,1200/w);w=Math.round(w*scale);h=Math.round(h*scale);
    }else throw new Error('Ingen bild');

    const im=new Image();
    if(!src.startsWith('data:')) im.crossOrigin='anonymous';
    await new Promise((ok,fel)=>{im.onload=ok;im.onerror=fel;im.src=src;});
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);
    if(svg) URL.revokeObjectURL(src);
    return await new Promise(ok=>c.toBlob(ok,'image/png'));
  }finally{holder.remove();}
}
async function kopieraBild(){
  if(!urBildHTML) return;
  const knapp=$('#ruKopieraBild');
  try{
    const blob=await figurSomPngBlob(urBildHTML);
    if(navigator.clipboard?.write && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      knapp.textContent='Bild kopierad!';
    }else{
      const svg=urBildHTML.match(/<svg\b[\s\S]*?<\/svg>/i);
      await navigator.clipboard.writeText(svg?svg[0]:urBildHTML);
      knapp.textContent='Bildkod kopierad!';
    }
  }catch(e){
    const svg=urBildHTML.match(/<svg\b[\s\S]*?<\/svg>/i);
    try{await navigator.clipboard.writeText(svg?svg[0]:urBildHTML);knapp.textContent='Bildkod kopierad!';}
    catch(_){knapp.textContent='Kunde inte kopiera';}
  }
  setTimeout(()=>knapp.textContent='Kopiera bild',1400);
}

}

/* ── ändra poäng och nivå ──
   Läraren klickar på nivåmärket eller poängen och justerar E, C och A var för sig.
   Nivån räknas om direkt: uppgiften hamnar på den högsta nivå som har minst lika
   många poäng som nivåerna under sig. Lika många A-poäng som C-poäng ger A-nivå. */
const REDTITEL='Klicka för att ändra poäng och nivå';
const PR=$('#poängred');
let redigerar=null;

function nivåAv(p){
  const max=Math.max(p.E,p.C,p.A);
  const vinnare=['E','C','A'].filter(n=>p[n]===max&&p[n]>0);
  return vinnare.length?vinnare.join('/'):'E';
}
function poängAv(x){
  const m=x.poang.match(/(\d+)\/(\d+)\/(\d+)/);
  return m?{E:+m[1],C:+m[2],A:+m[3]}:{E:0,C:0,A:0};
}
function sättPoäng(x,p){
  if(x.origPoang===undefined){ x.origPoang=x.poang; x.origNiva=x.niva; }
  x.poang=x.poang.replace(/(\d+)\/(\d+)\/(\d+)/,p.E+'/'+p.C+'/'+p.A);
  x.niva=nivåAv(p);
}
function ändrad(x){ return x.origPoang!==undefined && x.poang!==x.origPoang; }

function ritaPR(){
  const x=redigerar; if(!x) return;
  const p=poängAv(x);
  $('#prId').textContent=x.id;
  const nv=$('#prNiva'); nv.className='nivå '+x.niva.split('/')[0]; nv.textContent=x.niva;
  $('#prSumma').textContent=(p.E+p.C+p.A)+' p totalt';
  ['E','C','A'].forEach(n=>{
    PR.querySelector('[data-v="'+n+'"]').textContent=p[n];
    PR.querySelector('[data-minus="'+n+'"]').disabled=p[n]<=0;
    PR.querySelector('[data-plus="'+n+'"]').disabled=p[n]>=9;
  });
  $('#prÅterställ').disabled=!ändrad(x);
}
/* uppdaterar märkena på plats så att kortet inte ritas om under fingret */
function patchaMärken(x){
  document.querySelectorAll('.kort[data-id="'+x.id+'"]').forEach(k=>{
    const n=k.querySelector('.nivå');
    if(n){ n.className='nivå '+x.niva.split('/')[0]+(ändrad(x)?' ändrad':''); n.textContent=x.niva; }
    const p=k.querySelector('.poäng');
    if(p){ p.textContent=x.poang; p.classList.toggle('ändrad',ändrad(x)); }
  });
}
let nivåFörst=null;
function öppnaPoäng(id,ankare){
  const x=DB.bank.find(u=>u.id===id); if(!x) return;
  redigerar=x; nivåFörst=x.niva;
  PR.hidden=false;
  ritaPR();
  const r=ankare.getBoundingClientRect(), b=PR.getBoundingClientRect();
  let v=Math.min(Math.max(12,r.left-12),innerWidth-b.width-12);
  let t=r.bottom+8;
  if(t+b.height>innerHeight-12) t=Math.max(12,r.top-b.height-8);
  PR.style.left=v+'px'; PR.style.top=t+'px';
}
function stängPoäng(){
  if(!redigerar) return;
  const bytteNivå=redigerar.niva!==nivåFörst;
  redigerar=null; PR.hidden=true;
  if(bytteNivå) rita();
  ritaBlad();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-red]');
  if(t) öppnaPoäng(t.dataset.red,t);

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&redigerar){ stängPoäng(); return; }

PR.addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button'); if(!b||!redigerar) return;
  const x=redigerar;
  if(b.id==='prKlar'){ stängPoäng(); return; }
  if(b.id==='prÅterställ'){
    if(x.origPoang!==undefined){ x.poang=x.origPoang; x.niva=x.origNiva; }
  }else{
    const p=poängAv(x);
    if(b.dataset.plus)  p[b.dataset.plus]=Math.min(9,p[b.dataset.plus]+1);
    if(b.dataset.minus) p[b.dataset.minus]=Math.max(0,p[b.dataset.minus]-1);
    sättPoäng(x,p);
  }
  ritaPR(); patchaMärken(x); ritaBlad();
});

function körSlumpa(){
  const pool=urval(), fam=new Set(), ut=[];
  const n=Math.max(1,Math.min(40,parseInt($('#slumpaAntal').value,10)||12));
  $('#slumpaAntal').value=n;
  const vikt={E:5,C:4,A:3}, viktSum=12;
  const mål={}, rest=[];
  ['E','C','A'].forEach(k=>{
    const exakt=n*vikt[k]/viktSum;
    mål[k]=Math.floor(exakt);
    rest.push([k,exakt-mål[k]]);
  });
  let kvar=n-(mål.E+mål.C+mål.A);
  rest.sort((a,b)=>b[1]-a[1]);
  for(let i=0;i<kvar;i++) mål[rest[i%3][0]]++;
  ['E','C','A'].forEach(nv=>{
    const p=pool.filter(x=>x.niva===nv).sort(()=>Math.random()-.5);
    let c=0;
    for(const x of p){ if(c>=mål[nv])break; if(fam.has(x.familj))continue; fam.add(x.familj); ut.push(x); c++; }
  });
  state.blad=ut; rita(); ritaBlad();
  $('#slumppanel').classList.remove('öppen');
  $('#slumpaKnapp').setAttribute('aria-expanded','false');
}

/* Trimma tom SVG-yta vid utskrift.
   Används på figurer vars storlek har ändrats i redigeraren. */
function trimmaUtskriftsFigurer(root){
  if(!root)return;

  // getBBox fungerar inte på innehåll under display:none.
  // Gör därför utskriftsytan mätbar men helt osynlig utanför skärmen.
  const cs=getComputedStyle(root);
  const varDold=cs.display==='none';
  const gammalStyle=root.getAttribute('style');

  if(varDold){
    root.style.cssText=[
      'display:block',
      'position:fixed',
      'left:-100000px',
      'top:0',
      'width:180mm',
      'visibility:hidden',
      'pointer-events:none',
      'background:#fff'
    ].join(';');
  }

  root.querySelectorAll('.fig[style*="width"] svg').forEach(svg=>{
    try{
      const b=svg.getBBox();
      if(!b||!isFinite(b.x)||!isFinite(b.y)||b.width<=0||b.height<=0)return;

      // Liten marginal för strokes, pilspetsar och text.
      const padX=Math.max(3,b.width*.018);
      const padY=Math.max(3,b.height*.025);

      svg.setAttribute(
        'viewBox',
        `${b.x-padX} ${b.y-padY} ${b.width+2*padX} ${b.height+2*padY}`
      );
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      svg.setAttribute('preserveAspectRatio','xMinYMin meet');
      svg.style.width='100%';
      svg.style.height='auto';
      svg.style.display='block';
    }catch(_){}
  });

  if(varDold){
    if(gammalStyle===null)root.removeAttribute('style');
    else root.setAttribute('style',gammalStyle);
  }
}

function bladHTML({facit}){
  const t=$('#bTitel').value||'Övningsblad', kl=$('#bKlass').value, da=$('#bDatum').value;
  const vp=state.visaPoäng;
  const p={E:0,C:0,A:0}, antalN={E:0,C:0,A:0};
  state.blad.forEach(x=>{const m=x.poang.match(/(\d+)\/(\d+)\/(\d+)/);p.E+=+m[1];p.C+=+m[2];p.A+=+m[3];antalN[x.niva]++;});
  const tot=p.E+p.C+p.A;
  const rad=[AKTIV?AKTIV.titel:'',kl,da].filter(Boolean).join(' · ');
  const sammanfattning=vp
    ? `Max ${tot} poäng (${p.E}/${p.C}/${p.A}) · ${state.blad.length} uppgifter`
    : `${state.blad.length} uppgifter (${antalN.E} E / ${antalN.C} C / ${antalN.A} A)`;
  let h=`<div class="ph"><img src="${LOGO}" alt=""><div><h1>${t}</h1>
    <div class="pm">${rad?rad+' · ':''}${sammanfattning}</div></div></div>`;
  state.blad.forEach((x,i)=>{
    const märke=vp
      ? `<span class="pp">${x.poang}</span>`
      : `<span class="nivåmärke ${x.niva}">${x.niva}</span>`;
    h+=`<div class="pu"><div class="pn">${i+1}.</div><div>${märke}${x.t}</div></div>`;
  });
  if(facit){
    h+=`<div class="fk"><h1 style="font-size:14pt;margin-bottom:12pt">Facit</h1>`;
    state.blad.forEach((x,i)=>{ h+=`<div class="fu"><b>${i+1}.</b> ${LOS(x.s)}</div>`; });
    h+=`</div>`;
  }
  return h;
}
