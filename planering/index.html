<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeringsverktyg</title>
<meta name="theme-color" content="#0f172a">
<link id="favicon" rel="icon" type="image/png" href="">
<link id="favicon2" rel="apple-touch-icon" href="">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#667085;
  --line:#d9dee5; --accent:#0f766e; --accent2:#e6fffb;
  --holiday:#e8eaed; --danger:#b42318; --shadow:0 8px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:#111827;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
header h1{font-size:20px;margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #d0d5dd;background:white;border-radius:8px;padding:8px 12px;font-weight:600}
.btn.primary{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.dark{background:#1f2937;border-color:#475569;color:#fff}
.btn.danger{color:#b42318}
.layout{display:grid;grid-template-columns:372px 1fr;gap:18px;max-width:1500px;margin:18px auto;padding:0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel h2{font-size:15px;margin:0;padding:15px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:14px 16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #cfd5dd;border-radius:7px;padding:8px 9px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{font-size:12px;color:var(--muted);line-height:1.45}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fafafa}
.tab{padding:11px 14px;border:0;background:transparent;font-weight:700;color:#667085}
.tab.active{color:#0f766e;border-bottom:2px solid #0f766e}
.tabpane{display:none}.tabpane.active{display:block}
.tabpane.body{max-height:calc(100vh - 190px);overflow-y:auto}
.card{border:1px solid #d7dce2;border-radius:9px;padding:10px 11px;margin-bottom:8px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.04);cursor:grab}
.card:active{cursor:grabbing}
.card .title{font-weight:700;font-size:13px}
.card .meta{font-size:11px;color:#667085;margin-top:4px}
.card .actions{display:flex;gap:5px;margin-top:8px}
.card .actions button{font-size:11px;padding:4px 7px}
.card.dragging{opacity:.45}
.cbrow{display:flex;align-items:center;gap:8px;font-weight:600;color:#344054;margin:0 0 7px 0;font-size:13px}
.cbrow input{width:auto}
.lab-item{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;border:1px solid #d7dce2;border-radius:8px;padding:8px 9px;margin-bottom:7px;background:#fff}
.lab-item .wk{font-weight:800;font-size:12px;color:#0f766e;text-align:center}
.lab-item .wk .wd{font-size:9px;font-weight:700;color:#98a2b3;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.lab-item input[type=text]{padding:6px 8px;font-size:12px}
.lab-item .study{grid-column:2;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#667085}
.lab-item .study select{padding:5px 6px;font-size:12px}
.lab-item.off{opacity:.55}
.period{border:1px solid #d7dce2;border-radius:9px;padding:9px;margin-bottom:8px;background:#fff}
.period .head{display:grid;grid-template-columns:1fr 50px 50px 24px;gap:5px;align-items:center}
.period .head select,.period .head input{padding:6px 5px;font-size:12px}
.period .del{border:0;background:transparent;color:#98a2b3;font-size:15px;font-weight:700;padding:0}
.period .del:hover{color:#b42318}
.period .lbl{font-size:10px;color:#98a2b3;font-weight:700;text-align:center}
.period .days{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.period .days label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#344054;margin:0}
.period .days input{width:auto}
.period .labday{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-top:8px}
.period .labday span{font-size:10px;color:#98a2b3;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.period .labday select{padding:6px 5px;font-size:12px}
.period .name{font-weight:700;font-size:13px;color:#0f766e}
.print-header{display:none}
.print-header img{width:95px;height:auto;object-fit:contain}
.print-header h1{font-family:Georgia,serif;font-size:20px;margin:0;text-align:center;flex:1}
.schedule-wrap{overflow:auto;max-height:calc(100vh - 120px)}
.schedule{min-width:900px;border-collapse:collapse;width:100%;background:#fff;table-layout:fixed}
.schedule th{background:#e1e3e5;font-size:12px;text-align:left;padding:8px;border:1px solid #adb3b9;position:sticky;top:0;z-index:2;box-shadow:inset 0 1px 0 #adb3b9,inset 0 -1px 0 #adb3b9}
.schedule td{border:1px solid #adb3b9;padding:6px;vertical-align:top;height:56px;font-size:12px;overflow-wrap:break-word}
.schedule .week{text-align:center;font-weight:800;background:#f3f4f6}
.schedule .date{color:#667085;white-space:nowrap;background:#f5f7f9}
.schedule .blocked .date{background:var(--holiday)}
.schedule .lab-row .date{background:#effcfa}
.schedule .dnum{color:#98a2b3;font-size:11px}
.lesson-cell{min-height:40px;padding:6px;border-radius:6px}
.lesson-cell.drop{outline:2px dashed #0f766e;background:#f0fdfa}
.lesson-cell.drop-before{box-shadow:inset 0 4px 0 #0f766e}
.lesson-cell.drop-after{box-shadow:inset 0 -4px 0 #0f766e}
.lesson-title{font-weight:700}
.placed{cursor:grab}
.placed:active{cursor:grabbing}
.placed.dragging{opacity:.4}
.placed{display:flex;align-items:flex-start;gap:6px;justify-content:space-between}
.placed .rm{border:0;background:transparent;color:#98a2b3;font-size:14px;line-height:1;padding:0 2px;font-weight:700}
.placed .rm:hover{color:#b42318}
.badge{display:inline-block;background:#e6fffb;color:#0f766e;border:1px solid #99f6e4;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle}
.status{font-size:12px;color:#475467;font-weight:600;margin:10px 0 0 0;text-align:center}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.titlerow{display:grid;grid-template-columns:1fr auto;gap:6px}
.titlerow .btn{white-space:nowrap}
#bulkText{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical}
#bulkInfo{margin-top:10px;font-weight:600;color:#0f766e}
.lab-row td{background:#effcfa}
.lab-row .date{color:#0f766e;font-weight:700}
.lab-label{font-weight:700;color:#0f766e}
.lab-row.study td{background:var(--holiday)}
.lab-row.study .lab-label{color:#343a40}
.lesson-pages{color:#667085;font-size:11px;margin-top:2px}
.lesson-note{font-weight:600}
.blocked{background:var(--holiday)!important;color:#343a40}
.blocked td{background:var(--holiday)}
.blocked .lesson-cell{opacity:.75}
.block-label{font-weight:800}
.exam{background:#fde3e1;color:#912018;font-weight:700;padding:1px 5px;border-radius:4px;display:inline-block}
.blocked .exam{background:#fbc9c4}
.muted{color:#98a2b3}
.selected{box-shadow:0 0 0 2px #0f766e inset}
.empty{color:#98a2b3;text-align:center;padding:16px 8px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);align-items:center;justify-content:center;z-index:10}
.modal{width:min(560px,calc(100vw - 30px));background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:16px;border-bottom:1px solid var(--line)}
.modal .content{padding:16px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.small{font-size:11px}
.ctx{display:none;position:fixed;z-index:20;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:5px;min-width:190px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:600;color:#344054}
.ctx button:hover{background:#f0fdfa;color:#0f766e}
.ctx button.danger:hover{background:#fef3f2;color:#b42318}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{order:2}}
@media print{
  /* Webbläsare struntar annars i bakgrundsfärger vid utskrift/PDF-export.
     Detta tvingar fram samma nyanser som syns i verktyget. */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
  body{background:white}
  header,.sidebar,.no-print{display:none!important}
  .layout{display:block;margin:0;padding:0}
  .panel{box-shadow:none;border:0}
  .print-header{display:flex;align-items:center;gap:20px;margin:0 0 10px 0}
  .print-header h1{font-size:20px}
  .schedule-wrap{overflow:visible;max-height:none}
  .tabpane.body{max-height:none;overflow:visible}
  .schedule th{position:static;box-shadow:none}
  .schedule{min-width:0;font-size:10px}
  .schedule td{height:auto;padding:4px}
  @page{size:A4 landscape;margin:10mm}
}

/* Veckomarkering: nyanser i vecko- och dagkolumnen samt linje vid veckoskifte. */
.schedule .week{background:#dbe9fa;color:#1e4976}
.schedule .date{background:#eef5fd;color:#546a85}
.schedule tr.wk-alt .week{background:#c7dcf5}
.schedule tr.wk-alt .date{background:#e0edfb}
.schedule tr.wk-start td{border-top:2px solid #94a8c2}
.schedule tr.blocked td{background:var(--holiday)}
.schedule tr.lab-row td{background:#effcfa}
.schedule tr.lab-row.study td{background:var(--holiday)}
.schedule tbody tr:hover td{box-shadow:inset 0 0 0 9999px rgba(15,118,110,.045)}

/* Interaktionsstilar: hover, fokus och aktiva lägen. */
:root{--ring:rgba(15,118,110,.22);--ink:#0f172a}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#134e4a 100%);box-shadow:0 2px 14px rgba(2,6,23,.28);position:relative;z-index:5}
header h1{letter-spacing:-.015em;font-weight:700}
header .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#e8edf2;backdrop-filter:blur(6px)}
header .btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
header .btn.primary{background:linear-gradient(180deg,#15b8a6,#0f766e);border-color:transparent;color:#fff}
header .btn.primary:hover{background:linear-gradient(180deg,#1ac8b5,#12857c)}
.btn{color:#344054;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .07s ease;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn:hover{background:#f8fafb;border-color:#b8c0cb}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(16,24,40,.12)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn.primary{background:linear-gradient(180deg,#12857c,#0f766e);border-color:#0b5c56;color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.16)}
.btn.primary:hover{background:linear-gradient(180deg,#149a8f,#106d66);border-color:#0b5c56}
.btn.danger{background:#fff;border-color:#f1c9c5;color:#b42318}
.btn.danger:hover{background:#fef4f3;border-color:#e5a49e}
.panel{border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px rgba(16,24,40,.07)}
.panel h2{letter-spacing:-.01em}
.tabs{border-radius:14px 14px 0 0;overflow:hidden;background:linear-gradient(180deg,#fbfcfd,#f4f6f8)}
.tab{transition:color .15s ease,background .15s ease}
.tab:hover{color:#0f766e;background:rgba(15,118,110,.06)}
.tab.active{background:#fff}
label{letter-spacing:.02em}
input,select,textarea{transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input:hover,select:hover,textarea:hover{border-color:#b8c0cb}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.card{transition:box-shadow .16s ease,border-color .16s ease,transform .08s ease}
.card:hover{box-shadow:0 6px 16px rgba(16,24,40,.10);border-color:#c4ccd7}
.card:active{transform:scale(.994)}
.card .actions button{border-radius:6px}
.period,.lab-item,.period-row{transition:border-color .15s ease,box-shadow .15s ease}
.period:hover,.lab-item:hover,.period-row:hover{border-color:#c4ccd7;box-shadow:0 3px 10px rgba(16,24,40,.06)}
.modal{border-radius:16px;box-shadow:0 30px 70px rgba(2,6,23,.32);animation:pop .16s cubic-bezier(.2,.8,.3,1)}
.modal-backdrop{backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.ctx{animation:pop .12s cubic-bezier(.2,.8,.3,1);border-radius:11px}
.ctx button{transition:background .12s ease,color .12s ease}
.lesson-cell{border-radius:7px;transition:background .12s ease,box-shadow .12s ease}
.lesson-cell:hover{background:rgba(15,118,110,.05)}
.placed .rm{transition:color .12s ease,background .12s ease;border-radius:5px}
.placed .rm:hover{background:#fef3f2}
.badge{letter-spacing:.03em;text-transform:uppercase}
.schedule th{letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.schedule-wrap,.tabpane.body{scrollbar-width:thin;scrollbar-color:#c3cbd6 transparent}
.schedule-wrap::-webkit-scrollbar,.tabpane.body::-webkit-scrollbar{width:11px;height:11px}
.schedule-wrap::-webkit-scrollbar-thumb,.tabpane.body::-webkit-scrollbar-thumb{background:#c8d0da;border-radius:99px;border:3px solid transparent;background-clip:content-box}
.schedule-wrap::-webkit-scrollbar-thumb:hover,.tabpane.body::-webkit-scrollbar-thumb:hover{background:#aab4c2;background-clip:content-box}
@media print{
  .schedule tbody tr:hover td{box-shadow:none}
  .schedule tr.wk-start td{border-top:2px solid #7a8ea8}
}
.tabs{display:flex}
.tab{flex:1;padding:12px 4px;text-align:center;white-space:nowrap;font-size:12.5px;letter-spacing:-.01em}

.btn.sm{padding:6px 8px;font-size:12px;font-weight:600}
.btnrow.tight{gap:6px;margin-bottom:8px}
.holidaybox{border:1px solid #d7dce2;border-radius:11px;padding:11px;background:linear-gradient(180deg,#fbfcfe,#f5f8fb);margin-bottom:10px}
.hb-title{font-size:12px;font-weight:800;color:#475467;letter-spacing:.02em;margin-bottom:9px}
.hb-row{display:grid;grid-template-columns:74px 1fr;gap:8px}
.hb-lbl{display:block;font-size:10px;font-weight:700;color:#98a2b3;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.hb-row input{padding:7px 8px;font-size:12px}
select.par-even{background:#eaf2fd;border-color:#bcd4f0;color:#1e4976}
select.par-odd{background:#fdf4e7;border-color:#f0dcbb;color:#7a5320}
select.par-all{background:#e9f8f6;border-color:#b7e5de;color:#0b5c56}
select.st-lab{background:#e9f8f6;border-color:#b7e5de;color:#0b5c56}
select.st-off{background:#f1f2f4;border-color:#d5d9df;color:#475467}

.dangerbox{border:1px solid #f0d4d1;border-radius:11px;padding:11px;background:linear-gradient(180deg,#fffbfb,#fdf4f3);margin-top:16px}
.dangerbox .hb-title{color:#b42318;margin-bottom:8px}

.card.exam-card{border-color:#f0c4c0;background:linear-gradient(180deg,#fffbfb,#fdf4f3)}
.card.exam-card .title{color:#912018}
.card.exam-card:hover{border-color:#e5a49e}
.schedule tr td.exam-cell{background:#fde3e1}
.schedule tr.wk-alt td.exam-cell{background:#fbd6d3}
.lesson-title.exam-lesson{color:#912018}
td.exam-cell .exam{background:transparent;padding:0}
td.exam-cell .lesson-cell:hover{background:rgba(145,32,24,.06)}

.searchrow{position:relative;margin-bottom:10px}
.searchrow input{padding:8px 62px 8px 10px;font-size:12.5px}
.searchcount{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#98a2b3;pointer-events:none}
.card.used{background:linear-gradient(180deg,#fbfefd,#f6fbfa)}
.badge.used-badge{background:#0f766e;border-color:#0f766e;color:#fff}
.card.exam-card.used{background:linear-gradient(180deg,#fffbfb,#fdf4f3)}

.card.fixed-card{border:1.5px solid #94a3b8;box-shadow:0 2px 6px rgba(16,24,40,.07)}
.card.fixed-card:hover{border-color:#64748b}
.card.exam-card.fixed-card{border-color:#e5a49e}
.card.exam-card.fixed-card:hover{border-color:#d1837c}

.schedule td.slot{padding:0;vertical-align:top}
.lesson-cell{min-height:52px;display:flex;align-items:center;padding:8px 9px;border-radius:0;margin:0}
.lesson-cell.grabbable{cursor:grab}
.lesson-cell.grabbable:active{cursor:grabbing}
.lesson-cell.dragging{opacity:.45}
.placed{flex:1;min-width:0;align-items:center}
.placed .lesson-title{min-width:0;overflow-wrap:break-word}

.schedule td.slot .lab-label{display:flex;align-items:center;min-height:52px;padding:8px 9px}

.lesson-title,.block-label,.lab-label{font-size:13.5px;line-height:1.35}
.schedule td.slot{font-size:13.5px}

.badge.count-badge{background:#eef2f6;border-color:#d5dbe3;color:#475467}

.lnk{color:#1155cc;text-decoration:underline;word-break:break-word}
.lnk:hover{color:#0b4bc7}
.schedule .other-cell div+div{margin-top:3px}

/* Utskrift: A4 stående med anpassade kolumnbredder och textstorlekar. */
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  .print-header{gap:14px;margin:0 0 8px 0}
  .print-header img{width:62px}
  .print-header h1{font-size:15pt}
  .schedule{table-layout:fixed;width:100%;font-size:8.5pt;min-width:0}
  .schedule th{font-size:7pt;padding:3px 4px;letter-spacing:.02em}
  .schedule td{padding:3px 4px;height:auto;vertical-align:top}
  .schedule .week{width:7%}
  .schedule .date{width:15%;font-size:7.5pt}
  .schedule .slot{width:36%}
  .schedule td:nth-child(4){width:9%}
  .schedule td:nth-child(5){width:33%;font-size:7.5pt}
  .schedule td.slot{padding:3px 4px}
  .lesson-cell{min-height:0;display:block;padding:0;margin:0}
  .schedule td.slot .lab-label{min-height:0;display:block;padding:0}
  .lesson-title,.block-label,.lab-label{font-size:8.5pt;line-height:1.25}
  .placed .rm{display:none}
  .lnk{word-break:break-all;font-size:7.5pt}
  .schedule tr{page-break-inside:avoid}
  .schedule thead{display:table-header-group}
}

/* Lediga rader är gråa i alla kolumner utom veckonumret, som gäller hela veckan. */
.schedule tr.blocked td,
.schedule tr.blocked td.date,
.schedule tr.wk-alt.blocked td.date{background:var(--holiday);color:#343a40}
.schedule tr.lab-row.study td,
.schedule tr.lab-row.study td.date{background:var(--holiday)}
.schedule tr.blocked td.week,
.schedule tr.lab-row.study td.week{background:#dbe9fa;color:#1e4976;font-weight:800}
.schedule tr.wk-alt.blocked td.week,
.schedule tr.wk-alt.lab-row.study td.week{background:#c7dcf5}

.period .days label{justify-content:space-between}
.dblbtn{border:1px solid #d0d5dd;background:#fff;border-radius:99px;font-size:10px;font-weight:700;
  padding:2px 7px;color:#98a2b3;margin-left:auto}
.dblbtn.on{background:#0f766e;border-color:#0f766e;color:#fff}
.dblbtn:hover{border-color:#0f766e;color:#0f766e}
.dblbtn.on:hover{color:#fff;background:#0b5c56}

.badge.lock-badge{background:#eef2f6;border-color:#cbd5e1;color:#475467}
.locked-title::after{content:"·  låst";font-size:10px;font-weight:700;color:#98a2b3;margin-left:6px;letter-spacing:.02em}

.card .actions .place{background:#e9f8f6;border-color:#b7e5de;color:#0b5c56;font-weight:700}
.card .actions .place:hover{background:#d7f2ee;border-color:#8fd8ce}

/* Prov som ligger som eget pass behåller sin röda cell trots att raden är blockerad. */
.schedule tr.blocked td.exam-cell{background:#fde3e1}
.schedule tr.wk-alt.blocked td.exam-cell{background:#fbd6d3}
.schedule tr.blocked td.exam-cell .block-label{color:#912018}
.schedule tr.blocked td.exam-cell .exam{background:transparent}

.card{position:relative}
.card .place{position:absolute;top:7px;right:7px;border:1px solid #b7e5de;background:#e9f8f6;color:#0b5c56;
  border-radius:7px;width:24px;height:22px;line-height:1;font-size:13px;font-weight:700;padding:0}
.card .place:hover{background:#d7f2ee;border-color:#8fd8ce}
.card .title{padding-right:30px}
.card.drop-top{box-shadow:inset 0 3px 0 #0f766e}
.card.drop-bot{box-shadow:inset 0 -3px 0 #0f766e}
</style>
</head>
<body>
<header>
  <div><h1 id="docTitle">Planering</h1></div>
  <div class="toolbar no-print">
    <button class="btn" onclick="saveProject()">Spara</button>
    <button class="btn" onclick="loadProject()">Öppna</button>
    <button class="btn primary" onclick="exportWord()">Exportera Word</button>
    <button class="btn primary" onclick="window.print()">Exportera PDF / skriv ut</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <div class="tabs">
        <button class="tab active" onclick="showTab('settings',this)">Inställningar</button>
        <button class="tab" onclick="showTab('lessons',this)">Lektioner</button>
        <button class="tab" onclick="showTab('labs',this)">Laborationer</button>
      </div>
      <div id="settings" class="tabpane active body">
        <div class="field"><label>Rubrik</label>
          <div class="titlerow">
            <input id="titleInput" value="Planering av Fysik 1 - 2026/2027" oninput="state.title=this.value;render()">
            <button class="btn" onclick="newPlan()">Ny planering</button>
          </div>
        </div>
        <div class="field"><label>Sparade planeringar</label>
          <div class="titlerow">
            <select id="planSelect" onchange="switchPlan(this.value)"></select>
            <button class="btn sm" onclick="duplicatePlan()">Kopiera</button>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>Första vecka</label><input id="startWeek" type="number" value="34"></div>
          <div class="field"><label>Sista vecka</label><input id="endWeek" type="number" value="24"></div>
        </div>
        <div class="field"><label>Måndag i första veckan</label>
          <input id="startDate" type="date" onchange="setStartDate(this.value)">
        </div>
        <div class="field"><label>Perioder och lektionsdagar</label>
          <div id="periodList"></div>
          <button class="btn" style="width:100%;margin-top:6px" onclick="addPeriod()">+ Lägg till period</button>
        </div>
        <button class="btn primary" style="width:100%" onclick="rebuildSchedule()">Skapa / uppdatera schema</button>
        <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
        <div class="holidaybox">
          <div class="hb-title">Lov och lediga veckor</div>
          <div class="hb-row">
            <div><span class="hb-lbl">Vecka</span><input id="blockWeek" type="number" placeholder="44"></div>
            <div><span class="hb-lbl">Text i schemat</span><input id="blockLabel" list="freeSuggest" placeholder="Lov"></div>
          </div>
          <button class="btn primary" style="width:100%;margin-top:9px" onclick="blockWeek()">Markera veckan som ledig</button>
        </div>
        <button class="btn" style="width:100%;margin-bottom:8px" onclick="openDates()">Studiedagar och lediga datum</button>
        <button class="btn" style="width:100%" onclick="openExams()">Lägg till prov</button>
        <div class="dangerbox">
          <button class="btn sm" style="width:100%;margin-bottom:6px" onclick="restoreDays()">Återställ borttagna dagar</button>
          <div class="btnrow tight" style="margin-bottom:0">
            <button class="btn sm danger" onclick="clearPlan()">Rensa planeringen</button>
            <button class="btn sm danger" onclick="deletePlan()">Ta bort planeringen</button>
          </div>
        </div>
      </div>
      <div id="lessons" class="tabpane body">
        <div class="btnrow">
          <button class="btn primary" onclick="openLesson()">+ Ny lektion</button>
          <button class="btn primary" onclick="openBulk()">Lägg in flera</button>
        </div>
        <div class="btnrow tight" style="grid-template-columns:1fr">
          <button class="btn sm" onclick="saveCourse()">Spara lektioner för kurs</button>
          <button class="btn sm" onclick="loadCourse()">Ladda lektioner för kurs</button>
        </div>
        <div class="btnrow tight">
          <button class="btn sm" onclick="autoPlace()">Placera ut automatiskt</button>
          <button class="btn sm danger" onclick="clearPlan()">Rensa planeringen</button>
        </div>
        <div class="status" id="planStatus"></div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div class="searchrow">
          <input id="lessonSearch" placeholder="Sök lektion eller sida" oninput="renderLessons()">
          <span class="searchcount" id="lessonCount"></span>
        </div>
        <div id="lessonList"></div>
        <button class="btn sm" style="width:100%;margin-top:4px" onclick="sortLessonsByPage()">Sortera efter sidnummer</button>
      </div>
      <div id="labs" class="tabpane body">
        <label class="cbrow"><input type="checkbox" id="labEnabled"> Använd laborationer</label>
        <div class="field" style="margin-top:12px"><label>Perioder för laborationer</label>
          <div id="labPeriods"></div>
          <button class="btn" style="width:100%;margin-top:6px" onclick="addLabPeriod()">+ Lägg till labbperiod</button>
        </div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div id="labList"></div>
      </div>
    </div>
  </aside>

  <main class="panel">
    <div class="print-header">
      <img id="logoImg" alt="Erik Dahlbergsgymnasiet">
      <div>
        <h1 id="printTitle">Planering</h1>
      </div>
    </div>
    <div class="schedule-wrap">
      <table class="schedule" id="scheduleTable"></table>
    </div>
  </main>
</div>

<div class="ctx no-print" id="ctxMenu"></div>

<div class="modal-backdrop" id="examModal">
  <div class="modal">
    <h3>Lägg till prov</h3>
    <div class="content">
      <textarea id="eText" rows="8" oninput="state.examText=this.value;saveLocal()" placeholder="Ett datum per rad, valfri text efter:&#10;16/12 Prov&#10;25/3 Prov kap 1-4&#10;2027-05-14"></textarea>
      <div class="help" id="eInfo">Provet läggs i Övrigt-kolumnen, så lektionen ligger kvar.</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeExams()">Avbryt</button>
      <button class="btn primary" onclick="importExams()">Lägg in</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="dateModal">
  <div class="modal">
    <h3>Studiedagar och lediga datum</h3>
    <div class="content">
      <textarea id="dText" rows="10" oninput="state.dateText=this.value;saveLocal()" placeholder="Ett datum per rad, valfri text efter:&#10;15/9 Studiedag&#10;2/10 Studieresa&#10;2027-05-01"></textarea>
      <div class="help" id="dInfo"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeDates()">Avbryt</button>
      <button class="btn primary" onclick="importDates()">Lägg in</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="noteModal">
  <div class="modal">
    <h3>Kommentar i Övrigt</h3>
    <div class="content">
      <div class="field"><label>Text</label><input id="nText" placeholder="t.ex. Prov tisdag 14/5"></div>
      <input type="hidden" id="nSlot">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeNote()">Avbryt</button>
      <button class="btn primary" onclick="saveNote()">Spara</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="labModal">
  <div class="modal">
    <h3>Laborationspass</h3>
    <div class="content">
      <div class="field"><label>Typ</label><select id="lStatus"></select></div>
      <div class="field"><label>Text i schemat</label><input id="lText" placeholder="t.ex. Densitet"></div>
      <input type="hidden" id="lWeek">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeLab()">Avbryt</button>
      <button class="btn primary" onclick="saveLab()">Spara</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="freeModal">
  <div class="modal">
    <h3>Ingen lektion</h3>
    <div class="content">
      <div class="field"><label>Vad står i schemat i stället</label>
        <input id="fType" list="freeSuggest" placeholder="Studiedag">
        <datalist id="freeSuggest">
          <option>Studiedag</option><option>Ingen lektion</option><option>Ledig</option>
          <option>Höstlov</option><option>Jullov</option><option>Sportlov</option><option>Påsklov</option>
        </datalist>
      </div>
      <input type="hidden" id="fSlot">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeFree()">Avbryt</button>
      <button class="btn primary" onclick="saveFree()">Spara</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="bulkModal">
  <div class="modal">
    <h3>Lägg in flera lektioner</h3>
    <div class="content">
      <textarea id="bulkText" rows="12" placeholder="Klistra in avsnitt och sidor från en gammal planering" oninput="previewBulk()"></textarea>
      <label class="cbrow" style="margin-top:10px"><input type="checkbox" id="bulkSkipLov" checked onchange="previewBulk()"> Hoppa över lov och lediga rader</label>
      <label class="cbrow"><input type="checkbox" id="bulkSkipEmpty" onchange="previewBulk()"> Hoppa över rader utan sidhänvisning</label>
      <div class="help" id="bulkInfo"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeBulk()">Avbryt</button>
      <button class="btn primary" onclick="importBulk()">Lägg in</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Ny lektion</h3>
    <div class="content">
      <div class="field"><label>Avsnitt / lektion</label><input id="mTitle"></div>
      <div class="field"><label>Sidor</label><input id="mPages" placeholder="t.ex. 307–310"></div>
      <div class="field"><label>Övrigt</label><input id="mOther" placeholder="t.ex. Laboration:"></div>
      <div class="field"><label>Extra anteckning</label><input id="mNote" placeholder="Valfritt"></div>
      <div id="mReusableRow">
        <label class="cbrow"><input type="checkbox" id="mReusable"> Fast pass – visas överst i listan</label>
        <label class="cbrow"><input type="checkbox" id="mExam"> Examination – markeras röd i schemat</label>
        <label class="cbrow"><input type="checkbox" id="mLock"> Lås i schemat – förskjuts inte av andra lektioner</label>
      </div>
      <input type="hidden" id="mId">
      <input type="hidden" id="mSlot">
    </div>
    <div class="actions">
      <button class="btn danger" id="mReset" onclick="resetSlot()">Återställ</button>
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" onclick="saveLesson()">Spara</button>
    </div>
  </div>
</div>

const DAYS=["Måndag","Tisdag","Onsdag","Torsdag","Fredag"];
let state={
 title:"Planering av Fysik 1 - 2026/2027",
 startWeek:34,endWeek:24,
 periods:[], labPeriods:[],
 slots:[], lessons:[], blockedWeeks:[], blockedSlots:[],
 labs:{enabled:false, day:"Fredag", items:{}}
};
function defaultLabs(){return {enabled:false, day:"Fredag", items:{}}}

const seedLessons=[
 {id:"rep",title:"Repetition",pages:"",other:"",reusable:true},
 {id:"prov",title:"Prov",pages:"",other:"",reusable:true},
 {id:"reserv",title:"Reserv",pages:"",other:"",reusable:true}
];

function uid(){return "l"+Math.random().toString(36).slice(2,9)}
// ISO-veckonummer. Vissa år har 53 veckor (t.ex. 2026), därför räknas
// veckorna fram ur kalendern när ett startdatum är angivet.
function isoWeek(d){
 const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 t.setDate(t.getDate()+3-((t.getDay()+6)%7));
 const week1=new Date(t.getFullYear(),0,4);
 return 1+Math.round(((t-week1)/86400000-3+((week1.getDay()+6)%7))/7);
}
function weeksInYear(y){return isoWeek(new Date(y,11,28))}
function weekSequence(a,b){
 if(a===b)return [a];
 const base=state.startDate?mondayOf(state.startDate):null;
 if(base){
   const out=[isoWeek(base)];
   const d=new Date(base);
   for(let i=0;i<70&&out[out.length-1]!==b;i++){
     d.setDate(d.getDate()+7);
     out.push(isoWeek(d));
   }
   if(out[out.length-1]===b)return out;
 }
 // Utan startdatum antas läsåret sluta på 52 eller 53 veckor.
 const last=weeksInYear(new Date().getFullYear());
 let out=[];
 if(a<=b){for(let w=a;w<=b;w++)out.push(w)}
 else {for(let w=a;w<=last;w++)out.push(w);for(let w=1;w<=b;w++)out.push(w)}
 return out;
}
// En period styr vilka veckodagar som har lektion. Första perioden som matchar
// veckan gäller, så specifika spann kan ligga före ett generellt spann som
// täcker resten av läsåret. Laborationerna har egna perioder, se labPeriods.
function coversWeek(p,w,ws){
 const parityOk = p.parity==="all" || (w%2===0 ? p.parity==="even" : p.parity==="odd");
 if(!parityOk)return false;
 const i=ws.indexOf(w);
 let a=ws.indexOf(+p.from); if(a<0)a=0;
 let b=ws.indexOf(+p.to); if(b<0)b=ws.length-1;
 if(a>b){const t=a;a=b;b=t}
 return i>=a&&i<=b;
}
function periodFor(week,ws){return (state.periods||[]).find(p=>coversWeek(p,week,ws))}
function defaultRange(){
 const ws=scheduleWeeks();
 return ws.length?{from:ws[0],to:ws[ws.length-1]}:{from:state.startWeek,to:state.endWeek};
}
// Bakåtkompatibilitet: separata jämna/udda dagar och labbregler konverteras till perioder.
function normalizePeriods(){
 if(Array.isArray(state.periods)&&state.periods.length)return;
 const ws=weekSequence(state.startWeek,state.endWeek);
 const evenDays=state.evenDays||["Måndag","Onsdag"];
 const oddDays=state.oddDays||["Måndag","Onsdag"];
 const out=[];
 const old=(state.labs&&Array.isArray(state.labs.rules))?state.labs.rules:[];
 old.forEach(r=>out.push({parity:r.parity,from:r.from,to:r.to,days:(r.parity==="odd"?oddDays:evenDays).slice(),lab:true}));
 out.push({parity:"even",from:ws[0],to:ws[ws.length-1],days:evenDays.slice(),lab:false});
 out.push({parity:"odd",from:ws[0],to:ws[ws.length-1],days:oddDays.slice(),lab:false});
 state.periods=out;
 delete state.evenDays;delete state.oddDays;delete state.lessonsPerWeek;
 if(state.labs)delete state.labs.rules;
}
// Bakåtkompatibilitet: labbflaggan på en lektionsperiod konverteras till en
// egen labbperiod med samma veckospann och veckodag.
function normalizeLabPeriods(){
 if(Array.isArray(state.labPeriods))return;
 const day=(state.labs&&state.labs.day)||"Fredag";
 const out=[];
 (state.periods||[]).forEach(p=>{
   if(p.lab)out.push({parity:p.parity,from:p.from,to:p.to,day});
 });
 (state.periods||[]).forEach(p=>{delete p.lab});
 state.labPeriods=out;
}
function addPeriod(){
 const r=defaultRange();
 state.periods.push({parity:"all",from:r.from,to:r.to,days:["Måndag","Onsdag"]});
 rebuildSchedule();
}
function addLabPeriod(){
 const r=defaultRange();
 state.labPeriods.push({parity:"all",from:r.from,to:r.to,day:"Fredag"});
 render();
}
function parityOptions(v){
 return `<option value="even"${v==="even"?" selected":""}>Jämna veckor</option>
         <option value="odd"${v==="odd"?" selected":""}>Udda veckor</option>
         <option value="all"${v==="all"?" selected":""}>Varje vecka</option>`;
}
function rangeHeader(el){
 el.insertAdjacentHTML("beforeend",'<div class="head" style="display:grid;grid-template-columns:1fr 50px 50px 24px;gap:5px;margin-bottom:3px"><div></div><div class="lbl">från</div><div class="lbl">till</div><div></div></div>');
}
function renderPeriods(){
 const el=document.getElementById("periodList");
 el.innerHTML="";
 if(!state.periods.length){el.innerHTML='<div class="empty" style="padding:8px">Inga perioder ännu.</div>';return}
 rangeHeader(el);
 state.periods.forEach((p,k)=>{
   const box=document.createElement("div");
   box.className="period";
   box.innerHTML=`<div class="head">
       <select>${parityOptions(p.parity)}</select>
       <input type="number" value="${esc(p.from)}">
       <input type="number" value="${esc(p.to)}">
       <button class="del" type="button" title="Ta bort period">×</button>
     </div><div class="days"></div>`;
   const sel=box.querySelector("select");
   const [from,to]=box.querySelectorAll('input[type=number]');
   sel.className="par-"+p.parity;
   sel.onchange=()=>{p.parity=sel.value;rebuildSchedule()};
   from.onchange=()=>{p.from=+from.value;rebuildSchedule()};
   to.onchange=()=>{p.to=+to.value;rebuildSchedule()};
   box.querySelector(".del").onclick=()=>{state.periods.splice(k,1);rebuildSchedule()};
   const days=box.querySelector(".days");
   DAYS.forEach(d=>{
     const on=(p.days||[]).includes(d);
     const lab=document.createElement("label");
     const cb=document.createElement("input");
     cb.type="checkbox";cb.checked=on;
     cb.onchange=()=>{
       p.days=DAYS.filter(x=>x===d?cb.checked:(p.days||[]).includes(x));
       if(!cb.checked)p.dbl=(p.dbl||[]).filter(x=>x!==d);
       rebuildSchedule();
     };
     lab.append(cb,document.createTextNode(d));
     // Två lektioner samma veckodag anges med en liten växlare.
     if(on){
       const dbl=(p.dbl||[]).includes(d);
       const btn=document.createElement("button");
       btn.type="button";
       btn.className="dblbtn"+(dbl?" on":"");
       btn.textContent=dbl?"2 pass":"1 pass";
       btn.title="Antal lektioner denna dag";
       btn.onclick=()=>{
         p.dbl=dbl?(p.dbl||[]).filter(x=>x!==d):[...(p.dbl||[]),d];
         rebuildSchedule();
       };
       lab.appendChild(btn);
     }
     days.appendChild(lab);
   });
   el.appendChild(box);
 });
}
function rebuildSchedule(){
 state.startWeek=+document.getElementById("startWeek").value;
 state.endWeek=+document.getElementById("endWeek").value;
 normalizePeriods();
 normalizeLabPeriods();

 const weeks=weekSequence(state.startWeek,state.endWeek);
 const oldSlots=state.slots;
 state.slots=[];

 weeks.forEach(w=>{
   const p=periodFor(w,weeks);
   const days=[];
   DAYS.forEach(d=>{for(let i=0;i<dayCount(p,w,d);i++)days.push(d)});
   days.forEach((d,i)=>{
     state.slots.push({
       id:`${w}-${d}-${i}`,
       week:w,
       day:d,
       lessonId:null,
       blocked:false,
       label:""
     });
   });
 });

 // Utplaceringar och markeringar bevaras per vecka och veckodag.

function sortLessonsByPage(){
 state.lessons=state.lessons
   .map((l,i)=>({l,i,p:firstPage(l)}))
   .sort((a,b)=>{
     const ra=a.l.reusable?0:1, rb=b.l.reusable?0:1;
     if(ra!==rb)return ra-rb;
     if(ra===0)return a.i-b.i;
     if(a.p===null&&b.p===null)return a.i-b.i;
     if(a.p===null)return 1;
     if(b.p===null)return -1;
     return a.p-b.p||a.i-b.i;
   })
   .map(x=>x.l);

function moveLesson(fromId,toId,after){

// Zonindelning: överkant och underkant infogar mellan rader, mitten träffar raden.
function dropMode(e,cell,slot){
 if(!slot.lessonId)return "on";
 const r=cell.getBoundingClientRect();
 const y=(e.clientY-r.top)/r.height;
 if(y<0.3)return "before";
 if(y>0.7)return "after";
 return "on";
}
function nextOpenIndex(index){
 for(let i=index+1;i<state.slots.length;i++)if(!state.slots[i].blocked)return i;
 return -1;
}
function swapSlots(a,b){
 if(a<0||b<0||a===b)return;
 const pa=getPair(state.slots[a]),pb=getPair(state.slots[b]);
 setPair(state.slots[a],pb.id?pb:null);
 setPair(state.slots[b],pa.id?pa:null);
 render();
}
function replaceSlot(index,lessonId){
 const s=state.slots[index];
 if(!s||s.blocked)return;
 setPair(s,{id:lessonId,ov:null});
 render();
}
function handleDrop(data,index,mode){
 if(!data||index<0)return;
 let to=index;
 if(mode==="after"){const n=nextOpenIndex(index);to=n<0?index:n}
 if(data.startsWith("slot:")){
   const from=state.slots.findIndex(x=>x.id===data.slice(5));
   if(mode==="on")swapSlots(from,index);
   else moveSlotLesson(from,to);
 }else{
   const id=data.replace(/^lesson:/,"");
   if(mode==="on")replaceSlot(index,id);
   else placeLesson(id,to);
 }
}
function moveSlotLesson(from,to){
 if(from<0||to<0||from===to)return;
 const open=state.slots.map((s,i)=>({s,i})).filter(x=>!x.s.blocked&&(!isLocked(x.s)||x.i===from));
 const fromPos=open.findIndex(x=>x.i===from);
 const toPos=open.findIndex(x=>x.i===to);
 if(fromPos<0||toPos<0)return;
 const seq=open.map(x=>getPair(x.s));
 const [moved]=seq.splice(fromPos,1);
 // Målpositionen justeras så att lektionen hamnar på målets plats.
 const target=fromPos<toPos?toPos-1:toPos;
 seq.splice(target,0,moved);
 open.forEach((x,k)=>{setPair(x.s,seq[k].id?seq[k]:null)});
 render();
}

function pullUp(index){
 const self=state.slots[index];
 if(!self)return;
 // Ett låst pass tas bort utan att övriga flyttas.
 if(isLocked(self)){setPair(self,null);return}
 const open=state.slots.map((s,i)=>({s,i})).filter(x=>!x.s.blocked&&!isLocked(x.s));
 const pos=open.findIndex(x=>x.i===index);
 if(pos<0){setPair(self,null);return}
 const seq=open.map(x=>getPair(x.s));
 seq.splice(pos,1);seq.push(null);
 open.forEach((x,k)=>{setPair(x.s,seq[k]&&seq[k].id?seq[k]:null)});
}

// Datum räknas ut från måndagen i första veckan; veckorna i schemat är
// sammanhängande, så vecka nr i ligger i*7 dagar senare.
function mondayOf(iso){
 const d=new Date(iso+"T00:00:00");
 if(isNaN(d))return null;
 d.setDate(d.getDate()-((d.getDay()+6)%7));
 return d;
}
function dateForWeekDay(week,day){
 if(!state.startDate)return null;
 const base=mondayOf(state.startDate);
 if(!base)return null;
 const ws=scheduleWeeks();
 const wi=ws.indexOf(week);
 const di=DAYS.indexOf(day);
 if(wi<0||di<0)return null;
 const d=new Date(base);
 d.setDate(d.getDate()+wi*7+di);
 return d;
}
function fmtDate(d){return d?d.getDate()+"/"+(d.getMonth()+1):""}
function dayCell(day,date){return esc(day)+(date?' <span class="dnum">'+fmtDate(date)+"</span>":"")}
function setStartDate(v){
 state.startDate=v;
 const m=v?mondayOf(v):null;
 if(m){
   state.startWeek=isoWeek(m);
   document.getElementById("startWeek").value=state.startWeek;
 }
 rebuildSchedule();
}
function parseDateLines(text){
 const out=[];
 String(text||"").replace(/\r/g,"").split("\n").forEach(line=>{
   const t=line.trim();
   if(!t)return;
   let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*(.*)$/);
   if(m){out.push({y:+m[1],mo:+m[2],d:+m[3],text:m[4].trim()});return}
   m=t.match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.-](\d{2,4}))?\s*(.*)$/);
   if(m){
     let y=m[3]?+m[3]:null;
     if(y!==null&&y<100)y+=2000;
     out.push({y,mo:+m[2],d:+m[1],text:(m[4]||"").trim()});
   }
 });
 return out;
}
function sameDate(d,e){
 return d&&d.getDate()===e.d&&d.getMonth()+1===e.mo&&(e.y===null||d.getFullYear()===e.y);
}
const WD=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];
function weekOfDate(d){
 for(const w of scheduleWeeks()){
   const mon=dateForWeekDay(w,"Måndag");
   if(!mon)continue;
   const diff=(d-mon)/86400000;
   if(diff>=0&&diff<7)return w;
 }
 return null;
}

 if(!state.startDate){alert("Ange först måndagen i första veckan.");return}
 state.examText=document.getElementById("eText").value;
 const list=parseDateLines(state.examText);
 let onDay=0,added=0,inOther=0,missed=0;
 list.forEach(e=>{
   const text=e.text||"Prov";
   // Provet läggs i Övrigt-kolumnen och påverkar inte utplacerade lektioner.
   const hit=state.slots.find(s=>sameDate(dateForWeekDay(s.week,s.day),e));
   if(hit){hit.otherExam=text;onDay++;return}
   // Prov utanför lektionsdagarna placeras på veckans sista pass före provdagen.
   const y=e.y||(dateForWeekDay(scheduleWeeks()[0],"Måndag")||new Date()).getFullYear();
   let d=new Date(y,e.mo-1,e.d);
   let w=weekOfDate(d);
   if(w===null&&!e.y){d=new Date(y+1,e.mo-1,e.d);w=weekOfDate(d)}
   if(w===null){missed++;return}
   // Infaller provet på en vardag utan lektion läggs den dagen till i veckan.
   const wd=DAYS[(d.getDay()+6)%7];
   if(wd){
     addDay(w,wd);
     const slot=state.slots.find(x=>x.week===w&&x.day===wd);
     if(slot){
       setPair(slot,null);
       slot.blocked=true;slot.label=text;slot.note="";slot.exam=true;
       added++;return;
     }
   }
   const rows=state.slots.filter(s=>s.week===w);
   if(!rows.length){missed++;return}
   const before=rows.filter(s=>dateForWeekDay(s.week,s.day)<=d);
   const target=before.length?before[before.length-1]:rows[0];
   target.otherExam=text+" "+WD[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);
   inOther++;
 });
 closeExams();render();
 alert((onDay+added+inOther)+" prov lades in."
   +(added?" "+added+" nya dagar skapades.":"")
   +(inOther?" "+inOther+" hamnade på närmaste pass.":"")
   +(missed?" "+missed+" datum låg utanför planeringen.":""));
}

function looksLikePages(t){return /^\d[\d\s.,;:–—-]*$/.test(t.trim())}
// Tabbtecknet skiljer avsnittskolumnen från sidkolumnen. Rader före tabben
// tolkas som rubriker, rader efter som sidor, och paras ihop i ordning.
function parseBulk(text){
 const lines=String(text||"").replace(/\r/g,"").split("\n");
 const rows=[];
 let titles=[],pages=[],inPages=false;
 const close=()=>{
   if(titles.length||pages.length)rows.push({titles,pages});
   titles=[];pages=[];inPages=false;
 };
 lines.forEach(line=>{
   if(line.includes("\t")){
     if(inPages)close();
     const i=line.indexOf("\t");
     titles.push(line.slice(0,i).trim());
     pages.push(line.slice(i+1).replace(/\t/g," ").trim());
     inPages=true;
   }else{
     const t=line.trim();
     if(!t)return;
     if(inPages&&looksLikePages(t))pages.push(t);
     else{if(inPages)close();titles.push(t)}
   }
 });
 close();
 const out=[];
 rows.forEach(r=>r.titles.forEach((t,i)=>{
   if(t)out.push({title:t,pages:(r.pages[i]||"").trim()});
 }));
 return out;
}

   const s2=row.slot, v=slotView(s2), off=s2.blocked;
   const wkBg=alt?P.wkAlt:P.wk;
   const wkCell=top?`<td rowspan="${g.rows.length}" style="${b}background:${wkBg};text-align:center;vertical-align:middle;font-weight:bold;color:#1e4976;font-size:10pt">${esc(s2.week)}</td>`:"";
   const dyBg=off?P.off:(alt?P.dyAlt:P.dy);
   const secBg=off?(s2.exam?P.exam:P.off):(v?.exam?P.exam:P.white);
   const othBg=s2.otherExam?P.exam:(off?P.off:P.white);
   const secCol=off?(s2.exam?"#912018":"#343a40"):(v?.exam?"#912018":"#17202a");
   return `<tr>`+wkCell
     +`<td style="${b}background:${dyBg};color:${off?"#343a40":"#4a5f79"};font-size:8.5pt">${esc(s2.day)} ${esc(fmtDate(dateForWeekDay(s2.week,s2.day)))}</td>`
     +`<td style="${b}background:${secBg};font-weight:bold;color:${secCol};font-size:9.5pt">${off?esc(blockedText(s2)):esc(v?.title||"")}</td>`
     +`<td style="${b}background:${off?P.off:P.white};font-size:9pt;color:#3f4854">${off?"":esc(v?.pages||"")}</td>`
     +`<td style="${b}background:${othBg};font-size:8.5pt;color:${s2.otherExam?"#912018":"#3f4854"}">${otherText(s2)}</td></tr>`;
 })).join("");
 const th=`border:${BORDER};border-bottom:1.5pt solid #4b535c;background:#dde1e6;font-size:8pt;`
   +`font-weight:bold;text-align:left;padding:5pt 6pt;text-transform:uppercase`;
 const style=`
 @page WordSection1{size:21cm 29.7cm;margin:1.4cm 1.2cm}
 div.WordSection1{page:WordSection1}
 body{font-family:Calibri,Arial,sans-serif;font-size:10pt;color:#17202a;margin:0}
 table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0}
 h1{font-family:Georgia,'Times New Roman',serif;font-size:17pt;font-weight:normal;text-align:center;margin:0}
 a{color:#1155cc}`;
 const html="\ufeff"+`<!doctype html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
<head><meta charset="utf-8"><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>${esc(state.title)}</title><style>${style}</style></head>
<body><div class="WordSection1">
<h1>${esc(state.title)}</h1>
<p style="border-bottom:1.5pt solid #7a8ea8;margin:6pt 0 10pt 0;font-size:1pt">&nbsp;</p>
<table style="width:100%;table-layout:fixed">
<col style="width:7%"><col style="width:15%"><col style="width:37%"><col style="width:9%"><col style="width:32%">
<thead><tr>
  <th style="${th}">Vecka</th><th style="${th}">Dag</th><th style="${th}">Avsnitt</th>
  <th style="${th}">Sidor</th><th style="${th}">Övrigt</th>
</tr></thead>
<tbody>${rows}</tbody></table>
</div></body></html>`;
 const blob=new Blob([html],{type:"application/msword"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(state.title||"planering")+".doc";a.click();
}
const STORE_KEY="planeringsverktyg_v2";
let store={current:null,plans:{}};
let planId=null;
// Planeringar lagras i localStorage och kan växlas mellan.
function writeStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(err){}}
function readStore(){
 try{
   const raw=localStorage.getItem(STORE_KEY);
   if(raw){const d=JSON.parse(raw);if(d&&d.plans)return d}
 }catch(err){}
 try{
   const old=localStorage.getItem("planeringsverktyg_v1");
   if(old){const st=JSON.parse(old);if(st&&Array.isArray(st.slots)){const id=uid();return {current:id,plans:{[id]:st}}}}
 }catch(err){}
 return {current:null,plans:{}};
}
let history=[],future=[],lastSnap=null,skipHistory=false;
// Ångrahistorik: varje omritning jämförs med föregående läge och lagras vid skillnad.
function trackHistory(){
 const cur=JSON.stringify(state);
 if(!skipHistory&&lastSnap&&lastSnap!==cur){
   history.push(lastSnap);
   if(history.length>60)history.shift();
   future=[];
 }
 lastSnap=cur;
}
function applySnap(snap){
 state=JSON.parse(snap);
 lastSnap=snap;
 skipHistory=true;
 syncInputs();render();
 skipHistory=false;
}
function undo(){
 if(!history.length)return;
 future.push(JSON.stringify(state));
 applySnap(history.pop());
}
function redo(){
 if(!future.length)return;
 history.push(JSON.stringify(state));
 applySnap(future.pop());
}
function saveLocal(){
 if(!planId)return;
 store.plans[planId]=state;store.current=planId;writeStore();
}
function freshState(){
 return {title:"Ny planering",startWeek:34,endWeek:24,periods:[],labPeriods:[],slots:[],
   lessons:seedLessons.map(x=>({...x})),blockedWeeks:[],blockedSlots:[],labs:defaultLabs()};
}
function activate(){
 ensureFixedLessons();normalizePeriods();normalizeLabPeriods();normalizeLabs();
 syncInputs();render();
}
function newPlan(){
 planId=uid();
 state=freshState();
 activate();
 rebuildSchedule();
}
function switchPlan(id){
 if(!store.plans[id])return;
 planId=id;state=store.plans[id];
 history=[];future=[];lastSnap=null;
 activate();
}
function duplicatePlan(){
 const copy=JSON.parse(JSON.stringify(state));
 copy.title=(state.title||"Planering")+" (kopia)";
 planId=uid();
 state=copy;
 history=[];future=[];lastSnap=null;
 activate();
}
function deletePlan(){
 if(!confirm("Ta bort planeringen \""+(state.title||"")+"\" ur webbläsaren? Sparade filer påverkas inte."))return;
 delete store.plans[planId];planId=null;writeStore();
 const ids=Object.keys(store.plans);
 if(ids.length)switchPlan(ids[0]);else newPlan();
}
function renderPlanSelect(){
 const el=document.getElementById("planSelect");
 if(!el)return;
 el.innerHTML="";
 Object.keys(store.plans).forEach(id=>{
   const o=document.createElement("option");
   o.value=id;o.textContent=store.plans[id].title||"Utan namn";
   el.appendChild(o);
 });
 el.value=planId;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.getElementById("logoImg").src=LOGO;
// Logotypen används även som favicon.
document.getElementById("favicon").href=LOGO;
document.getElementById("favicon2").href=LOGO;
document.addEventListener("click",closeCtx);
document.addEventListener("scroll",closeCtx,true);
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeCtx();
 if(!(e.ctrlKey||e.metaKey))return;
 const t=e.target.tagName;
 if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
 const k=e.key.toLowerCase();
 if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}
 else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}
});
window.addEventListener("resize",closeCtx);
bindLabControls();
store=readStore();
const firstId=(store.current&&store.plans[store.current])?store.current:Object.keys(store.plans)[0];
if(firstId){switchPlan(firstId)}
else{newPlan();state.title="Planering av Fysik 1 - 2026/2027";activate()}

function showTab(id,btn){
 document.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");btn.classList.add("active");
}
</script>
