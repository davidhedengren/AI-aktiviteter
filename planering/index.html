<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeringsverktyg</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#667085;
  --line:#d9dee5; --accent:#0f766e; --accent2:#e6fffb;
  --holiday:#e8eaed; --danger:#b42318; --shadow:0 8px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{background:#111827;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
header h1{font-size:20px;margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #d0d5dd;background:white;border-radius:8px;padding:8px 12px;font-weight:600}
.btn.primary{background:#0f766e;border-color:#0f766e;color:#fff}
.btn.dark{background:#1f2937;border-color:#475569;color:#fff}
.btn.danger{color:#b42318}
.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;max-width:1500px;margin:18px auto;padding:0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel h2{font-size:15px;margin:0;padding:15px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:14px 16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #cfd5dd;border-radius:7px;padding:8px 9px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{font-size:12px;color:var(--muted);line-height:1.45}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fafafa}
.tab{padding:11px 14px;border:0;background:transparent;font-weight:700;color:#667085}
.tab.active{color:#0f766e;border-bottom:2px solid #0f766e}
.tabpane{display:none}.tabpane.active{display:block}
.tabpane.body{max-height:calc(100vh - 190px);overflow-y:auto}
.card{border:1px solid #d7dce2;border-radius:9px;padding:10px 11px;margin-bottom:8px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.04);cursor:grab}
.card:active{cursor:grabbing}
.card .title{font-weight:700;font-size:13px}
.card .meta{font-size:11px;color:#667085;margin-top:4px}
.card .actions{display:flex;gap:5px;margin-top:8px}
.card .actions button{font-size:11px;padding:4px 7px}
.card.dragging{opacity:.45}
.cbrow{display:flex;align-items:center;gap:8px;font-weight:600;color:#344054;margin:0 0 7px 0;font-size:13px}
.cbrow input{width:auto}
.lab-item{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;border:1px solid #d7dce2;border-radius:8px;padding:8px 9px;margin-bottom:7px;background:#fff}
.lab-item .wk{font-weight:800;font-size:12px;color:#0f766e;text-align:center}
.lab-item input[type=text]{padding:6px 8px;font-size:12px}
.lab-item .study{grid-column:2;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#667085}
.lab-item .study input{width:auto}
.lab-item.off{opacity:.55}
.period{border:1px solid #d7dce2;border-radius:9px;padding:9px;margin-bottom:8px;background:#fff}
.period .head{display:grid;grid-template-columns:1fr 50px 50px 24px;gap:5px;align-items:center}
.period .head select,.period .head input{padding:6px 5px;font-size:12px}
.period .del{border:0;background:transparent;color:#98a2b3;font-size:15px;font-weight:700;padding:0}
.period .del:hover{color:#b42318}
.period .lbl{font-size:10px;color:#98a2b3;font-weight:700;text-align:center}
.period .days{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.period .days label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#344054;margin:0}
.period .days input{width:auto}
.period .name{font-weight:700;font-size:13px;color:#0f766e}
.period-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #d7dce2;border-radius:8px;padding:8px 9px;margin-bottom:7px;background:#fff}
.period-row label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#344054;margin:0}
.period-row input{width:auto}
.print-header{display:none}
.print-header img{width:95px;height:auto;object-fit:contain}
.print-header h1{font-family:Georgia,serif;font-size:20px;margin:0;text-align:center;flex:1}
.schedule-wrap{overflow:auto;max-height:calc(100vh - 120px)}
.schedule{min-width:900px;border-collapse:collapse;width:100%;background:#fff}
.schedule th{background:#e1e3e5;font-size:12px;text-align:left;padding:8px;border:1px solid #adb3b9;position:sticky;top:0;z-index:2;box-shadow:inset 0 1px 0 #adb3b9,inset 0 -1px 0 #adb3b9}
.schedule td{border:1px solid #adb3b9;padding:6px;vertical-align:top;height:56px;font-size:12px}
.schedule .week{width:60px;text-align:center;font-weight:800;background:#f3f4f6}
.schedule .date{width:92px;color:#667085;white-space:nowrap}
.schedule .slot{width:170px}
.schedule .other{width:230px}
.lesson-cell{min-height:40px;padding:6px;border-radius:6px}
.lesson-cell.drop{outline:2px dashed #0f766e;background:#f0fdfa}
.lesson-cell.drop-before{box-shadow:inset 0 4px 0 #0f766e}
.lesson-cell.drop-after{box-shadow:inset 0 -4px 0 #0f766e}
.lesson-title{font-weight:700}
.placed{cursor:grab}
.placed:active{cursor:grabbing}
.placed.dragging{opacity:.4}
.placed{display:flex;align-items:flex-start;gap:6px;justify-content:space-between}
.placed .rm{border:0;background:transparent;color:#98a2b3;font-size:14px;line-height:1;padding:0 2px;font-weight:700}
.placed .rm:hover{color:#b42318}
.badge{display:inline-block;background:#e6fffb;color:#0f766e;border:1px solid #99f6e4;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle}
.status{font-size:12px;color:#475467;font-weight:600;margin:10px 0 0 0;text-align:center}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lab-row td{background:#effcfa}
.lab-row .date{color:#0f766e;font-weight:700}
.lab-label{font-weight:700;color:#0f766e}
.lab-row.study td{background:var(--holiday)}
.lab-row.study .lab-label{color:#343a40}
.lesson-pages{color:#667085;font-size:11px;margin-top:2px}
.lesson-note{font-weight:600}
.blocked{background:var(--holiday)!important;color:#343a40}
.blocked td{background:var(--holiday)}
.blocked .lesson-cell{opacity:.75}
.block-label{font-weight:800}
.muted{color:#98a2b3}
.selected{box-shadow:0 0 0 2px #0f766e inset}
.empty{color:#98a2b3;text-align:center;padding:16px 8px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);align-items:center;justify-content:center;z-index:10}
.modal{width:min(560px,calc(100vw - 30px));background:#fff;border-radius:12px;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:16px;border-bottom:1px solid var(--line)}
.modal .content{padding:16px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.small{font-size:11px}
.ctx{display:none;position:fixed;z-index:20;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:5px;min-width:190px}
.ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:600;color:#344054}
.ctx button:hover{background:#f0fdfa;color:#0f766e}
.ctx button.danger:hover{background:#fef3f2;color:#b42318}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{order:2}}
@media print{
  body{background:white}
  header,.sidebar,.no-print{display:none!important}
  .layout{display:block;margin:0;padding:0}
  .panel{box-shadow:none;border:0}
  .print-header{display:flex;align-items:center;gap:20px;margin:0 0 10px 0}
  .print-header h1{font-size:20px}
  .schedule-wrap{overflow:visible;max-height:none}
  .tabpane.body{max-height:none;overflow:visible}
  .schedule th{position:static;box-shadow:none}
  .schedule{min-width:0;font-size:10px}
  .schedule td{height:auto;padding:4px}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>
<header>
  <div><h1 id="docTitle">Planering</h1></div>
  <div class="toolbar no-print">
    <button class="btn" onclick="saveProject()">Spara</button>
    <button class="btn" onclick="loadProject()">Öppna</button>
    <button class="btn primary" onclick="exportWord()">Exportera Word</button>
    <button class="btn primary" onclick="window.print()">Exportera PDF / skriv ut</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <div class="tabs">
        <button class="tab active" onclick="showTab('settings',this)">Inställningar</button>
        <button class="tab" onclick="showTab('lessons',this)">Lektioner</button>
        <button class="tab" onclick="showTab('labs',this)">Laborationer</button>
      </div>
      <div id="settings" class="tabpane active body">
        <div class="field"><label>Rubrik</label><input id="titleInput" value="Planering av Fysik 1 - 2026/2027" oninput="state.title=this.value;render()"></div>
        <div class="row">
          <div class="field"><label>Första vecka</label><input id="startWeek" type="number" value="34"></div>
          <div class="field"><label>Sista vecka</label><input id="endWeek" type="number" value="24"></div>
        </div>
        <div class="field"><label>Perioder och lektionsdagar</label>
          <div id="periodList"></div>
          <button class="btn" style="width:100%;margin-top:6px" onclick="addPeriod()">+ Lägg till period</button>
        </div>
        <button class="btn primary" style="width:100%" onclick="rebuildSchedule()">Skapa / uppdatera schema</button>
        <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
        <button class="btn danger" style="width:100%" onclick="clearPlan()">Rensa planeringen</button>
        <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
        <div class="field"><label>Markera vald vecka som ledig</label>
          <input id="blockWeek" type="number" placeholder="t.ex. 44">
        </div>
        <button class="btn" style="width:100%" onclick="blockWeek()">Lägg till lov/ledig vecka</button>
      </div>
      <div id="lessons" class="tabpane body">
        <button class="btn primary" style="width:100%;margin-bottom:10px" onclick="openLesson()">+ Ny lektion</button>
        <div class="btnrow">
          <button class="btn" onclick="saveCourse()">Spara kurs</button>
          <button class="btn" onclick="loadCourse()">Öppna kurs</button>
        </div>
        <button class="btn primary" style="width:100%" onclick="autoPlace()">Placera ut automatiskt</button>
        <div class="status" id="planStatus"></div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div id="lessonList"></div>
      </div>
      <div id="labs" class="tabpane body">
        <label class="cbrow"><input type="checkbox" id="labEnabled"> Använd laborationer</label>
        <div class="field" style="margin-top:12px"><label>Laboration i dessa perioder</label>
          <div id="labPeriods"></div>
        </div>
        <div class="field"><label>Laborationsdag</label>
          <select id="labDay"></select>
        </div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div id="labList"></div>
      </div>
    </div>
  </aside>

  <main class="panel">
    <div class="print-header">
      <img id="logoImg" alt="Erik Dahlbergsgymnasiet">
      <div>
        <h1 id="printTitle">Planering</h1>
      </div>
    </div>
    <div class="schedule-wrap">
      <table class="schedule" id="scheduleTable"></table>
    </div>
  </main>
</div>

<div class="ctx no-print" id="ctxMenu"></div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Ny lektion</h3>
    <div class="content">
      <div class="field"><label>Avsnitt / lektion</label><input id="mTitle"></div>
      <div class="field"><label>Sidor</label><input id="mPages" placeholder="t.ex. 307–310"></div>
      <div class="field"><label>Övrigt</label><input id="mOther" placeholder="t.ex. Laboration:"></div>
      <div class="field"><label>Extra anteckning</label><input id="mNote" placeholder="Valfritt"></div>
      <div id="mReusableRow"><label class="cbrow"><input type="checkbox" id="mReusable"> Fast pass – visas överst i listan</label></div>
      <input type="hidden" id="mId">
      <input type="hidden" id="mSlot">
    </div>
    <div class="actions">
      <button class="btn danger" id="mReset" onclick="resetSlot()">Återställ</button>
      <button class="btn" onclick="closeModal()">Avbryt</button>
      <button class="btn primary" onclick="saveLesson()">Spara</button>
    </div>
  </div>
</div>

const DAYS=["Måndag","Tisdag","Onsdag","Torsdag","Fredag"];
let state={
 title:"Planering av Fysik 1 - 2026/2027",
 startWeek:34,endWeek:24,
 periods:[],
 slots:[], lessons:[], blockedWeeks:[], blockedSlots:[],
 labs:{enabled:false, day:"Fredag", items:{}}
};
function defaultLabs(){return {enabled:false, day:"Fredag", items:{}}}

const seedLessons=[
 {id:"rep",title:"Repetition",pages:"",other:"",reusable:true},
 {id:"prov",title:"Prov",pages:"",other:"",reusable:true}
];

function uid(){return "l"+Math.random().toString(36).slice(2,9)}
function weekSequence(a,b){
 let out=[];
 if(a<=b){for(let w=a;w<=b;w++)out.push(w)}
 else {for(let w=a;w<=52;w++)out.push(w);for(let w=1;w<=b;w++)out.push(w)}
 return out;
}
// En period styr både lektionsdagar och om det är laboration den veckan.
// Första perioden som matchar veckan gäller, så specifika spann kan ligga
// före ett generellt spann som täcker resten av läsåret.
function coversWeek(p,w,ws){
 const parityOk = p.parity==="all" || (w%2===0 ? p.parity==="even" : p.parity==="odd");
 if(!parityOk)return false;
 const i=ws.indexOf(w);
 let a=ws.indexOf(+p.from); if(a<0)a=0;
 let b=ws.indexOf(+p.to); if(b<0)b=ws.length-1;
 if(a>b){const t=a;a=b;b=t}
 return i>=a&&i<=b;
}
function periodFor(week,ws){return (state.periods||[]).find(p=>coversWeek(p,week,ws))}
function periodLabel(p){
 const t=p.parity==="even"?"Jämna veckor":p.parity==="odd"?"Udda veckor":"Varje vecka";
 return `${t} v.${p.from}–${p.to}`;
}
function defaultRange(){
 const ws=scheduleWeeks();
 return ws.length?{from:ws[0],to:ws[ws.length-1]}:{from:state.startWeek,to:state.endWeek};
}
// Migrerar äldre filer: gamla jämn/udda-dagar och labbregler blir perioder.
function normalizePeriods(){
 if(Array.isArray(state.periods)&&state.periods.length)return;
 const ws=weekSequence(state.startWeek,state.endWeek);
 const evenDays=state.evenDays||["Måndag","Onsdag"];
 const oddDays=state.oddDays||["Måndag","Onsdag"];
 const out=[];
 const old=(state.labs&&Array.isArray(state.labs.rules))?state.labs.rules:[];
 old.forEach(r=>out.push({parity:r.parity,from:r.from,to:r.to,days:(r.parity==="odd"?oddDays:evenDays).slice(),lab:true}));
 out.push({parity:"even",from:ws[0],to:ws[ws.length-1],days:evenDays.slice(),lab:false});
 out.push({parity:"odd",from:ws[0],to:ws[ws.length-1],days:oddDays.slice(),lab:false});
 state.periods=out;
 delete state.evenDays;delete state.oddDays;delete state.lessonsPerWeek;
 if(state.labs)delete state.labs.rules;
}
function addPeriod(){
 const r=defaultRange();
 state.periods.push({parity:"all",from:r.from,to:r.to,days:["Måndag","Onsdag"],lab:false});
 rebuildSchedule();
}
function renderPeriods(){
 const el=document.getElementById("periodList");
 el.innerHTML="";
 if(!state.periods.length){el.innerHTML='<div class="empty" style="padding:8px">Inga perioder ännu.</div>';return}
 el.insertAdjacentHTML("beforeend",'<div class="head" style="display:grid;grid-template-columns:1fr 50px 50px 24px;gap:5px;margin-bottom:3px"><div></div><div class="lbl">från</div><div class="lbl">till</div><div></div></div>');

function rebuildSchedule(){
 state.startWeek=+document.getElementById("startWeek").value;
 state.endWeek=+document.getElementById("endWeek").value;
 normalizePeriods();

 const weeks=weekSequence(state.startWeek,state.endWeek);
 const oldSlots=state.slots;
 state.slots=[];

 weeks.forEach(w=>{
   const p=periodFor(w,weeks);
   const days=DAYS.filter(d=>(p?.days||[]).includes(d));
   days.forEach((d,i)=>{
     state.slots.push({
       id:`${w}-${i}`,
       week:w,
       day:d,
       lessonId:null,
       blocked:false,
       label:""
     });
   });
 });

 // Preserve assignments by slot id where possible.
 state.slots.forEach(sl=>{
   const old=oldSlots.find(x=>x.id===sl.id);
   if(old){
     sl.lessonId=old.lessonId;
     sl.blocked=old.blocked;
     sl.label=old.label;
   }
 });
 renderPeriods();
 render();
}
function render(){
 document.getElementById("docTitle").textContent=state.title;

 renderLessons(); renderLabs(); renderSchedule(); updateStatus();

// Visningsordning: fasta pass överst, därefter sidnummerordning.
// Lektioner utan sidhänvisning hamnar sist, i den ordning de lades till.
function lessonsForList(){
 return state.lessons
   .map((l,i)=>({l,i,p:firstPage(l)}))
   .sort((a,b)=>{
     const ra=a.l.reusable?0:1, rb=b.l.reusable?0:1;
     if(ra!==rb)return ra-rb;
     if(ra===0)return a.i-b.i;
     if(a.p===null&&b.p===null)return a.i-b.i;
     if(a.p===null)return 1;
     if(b.p===null)return -1;
     return a.p-b.p||a.i-b.i;
   })
   .map(x=>x.l);
}

 const el=document.getElementById("lessonList"); el.innerHTML="";
 if(!state.lessons.length){el.innerHTML='<div class="empty">Inga lektioner ännu.</div>';return}

   const d=document.createElement("div"); d.className="card"; d.draggable=true;
   d.ondragstart=e=>{e.dataTransfer.setData("text/plain","lesson:"+l.id);e.dataTransfer.effectAllowed="copyMove";d.classList.add("dragging")};
   d.ondragend=()=>d.classList.remove("dragging");
   d.innerHTML=`<div class="title">${esc(l.title)}${l.reusable?'<span class="badge">fast</span>':''}</div><div class="meta">${esc(l.pages||"")} ${l.other?" · "+esc(l.other):""}</div>
   <div class="actions"><button class="btn" onclick="openLesson('${l.id}')">Redigera</button><button class="btn danger" onclick="deleteLesson('${l.id}')">Ta bort</button></div>`;
   el.appendChild(d);
 });
}
function buildRows(){
 const labSet=new Set(labWeeks());
 const groups=[];
 let i=0;
 while(i<state.slots.length){
   const week=state.slots[i].week;
   let j=i;
   while(j<state.slots.length && state.slots[j].week===week)j++;
   const rows=state.slots.slice(i,j).map(s=>({kind:"lesson",slot:s,day:s.day}));
   if(labSet.has(week))rows.push({kind:"lab",week,day:state.labs.day});
   rows.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day));
   groups.push({week,rows});
   i=j;
 }
 return groups;
}
function closeCtx(){document.getElementById("ctxMenu").style.display="none"}

 add(s.blocked?"Ta bort ledig / studiedag":"Markera som studiedag / ledig",()=>toggleBlocked(index));

         <td></td><td></td>`;

     }

       <td>${!s.blocked?esc(slotView(s)?.pages||""):""}</td>
       <td>${!s.blocked?esc(slotView(s)?.other||""):""}</td>`;
     const cell=tr.querySelector(".lesson-cell");

     cell.ondragover=e=>{

     };
     cell.ondragleave=clearDrop;
     cell.ondrop=e=>{
       e.preventDefault();
       const mode=dropMode(e,cell,s);
       clearDrop();
       handleDrop(e.dataTransfer.getData("text/plain"),state.slots.indexOf(s),mode);
     };
     cell.ondblclick=()=>toggleBlocked(state.slots.indexOf(s));
     cell.oncontextmenu=e=>{e.preventDefault();openCtx(e,state.slots.indexOf(s))};
     tr.querySelector(".date").oncontextmenu=e=>{e.preventDefault();openCtx(e,state.slots.indexOf(s))};
     tr.querySelector(".date").ondblclick=()=>toggleBlocked(state.slots.indexOf(s));
     const placed=cell.querySelector(".placed");
     if(placed){

         rm.onmousedown=e=>e.stopPropagation();

// Överkant och underkant lägger in mellan raderna, mitten träffar raden själv.
function dropMode(e,cell,slot){
 if(!slot.lessonId)return "on";
 const r=cell.getBoundingClientRect();
 const y=(e.clientY-r.top)/r.height;
 if(y<0.3)return "before";
 if(y>0.7)return "after";
 return "on";
}
function nextOpenIndex(index){
 for(let i=index+1;i<state.slots.length;i++)if(!state.slots[i].blocked)return i;
 return -1;
}
function swapSlots(a,b){
 if(a<0||b<0||a===b)return;
 const pa=getPair(state.slots[a]),pb=getPair(state.slots[b]);
 setPair(state.slots[a],pb.id?pb:null);
 setPair(state.slots[b],pa.id?pa:null);
 render();
}
function replaceSlot(index,lessonId){
 const s=state.slots[index];
 if(!s||s.blocked)return;
 setPair(s,{id:lessonId,ov:null});
 render();
}
function handleDrop(data,index,mode){
 if(!data||index<0)return;
 let to=index;
 if(mode==="after"){const n=nextOpenIndex(index);to=n<0?index:n}
 if(data.startsWith("slot:")){
   const from=state.slots.findIndex(x=>x.id===data.slice(5));
   if(mode==="on")swapSlots(from,index);
   else moveSlotLesson(from,to);
 }else{
   const id=data.replace(/^lesson:/,"");
   if(mode==="on")replaceSlot(index,id);
   else placeLesson(id,to);
 }
}
function moveSlotLesson(from,to){
 if(from<0||to<0||from===to)return;
 const open=state.slots.map((s,i)=>({s,i})).filter(x=>!x.s.blocked);
 const fromPos=open.findIndex(x=>x.i===from);
 const toPos=open.findIndex(x=>x.i===to);
 if(fromPos<0||toPos<0)return;
 const seq=open.map(x=>getPair(x.s));
 const [moved]=seq.splice(fromPos,1);
 // Lektionen ska ta målets plats – inte hamna efter det.
 const target=fromPos<toPos?toPos-1:toPos;
 seq.splice(target,0,moved);
 open.forEach((x,k)=>{setPair(x.s,seq[k].id?seq[k]:null)});
 render();
}
function lessonHTML(s){
 const v=slotView(s); if(!v)return '<span class="muted">Dra en lektion hit</span>';
 return `<div class="placed"><div class="lesson-title">${esc(v.title)}</div><button class="rm no-print" type="button" title="Ta bort pass">×</button></div>`;
}
function getLesson(id){return state.lessons.find(l=>l.id===id)}
// Ett pass i schemat kan ha egen text som inte påverkar grundlektionen.
function slotView(s){
 const l=getLesson(s.lessonId);
 if(!l)return null;
 const o=s.override;
 return o?{title:o.title,pages:o.pages,other:o.other,note:o.note,edited:true}
         :{title:l.title,pages:l.pages,other:l.other,note:l.note,edited:false};
}
function getPair(s){return {id:s.lessonId,ov:s.override||null}}
function setPair(s,p){s.lessonId=p?p.id:null;s.override=p?p.ov:null}
function firstPage(l){
 const m=String(l.pages||"").match(/\d+/);
 return m?+m[0]:null;
}
// Endast lektioner med sidhänvisning placeras ut automatiskt.
// Repetition, prov och andra pass utan sidor lämnas åt användaren.
function lessonsInPageOrder(){
 return state.lessons
   .map((l,i)=>({l,i,page:firstPage(l)}))
   .filter(r=>!r.l.reusable&&r.page!==null)
   .sort((a,b)=>a.page-b.page||a.i-b.i)
   .map(r=>r.l);
}
function openSlots(){return state.slots.filter(s=>!s.blocked)}
// Repetition och Prov ska alltid ligga överst, även i inlästa kursfiler.
function ensureFixedLessons(){
 seedLessons.forEach((f,k)=>{
   if(!state.lessons.some(l=>l.id===f.id))state.lessons.splice(k,0,{...f});
 });
}
function autoPlace(){
 const open=openSlots();
 if(!open.length){alert("Skapa ett schema först.");return}
 const list=lessonsInPageOrder();
 if(!list.length){alert("Det finns inga lektioner att placera ut.");return}
 if(open.some(s=>s.lessonId)&&!confirm("Detta ersätter nuvarande utplacerade lektioner. Fortsätt?"))return;
 open.forEach(s=>setPair(s,null));
 list.forEach((l,i)=>{if(i<open.length)setPair(open[i],{id:l.id,ov:null})});
 if(list.length>open.length)alert("Det saknas "+(list.length-open.length)+" lektionstillfällen. De sista lektionerna placerades inte ut.");
 render();
}
function clearPlan(){
 if(!state.slots.some(s=>s.lessonId))return;
 if(!confirm("Ta bort alla utplacerade lektioner? Lov och studiedagar behålls."))return;
 state.slots.forEach(s=>setPair(s,null));
 render();
}
function removePlacement(index){
 const open=state.slots.map((s,i)=>({s,i})).filter(x=>!x.s.blocked);
 const pos=open.findIndex(x=>x.i===index);
 if(pos<0)return;
 const seq=open.map(x=>getPair(x.s));
 seq.splice(pos,1);seq.push(null);
 open.forEach((x,k)=>{setPair(x.s,seq[k]&&seq[k].id?seq[k]:null)});
 render();
}

function loadCourse(){
 const inp=document.createElement("input");inp.type="file";inp.accept=".json";
 inp.onchange=()=>{
   const f=inp.files[0];if(!f)return;
   const r=new FileReader();
   r.onload=()=>{
     try{
       const data=JSON.parse(r.result);
       const lessons=data.lessons||(Array.isArray(data)?data:null);
       if(!lessons){alert("Filen innehåller inga lektioner.");return}
       state.lessons=lessons.map(x=>({...x}));
       ensureFixedLessons();
       state.slots.forEach(s=>{s.lessonId=null});
       render();
     }catch(err){alert("Kunde inte läsa filen.")}
   };
   r.readAsText(f);
 };

function placeLesson(lessonId,index){
 if(!lessonId)return;
 // Alla lektioner får läggas ut flera gånger – inget tas bort någon annanstans.
 let carry={id:lessonId,ov:null};
 for(let i=index;i<state.slots.length;i++){
   const s=state.slots[i];
   if(s.blocked)continue;
   const old=getPair(s);setPair(s,carry);carry=old.id?old:null;
   if(!carry)break;
 }
 if(carry) alert("Det finns inte tillräckligt många lediga lektionstillfällen för att flytta hela planeringen.");
 render();
}
function toggleBlocked(index){
 const s=state.slots[index];
 if(!s)return;
 if(!s.blocked){
   // Move the lesson out first, preserving the sequence.
   if(s.lessonId){
     let carry=getPair(s);setPair(s,null);
     for(let i=index+1;i<state.slots.length;i++){
       if(state.slots[i].blocked)continue;
       const x=getPair(state.slots[i]);setPair(state.slots[i],carry);carry=x.id?x:null;
       if(!carry)break;
     }
   }
   s.blocked=true;s.label="Studiedag / ledig";
 }else{s.blocked=false;s.label=""}
 render();
}
function blockWeek(){
 const w=+document.getElementById("blockWeek").value;
 if(!w)return;
 state.slots.forEach(s=>{if(s.week===w){s.blocked=true;s.label="LOV / LEDIG";s.lessonId=null}});
 // Repack lessons after the blocked week(s), skipping blocked slots.
 repack();

}
function repack(){
 const items=[];
 state.slots.forEach(s=>{if(s.lessonId)items.push(getPair(s));setPair(s,null)});
 let p=0;
 state.slots.forEach(s=>{if(!s.blocked&&p<items.length)setPair(s,items[p++])});
}
function scheduleWeeks(){return [...new Set(state.slots.map(s=>s.week))]}
function normalizeLabs(){
 if(!state.labs)state.labs=defaultLabs();
 if(!state.labs.items)state.labs.items={};
}
function labWeeks(){

 return ws.filter(w=>{
   if(!state.slots.some(s=>s.week===w&&!s.blocked))return false;

function saveProject(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(state.title||"planering")+".json";a.click();
}
function loadProject(){
 const inp=document.createElement("input");inp.type="file";inp.accept=".json";
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);if(!state.lessons)state.lessons=[];ensureFixedLessons();normalizePeriods();normalizeLabs();syncInputs();render()};r.readAsText(f)};inp.click();
}
function syncInputs(){
 document.getElementById("titleInput").value=state.title||"";
 document.getElementById("startWeek").value=state.startWeek;
 document.getElementById("endWeek").value=state.endWeek;
 normalizePeriods();
 renderPeriods();
}
function exportWord(){
 const rows=buildRows().flatMap(g=>g.rows.map(row=>{
   if(row.kind==="lab"){
     const lab=labItem(g.week);
     const txt=lab.studiedag?"Studiedag":"Laboration:"+(lab.title?" "+esc(lab.title):"");
     return `<tr${lab.studiedag?' class="blocked"':''}><td>${esc(g.week)}</td><td>${esc(row.day)}</td><td><b>${txt}</b></td><td></td><td></td></tr>`;
   }
   const s=row.slot;
   const v=slotView(s);
   const cls=s.blocked?' class="blocked"':'';
   return `<tr${cls}><td>${esc(s.week)}</td><td>${esc(s.day)}</td><td>${s.blocked?'<b>'+esc(s.label)+'</b>':esc(v?.title||"")}</td><td>${s.blocked?'':esc(v?.pages||"")}</td><td>${s.blocked?'':esc(v?.other||"")}</td></tr>`;
 })).join("");
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(state.title)}</title>
 <style>body{font-family:Arial,sans-serif;font-size:10pt}.dochead{display:flex;align-items:center;margin:0 0 12px 0}.dochead img{width:95px;height:auto}.dochead h1{text-align:center;font-family:Georgia,serif;font-size:18pt;flex:1;margin:0}table{border-collapse:collapse;width:100%}th{background:#ddd}th,td{border:1px solid #555;padding:5px;vertical-align:top}.blocked td{background:#e8eaed}td:first-child{width:7%}td:nth-child(2){width:12%}td:nth-child(3){width:42%}td:nth-child(4){width:18%}td:nth-child(5){width:21%}</style></head><body>
 <div class="dochead"><img src="${LOGO}" alt="Erik Dahlbergsgymnasiet"><h1>${esc(state.title)}</h1></div>
 <table><thead><tr><th>Vecka</th><th>Dag</th><th>Avsnitt</th><th>Sidor</th><th>Övrigt</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
 const blob=new Blob([html],{type:"application/msword"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(state.title||"planering")+".doc";a.click();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.getElementById("logoImg").src=LOGO;
document.addEventListener("click",closeCtx);
document.addEventListener("scroll",closeCtx,true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCtx()});
window.addEventListener("resize",closeCtx);
state.lessons=seedLessons.map(x=>({...x}));
if(!state.labs) state.labs=defaultLabs();
normalizePeriods();
renderPeriods();
bindLabControls();
rebuildSchedule();
render();

function showTab(id,btn){
 document.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");btn.classList.add("active");
}
</script>
</body>
</html>
