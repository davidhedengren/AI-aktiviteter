u('7.14',7,'fasandring','C','(1/2/0)',
`<p>Jämför två olyckor: 100 g kokande vatten (100 °C) och 100 g vattenånga (100 °C) hamnar på huden och kyls till 37 °C. Det krävs 2260 kJ för att förånga ett kilo vatten.</p>
<ol><li>Hur mycket energi avger vattnet?</li><li>Hur mycket avger ångan?</li>
<li>Varför är brännskador av ånga så mycket allvarligare?</li></ol>`,
`<p>a) E = 4180·0,100·63 = <strong>26 kJ</strong></p>
<p>b) Ångan måste först kondensera: 2260·0,100 = 226 kJ, plus 26 kJ → <strong>252 kJ</strong></p>
<p>c) Nästan tio gånger mer energi, trots samma temperatur och massa. Kondensationen frigörs på ett ögonblick.</p>`),

u('7.15',7,'fasandring','E','(2/0/0)',
`<p>Hur mycket energi krävs för att smälta 250 g is som håller 0 °C, och sedan värma smältvattnet till 20 °C?</p>`,
`<p>Smältning: 0,250·334 000 = 83,5 kJ</p><p>Uppvärmning: 4180·0,250·20 = 20,9 kJ</p>
<p>Totalt <strong>104 kJ</strong>, varav smältningen står för fyra femtedelar.</p>`),

u('7.16',7,'fasandring','C','(0/2/0)',
`<p>På ett kallt glas bildas 5,0 g kondens från luftens vattenånga. Det krävs 2260 kJ för att förånga ett kilo vatten.</p>
<ol><li>Hur mycket energi avges till glaset när ångan kondenserar?</li>
<li>Hur mycket skulle det värma 200 g dryck i glaset?</li>
<li>Varför känns luften svalare efter ett åskregn?</li></ol>`,
`<p>a) E = 0,0050·2 260 000 = <strong>11,3 kJ</strong></p>
<p>b) ΔT = 11 300/(4180·0,200) = <strong>13,5 °C</strong> — kondensen motverkar alltså kylningen märkbart</p>
<p>c) Vid avdunstning gäller det omvända: vattnet tar upp energi ur luften, som därmed svalnar.</p>`),

/* ── KAPITEL 8 ── */
u('8.16',8,'kopplingar','E','(2/1/0)',
`<p>Två resistorer, 220 Ω och 330 Ω, seriekopplas till ett batteri på 9,0 V.</p>
<ol><li>Bestäm ersättningsresistansen.</li><li>Hur stor ström går genom kretsen?</li>
<li>Vilken spänning ligger över varje resistor?</li></ol>`,
`<p>a) R = 220 + 330 = <strong>550 Ω</strong></p><p>b) I = 9,0/550 = <strong>16 mA</strong></p>
<p>c) U₁ = 3,6 V och U₂ = 5,4 V — summan är batteriets spänning.</p>`),

u('8.17',8,'kopplingar','E','(2/1/0)',
`<p>Samma två resistorer, 220 Ω och 330 Ω, parallellkopplas istället till samma batteri på 9,0 V.</p>
<ol><li>Bestäm ersättningsresistansen.</li><li>Hur stor blir den totala strömmen?</li>
<li>Varför blir ersättningsresistansen mindre än den minsta enskilda resistorn?</li></ol>`,
`<p>a) R = 220·330/550 = <strong>132 Ω</strong></p><p>b) I = 9,0/132 = <strong>68 mA</strong></p>
<p>c) Parallellkoppling ger strömmen fler vägar att välja på. Fler vägar innebär alltid lägre totalt motstånd.</p>`),

u('8.18',8,'kopplingar','C','(1/2/0)',
`<p>En resistor på 100 Ω är seriekopplad med två parallellkopplade resistorer på 200 Ω och 300 Ω. Kretsen matas med 12 V.</p>
<ol><li>Bestäm parallellkopplingens ersättningsresistans.</li><li>Bestäm kretsens totala resistans.</li>
<li>Hur stor är strömmen genom 100-ohmsresistorn?</li><li>Vilken spänning ligger över parallellkopplingen?</li></ol>`,
`<p>a) 200·300/500 = <strong>120 Ω</strong></p><p>b) 100 + 120 = <strong>220 Ω</strong></p>
<p>c) I = 12/220 = <strong>55 mA</strong></p><p>d) U = 0,0545·120 = <strong>6,5 V</strong></p>`),

u('8.19',8,'kopplingar','C','(0/2/0)',
`<p>Tre likadana lampor kopplas till ett batteri. I krets A sitter alla tre i serie. I krets B sitter alla tre parallellt.</p>
<ol><li>I vilken krets lyser varje enskild lampa starkast? Motivera.</li>
<li>I vilken krets tar batteriet slut snabbast?</li>
<li>En lampa går sönder i vardera kretsen. Vad händer med de övriga?</li></ol>`,
`<p>a) I <strong>krets B</strong> — där ligger hela batterispänningen över varje lampa, mot en tredjedel i serie.</p>
<p>b) Krets B, eftersom den totala effekten är mycket högre.</p>
<p>c) I serie slocknar alla, eftersom kretsen bryts. I parallellkoppling lyser de övriga vidare opåverkade.</p>`),

u('8.20',8,'kopplingar','A','(0/2/1)',
`<p>Ett batteri på 12 V är kopplat till två seriekopplade resistorer. Den ena är 150 Ω, den andra okänd. En amperemeter visar 50 mA.</p>
<ol><li>Bestäm kretsens totala resistans.</li><li>Bestäm den okända resistorns värde.</li>
<li>Vilken effekt utvecklas i vardera resistorn?</li></ol>`,
`<p>a) R = U/I = 12/0,050 = <strong>240 Ω</strong></p><p>b) 240 − 150 = <strong>90 Ω</strong></p>
<p>c) P = RI²: <strong>0,38 W</strong> och <strong>0,23 W</strong>. Störst resistans utvecklar störst effekt vid seriekoppling.</p>`),

u('8.21',8,'laddning','E','(2/0/0)',
`<p>Två laddade kulor med laddningarna 5,0 nC och 8,0 nC befinner sig 4,0 cm från varandra.</p>
<p>Bestäm den elektriska kraften mellan dem och ange om den är attraherande eller repellerande.</p>`,
`<p>F = kq₁q₂/r² = 8,99·10⁹·5,0·10⁻⁹·8,0·10⁻⁹/0,040²</p>
<p>F = <strong>225 µN</strong>, <strong>repellerande</strong> eftersom laddningarna har samma tecken.</p>`),

u('8.22',8,'laddning','E','(2/1/0)',
`<p>En negativt laddad stav förs nära ett oladdat metallklot utan att röra det. Klotets ena sida blir positiv och den andra negativ.</p>
<ol><li>Vad kallas fenomenet?</li><li>Vilka partiklar är det som flyttar sig, och åt vilket håll?</li>
<li>Vad händer med klotet när staven förs bort igen?</li></ol>`,
`<p>a) <strong>Influens</strong></p>
<p>b) Ledningselektronerna, som stöts bort från staven till klotets bortre sida. Protonerna sitter fast i atomkärnorna och rör sig inte.</p>
<p>c) Elektronerna fördelar sig jämnt igen och klotet blir neutralt överallt. Ingen nettoladdning har tillförts.</p>`),

u('8.23',8,'laddning','C','(0/2/0)',
`<p>Tre laddade kulor sitter på en rak linje. A har +6,0 nC, B har +6,0 nC och sitter 5,0 cm till höger om A. C har −6,0 nC och sitter 5,0 cm till höger om B.</p>
<p>Bestäm den resulterande kraften på kulan B, till storlek och riktning.</p>`,
`<p>Från A: repulsion åt höger, F = 8,99·10⁹·36·10⁻¹⁸/0,050² = 129 µN</p>
<p>Från C: attraktion åt höger, lika stor eftersom laddning och avstånd är desamma: 129 µN</p>
<p>Krafterna är riktade åt samma håll: <strong>259 µN åt höger</strong></p>`),

u('8.24',8,'laddning','C','(1/2/0)',
`<p>Två likadana metallkulor har laddningarna +12 µC och −4,0 µC. De förs ihop så att de nuddar varandra och skiljs sedan åt igen.</p>
<ol><li>Vilken laddning har vardera kula efteråt?</li>
<li>Har någon laddning försvunnit? Motivera.</li>
<li>Blir kraften mellan dem attraherande eller repellerande efteråt?</li></ol>`,
`<p>a) Totalt +8,0 µC delas lika: <strong>+4,0 µC</strong> på vardera</p>
<p>b) Nej. Den totala laddningen är +8,0 µC både före och efter — laddning kan inte skapas eller förstöras, bara flyttas.</p>
<p>c) <strong>Repellerande</strong>, eftersom båda nu har samma tecken.</p>`),

u('8.25',8,'laddning','A','(0/1/2)',
`<p>Två positiva laddningar sitter 10 cm från varandra: 9,0 nC i punkten A och 4,0 nC i punkten B.</p>
<ol><li>Var på linjen mellan dem kan en tredje laddning placeras utan att påverkas av någon resulterande kraft?</li>
<li>Spelar den tredje laddningens storlek eller tecken någon roll?</li></ol>`,
`<p>Jämvikt kräver 9,0/x² = 4,0/(10−x)² → 3/x = 2/(10−x) → 30 − 3x = 2x</p>
<p>a) x = <strong>6,0 cm från A</strong>, alltså 4,0 cm från B — närmare den svagare laddningen</p>
<p>b) Nej. Den tredje laddningen förekommer i båda krafterna och förkortas bort.</p>`),

u('8.26',8,'kretsar','E','(2/0/0)',
`<p>Genom en resistor på 470 Ω går strömmen 25 mA.</p>
<ol><li>Vilken spänning ligger över resistorn?</li><li>Vilken effekt utvecklas i den?</li></ol>`,
`<p>a) U = RI = 470·0,025 = <strong>11,8 V</strong></p><p>b) P = UI = 11,75·0,025 = <strong>0,29 W</strong></p>`),

u('8.27',8,'kretsar','E','(2/1/0)',
`<p>Genom en ledning går strömmen 0,80 A under 3,0 minuter.</p>
<ol><li>Hur stor laddning passerar?</li><li>Hur många elektroner motsvarar det?</li></ol>`,
`<p>a) Q = It = 0,80·180 = <strong>144 C</strong></p>
<p>b) n = Q/e = 144/1,602·10⁻¹⁹ = <strong>9,0·10²⁰ elektroner</strong></p>`),

u('8.28',8,'kretsar','C','(0/2/0)',
`<p>En metalltråd har resistansen 12 Ω. Man byter till en tråd av samma material som är dubbelt så lång och har halva tvärsnittsarean.</p>
<ol><li>Vilken resistans får den nya tråden?</li><li>Motivera med hjälp av sambandet R = ρL/A.</li>
<li>Vad skulle krävas för att halvera resistansen istället?</li></ol>`,
`<p>a) <strong>48 Ω</strong></p>
<p>b) Dubbel längd fördubblar R, halverad area fördubblar den igen: 2·2 = 4 gånger.</p>
<p>c) Halverad längd eller dubblerad area — eller ett material med halva resistiviteten.</p>`),

u('8.29',8,'falt','E','(2/0/0)',
`<p>Två parallella plattor ligger 4,0 mm från varandra och har spänningen 230 V mellan sig.</p>
<p>Bestäm den elektriska fältstyrkan mellan plattorna.</p>`,
`<p>E = U/d = 230/0,0040 = <strong>58 kV/m</strong></p>`),

u('8.30',8,'falt','C','(1/2/0)',
`<p>En liten kula har laddningen 25 nC.</p>
<ol><li>Hur stark är fältstyrkan 8,0 cm från kulan?</li>
<li>Hur stark är den 16 cm från kulan?</li><li>Formulera sambandet mellan fältstyrka och avstånd.</li></ol>`,
`<p>a) E = kQ/r² = 8,99·10⁹·25·10⁻⁹/0,080² = <strong>35 kV/m</strong></p>
<p>b) Dubbelt avstånd ger en fjärdedel: <strong>8,8 kV/m</strong></p>
<p>c) Fältstyrkan avtar med kvadraten på avståndet, E ∝ 1/r².</p>`),

u('8.31',8,'falt','C','(0/2/0)',
`<p>Ett batteri på 9,0 V driver ström genom två seriekopplade resistorer, 300 Ω och 600 Ω. Batteriets minuspol är jordad.</p>
<ol><li>Bestäm strömmen.</li><li>Bestäm potentialen i punkten mellan resistorerna.</li>
<li>Vad skulle potentialen i samma punkt bli om istället pluspolen jordades?</li></ol>`,
`<p>a) I = 9,0/900 = <strong>10 mA</strong></p>
<p>b) Räknat från minuspolen: U över 600-ohmsresistorn är 6,0 V → <strong>+6,0 V</strong> (om 600 Ω sitter mot jord)</p>
<p>c) Då ligger nollan i andra änden och samma punkt får potentialen <strong>−3,0 V</strong>. Spänningarna är desamma — bara nollnivån flyttas.</p>`),

/* ── KAPITEL 9 ── */
u('9.13',9,'stralning','E','(2/1/0)',
`<p>Den genomsnittliga bakgrundsstrålningen i Sverige ger ungefär 2,4 mSv per år.</p>
<ol><li>Hur mycket blir det per dygn?</li>
<li>En lungröntgen ger 0,1 mSv. Hur många dygns bakgrundsstrålning motsvarar det?</li>
<li>En flygresa till New York ger 0,05 mSv. Kommentera storleksordningarna.</li></ol>`,
`<p>a) 2,4/365 = <strong>6,6 µSv per dygn</strong></p>
<p>b) 0,1/0,0066 ≈ <strong>15 dygn</strong></p>
<p>c) Alla tre ligger i samma storleksordning. En enstaka röntgen ger ungefär lika mycket som två veckors normalt liv.</p>`),

u('9.14',9,'stralning','C','(1/2/0)',
`<p>För en viss gammastrålning är strålningen halveras för varje 1,2 cm bly den passerar.</p>
<ol><li>Hur stor andel av strålningen passerar 3,6 cm bly?</li>
<li>Hur stor andel passerar 6,0 cm?</li><li>Blir strålningen någonsin exakt noll? Motivera.</li></ol>`,
`<p>a) 3,6/1,2 = 3 halveringstjocklekar → 1/8 = <strong>13 %</strong></p>
<p>b) 6,0/1,2 = 5 → 1/32 = <strong>3,1 %</strong></p>
<p>c) Nej. Varje skikt halverar, så andelen närmar sig noll men når den aldrig. Man dimensionerar mot en acceptabel nivå, inte mot noll.</p>`),

u('9.15',9,'stralning','C','(0/2/1)',
`<p>En strålkälla ger dosraten 120 µSv/h på avståndet 1,0 m.</p>
<ol><li>Vilken dosrat råder på 3,0 m avstånd?</li><li>På vilket avstånd är dosraten 5,0 µSv/h?</li>
<li>Vilken av åtgärderna avstånd, tid och avskärmning är billigast i praktiken?</li></ol>`,
`<p>a) Avståndslagen ger 1/3² = 1/9 → <strong>13 µSv/h</strong></p>
<p>b) 120/r² = 5,0 → r = √24 = <strong>4,9 m</strong></p>
<p>c) Avstånd. Att flytta sig kostar ingenting och verkar med kvadraten, medan blyavskärmning är tung och dyr.</p>`),

u('9.16',9,'karnreaktioner','E','(2/0/0)',
`<p>Skriv färdigt reaktionsformlerna.</p>
<ol><li>²²⁶₈₈Ra → ____ + ⁴₂He</li><li>³²₁₅P → ³²₁₆S + ____ + ν̄</li></ol>`,
`<p>a) Masstal 226 − 4 = 222, atomnummer 88 − 2 = 86 → <strong>²²²₈₆Rn</strong></p>
<p>b) Atomnumret ökar med 1 och masstalet är detsamma → en <strong>elektron, e⁻</strong> (β⁻-sönderfall)</p>`),

u('9.17',9,'karnreaktioner','C','(1/2/0)',
`<p>En kärna med masstalet A och atomnumret Z genomgår 3 α-sönderfall och 2 β⁻-sönderfall.</p>
<ol><li>Vilket masstal har slutprodukten?</li><li>Vilket atomnummer?</li>
<li>Varför ändrar β⁻-sönderfall inte masstalet?</li></ol>`,
`<p>a) Endast α ändrar masstalet: <strong>A − 12</strong></p>
<p>b) −2 per α och +1 per β⁻: Z − 6 + 2 = <strong>Z − 4</strong></p>
<p>c) En neutron omvandlas till en proton. Antalet nukleoner är detsamma, bara laddningen ändras.</p>`),

u('9.18',9,'aktivitet','C','(1/2/0)',
`<p>Ett preparat innehåller 5,0·10¹⁵ kärnor av en nuklid med halveringstiden 8,0 dygn.</p>
<ol><li>Bestäm sönderfallskonstanten i s⁻¹.</li><li>Bestäm preparatets aktivitet.</li>
<li>Hur stor är aktiviteten efter 24 dygn?</li></ol>`,
`<p>a) λ = ln2/(8,0·86 400) = <strong>1,0·10⁻⁶ s⁻¹</strong></p>
<p>b) A = λN = 1,00·10⁻⁶·5,0·10¹⁵ = <strong>5,0 GBq</strong></p>
<p>c) 24 dygn = 3 halveringstider → 5,0/8 = <strong>0,63 GBq</strong></p>`)
);

`<p>Prefixen framför en enhet betyder olika tiopotenser.</p>
<ol><li>Skriv 4,5 mikrometer i meter.</li><li>Skriv 0,000 000 12 m med prefix.</li>
<li>Vilket är störst: 500 nanometer eller 0,3 mikrometer?</li></ol>`,

u('2.22',2,'enheter','A','(0/1/2)',
`<p>En elev minns inte om formeln för farten vid fritt fall är v = √(2gh) eller v = 2gh.</p>
<ol><li>Vilka enheter har g och h?</li><li>Vilken enhet får de två uttrycken?</li>
<li>Vilken formel måste vara rätt, och varför räcker enheterna som bevis för att den andra är fel?</li></ol>`,

<p>b) 2gh ger m/s²·m = m²/s². Roten ur det ger m/s.</p>
<p>c) Farten ska ha enheten m/s, alltså är <strong>v = √(2gh)</strong> rätt. Enheter kan avslöja en felaktig formel, men de bevisar inte att en formel är rätt — en glömd faktor 2 syns inte.</p>`),

u('2.23',2,'densitet','E','(2/0/0)',
`<p>En liter mjölk väger 1,03 kg.</p>
<ol><li>Vilken densitet har mjölken i g/cm³?</li><li>Flyter eller sjunker mjölk i vatten?</li></ol>`,

<p>b) Densiteten är högre än vattnets 1,00 g/cm³, så mjölken <strong>sjunker</strong>.</p>`),

u('2.24',2,'densitet','E','(2/1/0)',
`<p>En ring av rent guld väger 8,4 g. Guld har densiteten 19,3 g/cm³.</p>
<ol><li>Vilken volym har ringen?</li><li>Hur skulle du kunna mäta volymen utan att skada ringen?</li></ol>`,

<p>b) Sänk ner den i ett mätglas med vatten och läs av hur mycket vattenytan stiger.</p>`),

u('2.25',2,'densitet','C','(1/2/0)',
`<p>En klump ser ut att vara av massivt järn. Den väger 500 g och har volymen 90 cm³. Järn har densiteten 7,87 g/cm³.</p>
<ol><li>Vilken volym skulle 500 g massivt järn ha?</li><li>Hur stort är hålrummet inuti klumpen?</li>
<li>Vilken densitet mäter man upp för klumpen?</li></ol>`,
`<p>a) V = 500/7,87 = <strong>64 cm³</strong></p>
<p>b) 90 − 63,5 = <strong>27 cm³</strong> hålrum</p>
<p>c) ρ = 500/90 = <strong>5,6 g/cm³</strong>, alltså lägre än järnets.</p>`),

u('2.26',2,'densitet','A','(0/2/1)',
`<p>Jordens massa är 5,97·10²⁴ kg och radien 6371 km. Volymen av ett klot är 4πr³/3.</p>
<ol><li>Beräkna jordens medeldensitet.</li>
<li>Vanligt berg har densiteten omkring 2700 kg/m³. Vad säger jämförelsen om jordens inre?</li></ol>`,

<p>b) Medeldensiteten är dubbelt så hög som bergets. Alltså måste jordens inre bestå av något betydligt tätare — järn och nickel i kärnan.</p>`),

u('3.19',3,'hastighet','E','(2/0/0)',
`<p>Ett tåg kör 340 km på 2 timmar och 50 minuter.</p>

u('3.20',3,'hastighet','E','(2/1/0)',
`<p>Du ser en blixt och hör åskan 6,0 sekunder senare. Ljudet går 340 m/s och ljuset i praktiken direkt.</p>
<ol><li>Hur långt bort slog blixten ner?</li><li>Varför kan man bortse från ljusets restid?</li></ol>`,
`<p>a) s = 340·6,0 = <strong>2,0 km</strong></p>
<p>b) Ljuset går nästan en miljon gånger snabbare. Det tar 7 miljondels sekunder på den sträckan.</p>`),

u('3.21',3,'hastighet','C','(1/2/0)',
`<p>En löpare springer ett helt varv på en 400-metersbana på 62 sekunder och slutar där hon startade.</p>
<ol><li>Vilken medelfart har hon?</li><li>Vilken medelhastighet har hon?</li>
<li>Förklara skillnaden mellan fart och hastighet med hjälp av svaren.</li></ol>`,
`<p>a) Farten räknas på sträckan: 400/62 = <strong>6,5 m/s</strong></p>
<p>b) Hastigheten räknas på lägesändringen, som är noll → <strong>0 m/s</strong></p>
<p>c) Fart är hur långt man färdats. Hastighet är hur långt man flyttat sig, och åt vilket håll.</p>`),

u('3.22',3,'hastighet','A','(0/2/1)',
`<p>En båt går 4,2 m/s i stilla vatten. Den ska ta sig 850 m i en flod där strömmen är 1,3 m/s.</p>
<ol><li>Hur lång tid tar sträckan medströms?</li><li>Hur lång tid tar den motströms?</li>
<li>Blir den sammanlagda tiden fram och tillbaka längre eller kortare än utan ström? Motivera.</li></ol>`,
`<p>a) v = 4,2 + 1,3 = 5,5 m/s → t = <strong>155 s</strong></p>
<p>b) v = 4,2 − 1,3 = 2,9 m/s → t = <strong>293 s</strong></p>
<p>c) Längre: 448 s mot 405 s utan ström. Båten tillbringar mycket mer tid i den långsamma riktningen, så den vinner mindre än den förlorar.</p>`),

u('3.23',3,'diagram','E','(2/1/0)',
`<p>En vagn står stilla vid t = 0. Sedan har den den konstanta accelerationen 3,0 m/s² i 4,0 sekunder.</p>
<ol><li>Rita ett a-t-diagram.</li><li>Vilken fart har vagnen efter 4,0 s?</li>
<li>Hur långt har den kommit?</li></ol>`,
`<p>a) En vågrät linje på nivån 3,0 m/s².</p>
<p>b) Arean under a-t-kurvan är hastighetsändringen: 3,0·4,0 = <strong>12 m/s</strong></p>
<p>c) s = v·t/2 = 12·4,0/2 = <strong>24 m</strong></p>`),

u('3.24',3,'diagram','C','(0/2/0)',
`<p>Ett tåg kör med 6,0 m/s framåt i 5,0 sekunder. Sedan kör det 4,0 m/s bakåt i 3,0 sekunder.</p>
<ol><li>Rita ett v-t-diagram där bakåt räknas som negativt.</li>
<li>Hur långt har tåget färdats totalt?</li><li>Hur långt från startpunkten står det till slut?</li></ol>`,
`<p>b) Sträckan är summan av areornas storlek: 30 + 12 = <strong>42 m</strong></p>
<p>c) Lägesändringen är arean med tecken: 30 − 12 = <strong>18 m</strong> från start</p>`),

u('3.25',3,'diagram','C','(0/2/1)',
`<p>I ett s-t-diagram är kurvan böjd uppåt och blir brantare hela tiden.</p>
<ol><li>Vad säger det om farten?</li><li>Vad säger det om accelerationen?</li>
<li>Hur tar man reda på farten vid en bestämd tidpunkt i ett sådant diagram?</li></ol>`,
`<p>a) Farten ökar, eftersom lutningen är farten och lutningen växer.</p>
<p>b) Accelerationen är positiv. Om kurvan böjer lika mycket hela tiden är den dessutom konstant.</p>
<p>c) Man ritar en tangent i punkten och mäter tangentens lutning.</p>`),

u('3.26',3,'diagram','A','(0/1/2)',
`<p>Två bilar kör på samma väg. I ett s-t-diagram är bil A en rät linje. Bil B är en kurva som startar flackare men blir brantare, och de två kurvorna korsar varandra vid t = 20 s.</p>
<ol><li>Vad betyder korsningspunkten?</li><li>Vilken bil är snabbast före korsningen?</li>
<li>Hur ser du i diagrammet när bilarna har samma fart?</li></ol>`,
`<p>a) Bilarna är på samma plats samtidigt — B kör om A.</p>
<p>b) A, eftersom dess linje är brantare fram till korsningen.</p>
<p>c) Där kurvorna har samma lutning, alltså där B:s tangent är parallell med A:s linje. Det sker tidigare än korsningen.</p>`),

u('3.27',3,'konstacc','E','(2/0/0)',
`<p>En sten släpps från ett berg som är 45 m högt.</p>
<ol><li>Hur lång tid tar fallet?</li><li>Vilken fart har stenen när den slår i marken?</li></ol>`,
`<p>a) h = gt²/2 → t = √(2·45/9,82) = <strong>3,0 s</strong></p>
<p>b) v = gt = 9,82·3,03 = <strong>30 m/s</strong></p>`),

u('3.28',3,'konstacc','C','(1/2/0)',
`<p>En sten kastas rakt nedåt med farten 8,0 m/s från en bro som är 22 m hög.</p>
<ol><li>Vilken fart har stenen när den träffar vattnet?</li><li>Hur lång tid tar fallet?</li>
<li>Hur mycket snabbare går det än om stenen bara släpps?</li></ol>`,
`<p>a) v² = v₀² + 2gh → v = √(64 + 432) = <strong>22 m/s</strong></p>
<p>b) t = (v − v₀)/g = (22,3 − 8,0)/9,82 = <strong>1,5 s</strong></p>
<p>c) Ett fritt fall från 22 m tar 2,1 s, alltså <strong>0,6 s längre</strong>.</p>`),

u('3.29',3,'konstacc','C','(0/2/0)',
`<p>En bil startar från stillastående och accelererar med 2,5 m/s² tills den når 25 m/s. Därefter håller den den farten.</p>
<ol><li>Hur lång tid tar accelerationen, och hur långt kör bilen då?</li>
<li>Hur lång tid tar det totalt att köra 200 m från start?</li></ol>`,
`<p>a) t = 25/2,5 = <strong>10 s</strong>, s = 25²/(2·2,5) = <strong>125 m</strong></p>
<p>b) Kvar: 75 m i 25 m/s → 3,0 s. Totalt <strong>13 s</strong></p>`),

u('3.30',3,'konstacc','A','(0/1/2)',
`<p>En bil kör i 90 km/h. Föraren ser en älg och bromsar. Bromssträckan är 55 m.</p>
<ol><li>Vilken retardation har bilen?</li>
<li>Hur lång blir bromssträckan om farten istället är 120 km/h, med samma retardation?</li>
<li>Farten ökade med 33 %. Hur många procent längre blev bromssträckan, och varför stämmer inte de talen överens?</li></ol>`,
`<p>a) v = 25 m/s → a = v²/2s = 625/110 = <strong>5,7 m/s²</strong></p>
<p>b) v = 33,3 m/s → s = 1111/11,4 = <strong>98 m</strong></p>
<p>c) Bromssträckan ökade med <strong>78 %</strong>. Sträckan beror på farten i kvadrat, så en ökning med en tredjedel ger 1,33² ≈ 1,8 gånger längre sträcka.</p>`)
);

u('4.32',4,'newton','E','(2/0/0)',
`<p>En raket har massan 5000 kg. Motorn ger kraften 90 kN rakt uppåt.</p>
<ol><li>Hur stor är tyngdkraften på raketen?</li><li>Vilken acceleration får raketen vid start?</li></ol>`,
`<p>a) F = mg = 5000·9,82 = <strong>49 kN</strong></p>
<p>b) Resultant 90 − 49,1 = 40,9 kN → a = 40 900/5000 = <strong>8,2 m/s²</strong></p>`),

u('4.33',4,'newton','C','(1/2/0)',
`<p>Två klossar står i kontakt med varandra på ett friktionsfritt bord. Den ena väger 3,0 kg och den andra 5,0 kg. Man trycker på 3-kilosklossen med kraften 24 N.</p>
<ol><li>Vilken acceleration får klossarna?</li><li>Hur stor kraft trycker den första klossen på den andra med?</li>
<li>Hur stor kraft trycker den andra tillbaka med?</li></ol>`,
`<p>a) a = F/(m₁+m₂) = 24/8,0 = <strong>3,0 m/s²</strong></p>
<p>b) Bara den kraften driver den andra klossen: F = 5,0·3,0 = <strong>15 N</strong></p>
<p>c) Lika stor, <strong>15 N</strong>, enligt Newtons tredje lag.</p>`),

u('4.34',4,'newton','C','(0/2/0)',
`<p>En kloss på 2,0 kg ligger på ett friktionsfritt bord. Ett snöre går från klossen över en trissa vid bordskanten. I snöret hänger en vikt på 0,50 kg.</p>
<ol><li>Vilken kraft drar systemet framåt?</li><li>Vilken acceleration får klossen?</li>
<li>Hur stor är spännkraften i snöret?</li></ol>`,
`<p>a) Endast vikten tyngd: F = 0,50·9,82 = <strong>4,9 N</strong></p>
<p>b) a = F/(2,0 + 0,50) = <strong>2,0 m/s²</strong></p>
<p>c) Klossen: S = m·a = 2,0·1,96 = <strong>3,9 N</strong>, alltså mindre än vikten tyngd.</p>`),

u('4.35',4,'newton','A','(0/1/2)',
`<p>En person står i en hiss på en våg. Hissen åker en hel tur uppåt: den startar, håller jämn fart och bromsar in.</p>
<ol><li>Rita hur vågens utslag ändras under de tre faserna.</li>
<li>När visar vågen mer än personens vanliga vikt, och när mindre?</li>
<li>Vad skulle vågen visa om linan gick av?</li></ol>`,
`<p>a) Först ett högre värde, sedan det vanliga, sist ett lägre.</p>
<p>b) Mer när hissen accelererar uppåt vid start. Mindre när den bromsar, eftersom accelerationen då är riktad nedåt.</p>
<p>c) <strong>Noll.</strong> Person och våg faller lika fort, så personen trycker inte alls mot vågen.</p>`),

u('4.36',4,'gravitation','E','(2/0/0)',
`<p>På Mars är tyngdaccelerationen 3,71 m/s².</p>
<ol><li>Hur stor tyngd har en robot på 78 kg på Mars?</li><li>Hur många gånger tyngre är den på jorden?</li></ol>`,
`<p>a) F = 78·3,71 = <strong>289 N</strong></p><p>b) 766/289 = <strong>2,6 gånger</strong></p>`),

u('4.37',4,'gravitation','C','(0/2/0)',
`<p>En nyupptäckt planet har massan 4,0·10²⁴ kg och radien 5000 km. Gravitationskonstanten är 6,674·10⁻¹¹ Nm²/kg².</p>
<ol><li>Beräkna tyngdaccelerationen vid planetens yta.</li>
<li>Hur mycket väger en person på 70 kg där?</li></ol>`,
`<p>a) g = GM/r² = 6,674·10⁻¹¹·4,0·10²⁴/(5,0·10⁶)² = <strong>10,7 m/s²</strong></p>
<p>b) F = 70·10,68 = <strong>748 N</strong>, alltså något tyngre än på jorden.</p>`),

u('4.38',4,'gravitation','C','(1/2/0)',
`<p>En låda på 20 kg står på golvet i en hiss.</p>
<ol><li>Hissen står stilla. Hur stor är normalkraften?</li>
<li>Hissen bromsar in på väg nedåt med 2,0 m/s². Hur stor är normalkraften då?</li>
<li>Åt vilket håll är accelerationen i b?</li></ol>`,
`<p>a) N = mg = <strong>196 N</strong></p>
<p>b) Bromsning på väg ned betyder acceleration uppåt: N = m(g + a) = 20·11,82 = <strong>236 N</strong></p>
<p>c) <strong>Uppåt</strong> — motsatt rörelseriktningen.</p>`),

u('4.39',4,'gravitation','A','(0/1/2)',
`<p>I en fritt fallande hiss släpper en person ett äpple.</p>
<ol><li>Vad händer med äpplet sett från personen inuti hissen?</li>
<li>Vad händer sett från någon som står utanför?</li>
<li>Är personen tyngdlös? Verkar det någon gravitationskraft på henne?</li></ol>`,
`<p>a) Äpplet svävar stilla framför henne.</p>
<p>b) Både äpplet, hissen och personen faller med 9,82 m/s². De faller lika fort och behåller därför sina lägen i förhållande till varandra.</p>
<p>c) Hon känner sig tyngdlös, men gravitationen verkar med full styrka. Det som saknas är normalkraften från golvet — och det är den vi känner som vikt.</p>`),

u('4.40',4,'fjadrar','E','(2/0/0)',
`<p>En fjäder har fjäderkonstanten 95 N/m. I den hängs en vikt på 1,4 kg.</p>
<p>Hur långt dras fjädern ut?</p>`,

u('4.41',4,'fjadrar','C','(0/2/0)',
`<p>Två fjädrar hängs efter varandra i taket. Den övre har fjäderkonstanten 30 N/m och den undre 45 N/m. I den undre hängs en vikt på 0,50 kg.</p>
<ol><li>Hur stor kraft drar i vardera fjädern?</li><li>Hur långt dras varje fjäder ut?</li>
<li>Hur stor blir den totala förlängningen?</li></ol>`,
`<p>a) Båda bär hela tyngden: <strong>4,9 N</strong> i vardera</p>
<p>b) 4,91/30 = <strong>16 cm</strong> och 4,91/45 = <strong>11 cm</strong></p>
<p>c) 16 + 11 = <strong>27 cm</strong></p>`),

u('4.42',4,'fjadrar','C','(1/2/0)',
`<p>En elev mäter hur mycket en fjäder dras ut vid olika belastning.</p>
<table class="data"><tr><th>F (N)</th><th>Δl (cm)</th></tr>
<tr><td>3,0</td><td>5,0</td></tr><tr><td>6,0</td><td>10,0</td></tr>
<tr><td>9,0</td><td>15,0</td></tr><tr><td>12,0</td><td>20,0</td></tr></table>
<ol><li>Rita ett diagram med kraften på y-axeln.</li><li>Bestäm fjäderkonstanten ur lutningen.</li>
<li>Hur långt skulle fjädern dras ut av 15 N?</li></ol>`,
`<p>b) k = ΔF/Δ(Δl) = 12,0/0,20 = <strong>60 N/m</strong></p>
<p>c) Δl = 15/60 = <strong>25 cm</strong>, om fjädern fortfarande följer Hookes lag.</p>`),

u('4.43',4,'fjadrar','A','(0/1/2)',
`<p>En fjäder tål att dras ut högst 30 cm innan den blir förstörd. Fjäderkonstanten är 250 N/m.</p>
<ol><li>Hur stor kraft motsvarar den gränsen?</li>
<li>Hur tung vikt kan hängas i fjädern om den ska hänga stilla?</li>
<li>Varför går fjädern sönder om man släpper vikten från fjäderns obelastade läge, trots att vikten är lättare än gränsen i b?</li></ol>`,
`<p>a) F = kx = 250·0,30 = <strong>75 N</strong></p>
<p>b) m = 75/9,82 = <strong>7,6 kg</strong></p>
<p>c) En vikt som släpps svänger förbi jämviktsläget och sträcker fjädern ungefär dubbelt så långt innan den vänder. Redan halva massan räcker då för att nå gränsen.</p>`),

u('4.44',4,'friktion','E','(2/0/0)',
`<p>Det krävs 140 N för att dra en låda på 45 kg med jämn fart över ett golv.</p>
<p>Bestäm friktionstalet mellan lådan och golvet.</p>`,

u('4.45',4,'friktion','C','(1/2/0)',
`<p>En låda på 30 kg ska dras uppför ett plan som lutar 15°. Friktionstalet är 0,25.</p>
<ol><li>Hur stor är tyngdkraftens komposant längs planet?</li><li>Hur stor är friktionskraften?</li>
<li>Hur stor dragkraft krävs för jämn fart uppför?</li></ol>`,
`<p>a) mg·sin 15° = <strong>76 N</strong></p>
<p>b) f = μ·mg·cos 15° = 0,25·284,5 = <strong>71 N</strong></p>
<p>c) F = 76 + 71 = <strong>147 N</strong> — friktionen motverkar rörelsen och ska därför läggas till.</p>`),

u('4.46',4,'friktion','C','(0/2/0)',
`<p>En bil kör i 90 km/h och tvärbromsar. Bromssträckan blir 48 m.</p>
<ol><li>Vilken retardation har bilen?</li><li>Vilket friktionstal motsvarar det mellan däck och väg?</li>
<li>Vad säger värdet om väglaget?</li></ol>`,
`<p>a) v = 25 m/s → a = v²/2s = 625/96 = <strong>6,5 m/s²</strong></p>
<p>b) μ = a/g = 6,51/9,82 = <strong>0,66</strong></p>
<p>c) Det är ett typiskt värde för torr asfalt. På våt väg ligger det kring 0,4 och på is under 0,2.</p>`),

u('4.47',4,'friktion','A','(0/2/1)',
`<p>En bil står parkerad i en backe som lutar 8,0°.</p>
<ol><li>Vilket minsta friktionstal krävs för att bilen inte ska glida?</li>
<li>Spelar bilens massa någon roll?</li>
<li>På vinterväg är friktionstalet 0,10. Vid vilken lutning börjar bilen glida då?</li></ol>`,
`<p>a) μ ≥ tan 8,0° = <strong>0,14</strong></p>
<p>b) Nej. Villkoret tan θ = μ innehåller ingen massa.</p>
<p>c) tan θ = 0,10 → θ = <strong>5,7°</strong>, alltså en ganska flack backe.</p>`),

u('4.48',4,'moment','E','(2/0/0)',
`<p>En sten på 25 kg ska brytas loss med en spett. Stenen ligger 0,30 m från stödpunkten och man trycker 1,2 m från stödpunkten på andra sidan.</p>
<p>Hur stor kraft krävs?</p>`,

u('4.49',4,'moment','C','(1/2/0)',
`<p>En brygga är 4,0 m lång och vilar på två stöd, ett i vardera änden. En person på 60 kg står 1,0 m från det vänstra stödet. Bryggans egen massa kan försummas.</p>
<ol><li>Hur stor kraft tar det högra stödet upp?</li><li>Hur stor kraft tar det vänstra upp?</li>
<li>Vad händer med de två krafterna när personen går ut mot mitten?</li></ol>`,
`<p>a) Moment kring vänster stöd: F·4,0 = 60·9,82·1,0 → <strong>147 N</strong></p>
<p>b) Kraftjämvikt: 589 − 147 = <strong>442 N</strong></p>
<p>c) De närmar sig varandra och blir lika stora, 295 N vardera, när personen står mitt på.</p>`),

u('4.50',4,'moment','C','(0/2/0)',
`<p>Man drar med kraften 200 N i änden av en 0,35 m lång nyckel. Kraften bildar vinkeln 55° mot nyckeln istället för att vara vinkelrät.</p>
<ol><li>Hur stort moment ger det?</li><li>Hur stort hade momentet blivit vid vinkelrätt drag?</li>
<li>Hur ska man hålla för att få ut mest moment?</li></ol>`,

<p>b) M = 200·0,35 = <strong>70 Nm</strong></p>
<p>c) Vinkelrätt mot nyckeln och så långt ut på handtaget som möjligt.</p>`),

u('4.51',4,'moment','A','(0/1/2)',
`<p>En byggkran har en motvikt på 3500 kg som sitter 5,0 m från tornet. Lasten hänger i en arm som kan skjutas ut mellan 8,0 m och 20 m.</p>
<ol><li>Hur tung last klarar kranen längst ut?</li><li>Hur tung last klarar den vid 8,0 m?</li>
<li>Rita hur den största tillåtna lasten beror på avståndet, och beskriv kurvans form.</li></ol>`,

<p>b) m = 3500·5,0/8,0 = <strong>2190 kg</strong></p>
<p>c) m = 17 500/r, alltså en hyperbel. Lasten avtar snabbt i början och sedan allt långsammare.</p>`),

u('5.23',5,'arbete','E','(2/0/0)',
`<p>Tolv lådor på 15 kg vardera lyfts upp på en hylla 1,4 m över golvet.</p>
<p>Hur stort arbete uträttas totalt?</p>`,

u('5.24',5,'arbete','C','(0/2/0)',
`<p>En låda på 20 kg dras 12 m uppför ett plan som lutar 10°. Friktionstalet är 0,30.</p>
<ol><li>Hur stort arbete går åt för att övervinna friktionen?</li>
<li>Hur mycket ökar lådans lägesenergi?</li><li>Hur stort blir det totala arbetet?</li></ol>`,

<p>b) Höjdökning 12·sin 10° = 2,08 m → E = <strong>0,41 kJ</strong></p>
<p>c) 0,70 + 0,41 = <strong>1,1 kJ</strong></p>`),

u('5.25',5,'arbete','C','(1/2/0)',
`<p>En smörgås innehåller 1200 kJ. En person på 65 kg går i trappor där varje steg är 0,18 m högt.</p>
<ol><li>Hur mycket lägesenergi krävs per trappsteg?</li>
<li>Hur många trappsteg motsvarar smörgåsen, om all energi kunde användas?</li>
<li>Kroppens verkningsgrad är ungefär 20 %. Hur många steg blir det i verkligheten?</li></ol>`,
`<p>a) E = mgh = 65·9,82·0,18 = <strong>115 J</strong></p>
<p>b) 1 200 000/115 = <strong>ca 10 000 steg</strong></p>
<p>c) 0,20·10 400 = <strong>ca 2100 steg</strong> — ändå ungefär 100 våningar.</p>`),

u('5.26',5,'arbete','A','(0/1/2)',
`<p>En katapult har en fjäder med fjäderkonstanten 800 N/m som spänns 0,25 m. Projektilen väger 150 g. Energin i en spänd fjäder är ½kx².</p>
<ol><li>Hur mycket energi lagras?</li><li>Vilken fart får projektilen?</li>

u('5.32',5,'rorelsemangd','C','(1/2/0)',

u('8.34',8,'laddning','C','(0/2/0)',
`<p>Ett elektroskop består av en metallkula med två lätta blad under. När en negativt laddad stav förs nära kulan, utan att röra den, spretar bladen isär.</p>
<ol><li>Varför spretar bladen?</li><li>Vilken laddning har bladen då?</li>
<li>Vad händer om staven förs bort igen?</li></ol>`,
`<p>a) Elektronerna i metallen stöts bort från staven och samlas i bladen. Två lika laddade blad stöter bort varandra.</p>
<p>b) De är <strong>negativt</strong> laddade, medan kulan blir positiv.</p>
<p>c) Elektronerna sprider ut sig igen och bladen faller ihop. Elektroskopet var aldrig laddat som helhet.</p>`),

u('8.35',8,'laddning','A','(0/1/2)',
`<p>En liten vattendroppe med laddningen 8,0·10⁻¹⁶ C svävar stilla i ett elektriskt fält med fältstyrkan 1,2·10⁵ V/m.</p>
<ol><li>Hur stor elektrisk kraft verkar på droppen?</li><li>Vilken massa har droppen?</li>
<li>Vad händer om fältet slås av?</li></ol>`,
`<p>a) F = qE = 8,0·10⁻¹⁶·1,2·10⁵ = <strong>9,6·10⁻¹¹ N</strong></p>
<p>b) Kraften balanserar tyngden: m = F/g = <strong>9,8·10⁻¹² kg</strong>, alltså 9,8 nanogram</p>
<p>c) Droppen faller. Metoden användes av Millikan för att bestämma elektronens laddning.</p>`),

u('8.36',8,'kretsar','E','(2/0/0)',
`<p>Över en resistor ligger spänningen 6,0 V och genom den går strömmen 0,25 A.</p>
<ol><li>Vilken resistans har den?</li><li>Vilken effekt utvecklas i den?</li></ol>`,
`<p>a) R = U/I = 6,0/0,25 = <strong>24 Ω</strong></p><p>b) P = UI = <strong>1,5 W</strong></p>`),

u('8.37',8,'kretsar','C','(1/2/0)',
`<p>Ett batteri är märkt 2,0 Ah och 9,0 V.</p>
<ol><li>Hur stor laddning kan batteriet leverera?</li><li>Hur mycket energi motsvarar det?</li>
<li>Hur länge kan det driva en apparat som drar 150 mA?</li></ol>`,
`<p>a) Q = 2,0·3600 = <strong>7200 C</strong></p><p>b) E = QU = <strong>65 kJ</strong></p>
<p>c) t = 2,0/0,150 = <strong>13 timmar</strong></p>`),

u('8.38',8,'kretsar','C','(0/2/0)',
`<p>Ett element för 230 V utvecklar effekten 1500 W.</p>
<ol><li>Hur stor ström går genom det?</li><li>Vilken resistans har värmeslingan?</li>
<li>Vad händer med effekten om elementet kopplas till 115 V i stället?</li></ol>`,
`<p>a) I = P/U = 1500/230 = <strong>6,5 A</strong></p><p>b) R = U²/P = <strong>35 Ω</strong></p>
<p>c) P = U²/R, så halverad spänning ger en fjärdedel av effekten: <strong>375 W</strong></p>`),

u('8.39',8,'kretsar','A','(0/1/2)',
`<p>En glödlampas resistans växer när tråden blir varm. Kall mäts den till 30 Ω. När lampan lyser på 230 V går strömmen 0,26 A.</p>
<ol><li>Vilken resistans har lampan när den lyser?</li>
<li>Hur många gånger större är den än den kalla resistansen?</li>
<li>Vad betyder det för strömmen i det ögonblick man tänder lampan?</li></ol>`,
`<p>a) R = U/I = 230/0,26 = <strong>885 Ω</strong></p>
<p>b) 885/30 = <strong>30 gånger</strong></p>
<p>c) I tändögonblicket är tråden kall, så strömmen blir kortvarigt mycket större — 230/30 = 7,7 A. Därför går glödlampor nästan alltid sönder just när man tänder dem.</p>`),

u('8.40',8,'kopplingar','E','(2/1/0)',
`<p>Två resistorer på 47 Ω och 68 Ω seriekopplas till ett batteri på 6,0 V.</p>
<ol><li>Vilken ersättningsresistans får kopplingen?</li><li>Hur stor ström går genom kretsen?</li>
<li>Går det olika stor ström genom de två resistorerna?</li></ol>`,
`<p>a) R = 47 + 68 = <strong>115 Ω</strong></p><p>b) I = 6,0/115 = <strong>52 mA</strong></p>
<p>c) Nej. Vid seriekoppling finns bara en väg för strömmen, så den är lika stor överallt.</p>`),

u('8.41',8,'kopplingar','C','(1/2/0)',
`<p>Två resistorer på 100 Ω och 150 Ω parallellkopplas till 12 V.</p>
<ol><li>Hur stor ström går genom varje resistor?</li><li>Hur stor blir den totala strömmen?</li>
<li>Bestäm ersättningsresistansen på två olika sätt.</li></ol>`,
`<p>a) I₁ = 12/100 = <strong>120 mA</strong>, I₂ = 12/150 = <strong>80 mA</strong></p>
<p>b) 120 + 80 = <strong>200 mA</strong></p>
<p>c) R = U/I_tot = 12/0,200 = 60 Ω, eller R = 100·150/250 = <strong>60 Ω</strong></p>`),

u('8.42',8,'kopplingar','C','(0/2/0)',
`<p>Tre likadana resistorer på 90 Ω kopplas till ett batteri på 9,0 V. Två av dem sitter parallellt, och den kombinationen är seriekopplad med den tredje.</p>
<ol><li>Vilken ersättningsresistans har parallelldelen?</li><li>Vilken är kretsens totala resistans?</li>
<li>Hur stor är spänningen över den enskilda resistorn?</li></ol>`,
`<p>a) Två lika parallellt ger halva: <strong>45 Ω</strong></p>
<p>b) 90 + 45 = <strong>135 Ω</strong></p>
<p>c) I = 9,0/135 = 66,7 mA → U = 0,0667·90 = <strong>6,0 V</strong>, alltså två tredjedelar av batteriets spänning.</p>`),

u('8.43',8,'kopplingar','A','(0/2/1)',
`<p>I en krets sitter två resistorer i serie med ett batteri. En voltmeter över den första visar 4,5 V och en amperemeter visar 30 mA. Batteriets spänning är 12 V.</p>
<ol><li>Bestäm den första resistorns värde.</li><li>Vilken spänning ligger över den andra?</li>
<li>Bestäm den andra resistorns värde.</li></ol>`,
`<p>a) R₁ = U/I = 4,5/0,030 = <strong>150 Ω</strong></p>
<p>b) 12 − 4,5 = <strong>7,5 V</strong></p>
<p>c) R₂ = 7,5/0,030 = <strong>250 Ω</strong></p>`),

u('8.44',8,'ems','E','(2/0/0)',
`<p>En billampa är märkt 12 V och 21 W.</p>
<ol><li>Hur stor ström går genom lampan?</li><li>Vilken resistans har den när den lyser?</li></ol>`,
`<p>a) I = P/U = 21/12 = <strong>1,8 A</strong></p><p>b) R = U/I = 12/1,75 = <strong>6,9 Ω</strong></p>`),

u('8.45',8,'ems','C','(1/2/0)',
`<p>Ett kylskåp drar 120 W när kompressorn går. Den är igång ungefär 30 % av tiden.</p>
<ol><li>Hur mycket energi drar kylskåpet på ett år?</li><li>Vad kostar det vid 2,50 kr/kWh?</li>
<li>Varför går kompressorn oftare på sommaren?</li></ol>`,
`<p>a) 120·0,30·24·365/1000 = <strong>315 kWh</strong></p><p>b) <strong>790 kr per år</strong></p>
<p>c) Värmeläckaget in i skåpet beror på temperaturskillnaden mot rummet. Ett varmare kök ger större läckage och därmed längre gångtid.</p>`),

u('8.46',8,'ems','A','(0/2/1)',
`<p>Ett batteri mäts vid två olika belastningar. Vid strömmen 0,30 A är polspänningen 1,45 V. Vid 0,90 A är den 1,30 V.</p>
<ol><li>Bestäm batteriets inre resistans.</li><li>Bestäm batteriets emk.</li>
<li>Vilken polspänning väntas vid 1,5 A?</li></ol>`,
`<p>a) U = ε − rI. Skillnaden: 0,15 V på 0,60 A → r = <strong>0,25 Ω</strong></p>
<p>b) ε = 1,45 + 0,25·0,30 = <strong>1,53 V</strong></p>
<p>c) U = 1,53 − 0,25·1,5 = <strong>1,15 V</strong></p>`),

u('8.47',8,'falt','E','(2/0/0)',
`<p>Två parallella plattor har spänningen 60 V mellan sig. Avståndet är 2,5 cm.</p>
<p>Hur stark är fältstyrkan mellan plattorna?</p>`,
`<p>E = U/d = 60/0,025 = <strong>2400 V/m</strong></p>`),

/* ── K9 ── */
u('9.19',9,'nuklider','E','(2/0/0)',
`<p>Nukliden strontium-90 har atomnumret 38.</p>
<ol><li>Hur många protoner har kärnan?</li><li>Hur många neutroner?</li>
<li>Hur många elektroner har en neutral atom?</li></ol>`,
`<p>a) <strong>38 protoner</strong></p><p>b) 90 − 38 = <strong>52 neutroner</strong></p><p>c) <strong>38 elektroner</strong></p>`),

u('9.20',9,'nuklider','E','(2/0/0)',
`<p>En nuklid skrivs ²⁰⁷₈₂Pb.</p>
<ol><li>Vad betyder de två talen?</li><li>Hur många neutroner har kärnan?</li>
<li>Vad heter en nuklid med samma atomnummer men 125 neutroner?</li></ol>`,
`<p>a) 207 är masstalet, alltså antalet nukleoner. 82 är atomnumret, alltså antalet protoner.</p>
<p>b) 207 − 82 = <strong>125 neutroner</strong></p>
<p>c) Samma sak: <strong>bly-207</strong>. Grundämnet bestäms av protonantalet.</p>`),

u('9.21',9,'nuklider','C','(1/2/0)',
`<p>Bestäm massdefekten och bindningsenergin per nukleon för helium-4. Atommassan är 4,002603 u. Använd m(¹H) = 1,007825 u och m(n) = 1,008665 u. 1 u motsvarar 931,5 MeV.</p>`,
`<p>Δm = 2·1,007825 + 2·1,008665 − 4,002603 = <strong>0,030 38 u</strong></p>
<p>E = 0,030 38·931,5 = <strong>28,3 MeV</strong></p>
<p>Per nukleon: 28,3/4 = <strong>7,1 MeV</strong></p>`),

u('9.22',9,'nuklider','A','(0/1/2)',
`<p>Lätta stabila kärnor har ungefär lika många protoner som neutroner. Tunga stabila kärnor har fler neutroner än protoner. Bly-208 har till exempel 82 protoner och 126 neutroner.</p>
<ol><li>Hur många fler neutroner än protoner har bly-208?</li>
<li>Vilken kraft håller ihop kärnan, och vilken vill slita isär den?</li>
<li>Förklara varför tunga kärnor behöver neutronöverskott.</li></ol>`,
`<p>a) 126 − 82 = <strong>44 fler</strong></p>
<p>b) Den starka kärnkraften håller ihop. Den elektriska frånstötningen mellan protonerna vill slita isär.</p>
<p>c) Kärnkraften verkar bara mellan närmaste grannar, medan den elektriska kraften verkar genom hela kärnan. I stora kärnor krävs extra neutroner, som bidrar med kärnkraft utan att öka frånstötningen.</p>`),

u('9.23',9,'karnreaktioner','E','(2/0/0)',
`<p>Komplettera reaktionsformlerna.</p>
<ol><li>²¹⁰₈₄Po → ____ + ⁴₂He</li><li>⁶⁰₂₇Co → ⁶⁰₂₈Ni + ____ + ν̄</li></ol>`,
`<p>a) 210 − 4 = 206 och 84 − 2 = 82 → <strong>²⁰⁶₈₂Pb</strong></p>
<p>b) Masstalet är detsamma och atomnumret ökar med 1 → en <strong>elektron, e⁻</strong></p>`),

u('9.24',9,'karnreaktioner','C','(1/2/0)',
`<p>Vid ett sönderfall minskar den samlade massan med 0,0056 u. 1 u motsvarar 931,5 MeV.</p>
<ol><li>Hur mycket energi frigörs, i MeV?</li><li>Hur många joule är det?</li>
<li>Vart tar energin vägen?</li></ol>`,
`<p>a) E = 0,0056·931,5 = <strong>5,2 MeV</strong></p>
<p>b) 5,22·10⁶·1,602·10⁻¹⁹ = <strong>8,4·10⁻¹³ J</strong></p>
<p>c) Den blir rörelseenergi hos de partiklar som skickas ut och hos dotterkärnan.</p>`),

u('9.25',9,'karnreaktioner','C','(0/2/0)',
`<p>När en U-235-kärna träffas av en neutron kan den klyvas. En möjlig reaktion är: ²³⁵₉₂U + n → ¹⁴⁰₅₄Xe + ____ + 2n</p>
<ol><li>Bestäm den okända kärnans masstal.</li><li>Bestäm dess atomnummer.</li>
<li>Varför är de extra neutronerna avgörande för ett kärnkraftverk?</li></ol>`,
`<p>a) 235 + 1 = 140 + A + 2 → A = <strong>94</strong></p>
<p>b) 92 = 54 + Z → Z = <strong>38</strong>, alltså strontium-94</p>
<p>c) De kan klyva nya kärnor. Utan dem stannar reaktionen; med för många skenar den. I reaktorn styrs antalet med styrstavar.</p>`),

u('9.26',9,'karnreaktioner','A','(0/1/2)',
`<p>Torium-232 sönderfaller i flera steg till bly-208.</p>
<ol><li>Hur många α-sönderfall sker totalt?</li><li>Hur många β⁻-sönderfall?</li>
<li>Varför går det inte att avgöra i vilken ordning sönderfallen sker enbart utifrån start och slut?</li></ol>`,
`<p>a) Masstalet ändras bara av α: (232 − 208)/4 = <strong>6 stycken</strong></p>
<p>b) 90 − 2·6 + n = 82 → n = <strong>4 stycken</strong></p>
<p>c) Räkningen bygger bara på summan av alla ändringar. Samma slutresultat kan nås i många olika ordningsföljder — vilken det blir avgörs av vilka mellankärnor som faktiskt är instabila.</p>`),

u('9.27',9,'aktivitet','E','(2/0/0)',
`<p>Kobolt-60 har halveringstiden 5,27 år. Ett preparat har från början aktiviteten 40 kBq.</p>
<ol><li>Vilken aktivitet har det efter 5,27 år?</li><li>Efter 10,5 år?</li><li>Efter 15,8 år?</li></ol>`,
`<p>a) <strong>20 kBq</strong></p><p>b) <strong>10 kBq</strong></p><p>c) 3 halveringstider → <strong>5,0 kBq</strong></p>`),

u('9.28',9,'aktivitet','C','(0/2/0)',
`<p>Aktiviteten hos ett preparat sjunker från 800 Bq till 200 Bq på 14 timmar.</p>
<ol><li>Hur många halveringstider motsvarar det?</li><li>Bestäm halveringstiden.</li>
<li>Vilken aktivitet väntas efter ytterligare 14 timmar?</li></ol>`,
`<p>a) 800 → 400 → 200, alltså <strong>2 halveringstider</strong></p>
<p>b) 14/2 = <strong>7,0 timmar</strong></p><p>c) 200/4 = <strong>50 Bq</strong></p>`),

u('9.29',9,'aktivitet','C','(1/2/0)',
`<p>Ett preparat har aktiviteten 4,0 kBq. Halveringstiden är 6,0 timmar.</p>
<ol><li>Bestäm sönderfallskonstanten i s⁻¹.</li><li>Hur många kärnor finns kvar av ämnet?</li></ol>`,
`<p>a) λ = ln2/(6,0·3600) = <strong>3,2·10⁻⁵ s⁻¹</strong></p>
<p>b) A = λN → N = 4000/3,21·10⁻⁵ = <strong>1,2·10⁸ kärnor</strong></p>`),

u('9.30',9,'aktivitet','A','(0/1/2)',
`<p>Kalium-40 sönderfaller till argon-40 med halveringstiden 1,25 miljarder år. I ett bergprov är en fjärdedel av kaliumet kvar och resten har blivit argon.</p>
<ol><li>Hur många halveringstider har gått?</li><li>Hur gammalt är berget?</li>
<li>Vilket antagande måste man göra om argonet för att metoden ska fungera?</li></ol>`,
`<p>a) 1 → 1/2 → 1/4, alltså <strong>2 halveringstider</strong></p>
<p>b) 2·1,25 = <strong>2,5 miljarder år</strong></p>
<p>c) Att allt argon som bildats har stannat kvar i berget. Argon är en gas, så om berget värmts upp kan gasen ha läckt ut och åldern blir för låg.</p>`)
);


BANK.push(
u('9.31',9,'nuklider','E','(2/0/0)',
`<p>Väte finns i tre former: ¹H, ²H och ³H. Alla har en proton i kärnan.</p>
<ol><li>Vad kallas sådana varianter av ett grundämne?</li><li>Hur många neutroner har var och en?</li>
<li>Varför är de kemiskt nästan likadana?</li></ol>`,
`<p>a) <strong>Isotoper</strong></p><p>b) 0, 1 och 2 neutroner</p>
<p>c) Kemin styrs av elektronerna, och antalet elektroner bestäms av antalet protoner. Neutronerna påverkar bara massan.</p>`),

u('9.32',9,'nuklider','E','(2/0/0)',
`<p>Atommassor anges ofta i enheten u, där 1 u = 1,66054·10⁻²⁷ kg.</p>
<ol><li>Hur många kilogram väger en kol-12-atom, som har massan 12,000 u?</li>
<li>Varför använder man enheten u i stället för kilogram?</li></ol>`,
`<p>a) m = 12·1,66054·10⁻²⁷ = <strong>1,99·10⁻²⁶ kg</strong></p>
<p>b) Talen blir hanterbara. I u ligger alla atommassor mellan 1 och ungefär 240, i stället för runt 10⁻²⁶.</p>`),

u('9.33',9,'nuklider','C','(1/2/0)',
`<p>Ett gram järn innehåller 1,08·10²² atomer. Järnets molmassa är 55,85 g/mol.</p>
<ol><li>Visa hur antalet atomer räknas fram med Avogadros tal 6,022·10²³.</li>
<li>Hur många atomer finns i en spik som väger 3,5 g?</li></ol>`,
`<p>a) 1,0/55,85 mol · 6,022·10²³ = <strong>1,08·10²² atomer</strong></p>
<p>b) 3,5·1,078·10²² = <strong>3,8·10²² atomer</strong></p>`),

u('9.34',9,'nuklider','C','(1/2/0)',
`<p>Järn-56 har atommassan 55,934 936 u och 26 protoner. Använd m(¹H) = 1,007 825 u, m(n) = 1,008 665 u och att 1 u motsvarar 931,5 MeV.</p>
<ol><li>Hur många neutroner har kärnan?</li><li>Bestäm massdefekten.</li>
<li>Bestäm bindningsenergin per nukleon.</li></ol>`,
`<p>a) 56 − 26 = <strong>30 neutroner</strong></p>
<p>b) Δm = 26·1,007825 + 30·1,008665 − 55,934936 = <strong>0,5285 u</strong></p>
<p>c) E = 0,5285·931,5 = 492 MeV → per nukleon <strong>8,8 MeV</strong></p>`),

u('9.35',9,'nuklider','A','(0/1/2)',
`<p>Bindningsenergin per nukleon är låg för mycket lätta kärnor, stiger snabbt, når sitt högsta värde kring järn och sjunker sedan långsamt för tunga kärnor.</p>
<ol><li>Vad innebär det att en kärna har hög bindningsenergi per nukleon?</li>
<li>Varför frigörs energi när lätta kärnor slås ihop?</li>
<li>Varför frigörs energi när tunga kärnor klyvs?</li></ol>`,
`<p>a) Att den är hårt bunden och stabil. Det krävs mycket energi för att plocka isär den.</p>
<p>b) Produkten hamnar högre upp på kurvan, alltså är den stabilare. Skillnaden frigörs som energi — det är fusion.</p>
<p>c) Även då rör man sig mot järn på kurvan, fast från andra hållet. Delarna blir stabilare än ursprungskärnan — det är fission.</p>`),

u('9.36',9,'nuklider','C','(0/2/0)',
`<p>En atom av syre-16 har 8 protoner. Den tappar två elektroner och blir en jon.</p>
<ol><li>Hur många elektroner har jonen?</li><li>Vilken laddning har den?</li>
<li>Har kärnan förändrats? Motivera.</li></ol>`,
`<p>a) 8 − 2 = <strong>6 elektroner</strong></p><p>b) Två positiva laddningar i överskott: <strong>+2e</strong></p>
<p>c) Nej. Kärnan har fortfarande 8 protoner och 8 neutroner. Det är fortfarande syre-16, bara joniserat.</p>`),

u('8.48',8,'falt','E','(2/0/0)',
`<p>En kula med laddningen 3,0 nC placeras i ett elektriskt fält med fältstyrkan 5000 V/m.</p>
<p>Hur stor kraft verkar på kulan?</p>`,
`<p>F = qE = 3,0·10⁻⁹·5000 = <strong>1,5·10⁻⁵ N</strong></p>`),

u('8.49',8,'falt','C','(1/2/0)',
`<p>Ett batteri på 12 V driver ström genom tre lika stora resistorer i serie. Batteriets minuspol är jordad.</p>
<ol><li>Vilken spänning ligger över varje resistor?</li>
<li>Vilka potentialer råder i de två punkterna mellan resistorerna?</li>
<li>Vad är skillnaden mellan potential och spänning?</li></ol>`,
`<p>a) 12/3 = <strong>4,0 V</strong> över varje</p>
<p>b) Räknat från jord: <strong>4,0 V</strong> och <strong>8,0 V</strong></p>
<p>c) Potential är ett värde i en punkt och beror på var nollan lagts. Spänning är skillnaden mellan två potentialer och är alltid densamma oavsett var man jordar.</p>`),

u('8.50',8,'falt','A','(0/1/2)',
`<p>En elektron startar från vila och accelereras genom spänningen 250 V i vakuum. Elektronens massa är 9,109·10⁻³¹ kg.</p>
<ol><li>Hur mycket rörelseenergi får elektronen?</li><li>Vilken fart får den?</li>
<li>Hur stor andel av ljusets hastighet är det?</li></ol>`,
`<p>a) E = qU = 1,602·10⁻¹⁹·250 = <strong>4,0·10⁻¹⁷ J</strong></p>
<p>b) v = √(2E/m) = <strong>9,4·10⁶ m/s</strong></p>
<p>c) 9,38·10⁶/2,998·10⁸ = <strong>3,1 %</strong> av ljushastigheten</p>`)
);

const state={omr:new Set(),nivåer:new Set(['E','C','A']),sök:'',blad:[]};
const nyckel=x=>x.kap+':'+x.omr;

/* ── vänsterpanelen ── */
const kapitel=[...new Set(BANK.map(x=>x.kap))].sort((a,b)=>a-b);
$('#träd').innerHTML=kapitel.map(k=>{
  const omrs=[...new Set(BANK.filter(x=>x.kap===k).map(x=>x.omr))];
  return `<div class="kapgrupp" data-kap="${k}">
    <button class="kaprad" data-fäll="${k}">
      <svg class="pil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <span class="nr">${k}</span><span>${KAPNAMN[k]}</span>
      <span class="antal">${BANK.filter(x=>x.kap===k).length}</span>
    </button>
    <div class="omrlista">${omrs.map(o=>`
      <button class="omrad" data-omr="${k}:${o}" aria-pressed="false">
        <span>${OMR[k][o]}</span>
        <span class="antal">${BANK.filter(x=>x.kap===k&&x.omr===o).length}</span>
      </button>`).join('')}</div>
  </div>`;
}).join('');
$('#banktal').textContent='Fysik 1 · '+BANK.length+' uppgifter';

$$('.kaprad').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('stängd')));
$$('.omrad').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.omr;
  if(state.omr.has(v)) state.omr.delete(v); else state.omr.add(v);
  b.setAttribute('aria-pressed',state.omr.has(v));
  rita();
}));
$$('.nivåfilter button').forEach(b=>b.addEventListener('click',()=>{
  const n=b.dataset.niva;
  if(state.nivåer.has(n)&&state.nivåer.size>1) state.nivåer.delete(n); else state.nivåer.add(n);
  b.setAttribute('aria-pressed',state.nivåer.has(n));
  rita();
}));
$('#sökfält').addEventListener('input',e=>{state.sök=e.target.value.toLowerCase().trim();rita();});

/* ── urvalet ── */
function urval(){
  return BANK.filter(x=>{
    if(!state.nivåer.has(x.niva)) return false;
    if(state.omr.size && !state.omr.has(nyckel(x))) return false;
    if(state.sök){
      const t=(x.t+' '+x.id+' '+OMR[x.kap][x.omr]).replace(/<[^>]+>/g,' ').toLowerCase();
      if(!t.includes(state.sök)) return false;
    }
    return true;
  }).sort((a,b)=>a.id.localeCompare(b.id,'sv',{numeric:true}));
}

/* ── mittenlistan ── */
function rita(){
  const u=urval(), vald=new Set(state.blad.map(x=>x.id));
  $('#träffar').innerHTML=state.omr.size===0&&!state.sök
    ? `<b>${u.length}</b> uppgifter · välj område till vänster för att smalna av`
    : `<b>${u.length}</b> ${u.length===1?'uppgift':'uppgifter'}`;
  $('#läggAlla').disabled=u.length===0;

  if(!u.length){
    $('#lista').innerHTML=`<div class="tomt"><h3>Inga uppgifter matchar</h3>
      <p>Prova ett annat område, en annan nivå eller en kortare sökning.</p></div>`;
    return;
  }
  $('#lista').innerHTML=u.map(x=>`
    <article class="kort${vald.has(x.id)?' vald':''}" data-id="${x.id}" tabindex="0" role="button"
      aria-pressed="${vald.has(x.id)}">
      <div class="bock">${svgBock}</div>
      <div>
        <div class="kortmeta">
          <span class="id">${x.id}</span>
          <span class="nivå ${x.niva}">${x.niva}</span>
          <span class="område">${OMR[x.kap][x.omr]}</span>
          <span class="poäng">${x.poang}</span>
        </div>
        <div class="kroppen">${x.t}</div>
        <button class="facitknapp" data-facit="${x.id}">Visa facit</button>
        <div class="facit" data-fbox="${x.id}">${x.s}</div>
      </div>
    </article>`).join('');

  $$('.kort').forEach(k=>{
    const växla=()=>vippa(k.dataset.id);
    k.addEventListener('click',e=>{ if(e.target.closest('.facitknapp'))return; växla(); });
    k.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();växla();} });
  });
  $$('.facitknapp').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const box=document.querySelector(`[data-fbox="${b.dataset.facit}"]`);
    const på=box.classList.toggle('öppen');
    b.textContent=på?'Dölj facit':'Visa facit';
  }));
}

function vippa(id){
  const i=state.blad.findIndex(x=>x.id===id);
  if(i>=0) state.blad.splice(i,1); else state.blad.push(BANK.find(x=>x.id===id));
  const k=document.querySelector(`.kort[data-id="${id}"]`);
  if(k){ k.classList.toggle('vald',i<0); k.setAttribute('aria-pressed',i<0); }
  ritaBlad();
}

/* ── övningsbladet ── */
function ritaBlad(){
  const b=state.blad;
  const p={E:0,C:0,A:0};
  b.forEach(x=>{const m=x.poang.match(/(\d+)\/(\d+)\/(\d+)/);p.E+=+m[1];p.C+=+m[2];p.A+=+m[3];});
  const tot=p.E+p.C+p.A;
  $('#summa').innerHTML=tot+'<small>p</small>';
  $('#bAntal').textContent=b.length?b.length+(b.length===1?' uppgift':' uppgifter'):'inga uppgifter';
  ['E','C','A'].forEach(n=>{
    $('#st'+n).style.width=(tot?p[n]/tot*100:0)+'%';
    $('#p'+n).textContent=p[n];
  });
  $('#gränser').innerHTML=tot
    ? `Förslag på gränser<br>E <b>${Math.round(tot*.28)} p</b> · C <b>${Math.round(tot*.55)} p</b> · A <b>${Math.round(tot*.78)} p</b>`
    : 'Kryssa i uppgifter så räknas poängen ihop här.';

  $('#blad').innerHTML=b.length ? b.map((x,i)=>`
    <div class="brad">
      <span class="num">${i+1}</span>
      <span class="txt"><b>${x.id} · ${x.niva} · ${x.poang}</b>
        <span>${x.t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,90)}…</span></span>
      <span class="bverktyg">
        <button data-upp="${i}" title="Flytta upp" ${i===0?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button data-ner="${i}" title="Flytta ned" ${i===b.length-1?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="bort" data-bort="${x.id}" title="Ta bort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </span>
    </div>`).join('')
    : `<div class="tomt" style="padding:44px 16px"><h3>Bladet är tomt</h3>
       <p>Klicka på uppgifterna i mitten för att lägga till dem här.</p></div>`;

  $$('[data-upp]').forEach(k=>k.addEventListener('click',()=>{const i=+k.dataset.upp;
    [state.blad[i-1],state.blad[i]]=[state.blad[i],state.blad[i-1]];ritaBlad();}));
  $$('[data-ner]').forEach(k=>k.addEventListener('click',()=>{const i=+k.dataset.ner;
    [state.blad[i+1],state.blad[i]]=[state.blad[i],state.blad[i+1]];ritaBlad();}));
  $$('[data-bort]').forEach(k=>k.addEventListener('click',()=>vippa(k.dataset.bort)));
  $('#expPdf').disabled=$('#expWord').disabled=!b.length;
}

/* ── knappar ── */
$('#läggAlla').addEventListener('click',()=>{
  const har=new Set(state.blad.map(x=>x.id));
  urval().forEach(x=>{if(!har.has(x.id))state.blad.push(x);});
  rita(); ritaBlad();
});
$('#rensaAllt').addEventListener('click',()=>{
  state.blad=[]; state.omr.clear(); state.sök=''; state.nivåer=new Set(['E','C','A']);
  $('#sökfält').value='';
  $$('.omrad').forEach(b=>b.setAttribute('aria-pressed','false'));
  $$('.nivåfilter button').forEach(b=>b.setAttribute('aria-pressed','true'));
  rita(); ritaBlad();
});
$('#slumpa').addEventListener('click',()=>{
  const pool=urval(), fam=new Set(), ut=[];
  [['E',5],['C',4],['A',3]].forEach(([n,antal])=>{
    const p=pool.filter(x=>x.niva===n).sort(()=>Math.random()-.5);
    let c=0;
    for(const x of p){ if(c>=antal)break; if(fam.has(x.familj))continue; fam.add(x.familj); ut.push(x); c++; }
  });
  state.blad=ut; rita(); ritaBlad();
});

/* ── export ── */
function bladHTML({facit}){
  const t=$('#bTitel').value||'Övningsblad', kl=$('#bKlass').value, da=$('#bDatum').value;
  const p={E:0,C:0,A:0};
  state.blad.forEach(x=>{const m=x.poang.match(/(\d+)\/(\d+)\/(\d+)/);p.E+=+m[1];p.C+=+m[2];p.A+=+m[3];});
  const tot=p.E+p.C+p.A;
  const rad=[kl,da].filter(Boolean).join(' · ');
  let h=`<div class="ph"><img src="${LOGO}" alt=""><div><h1>${t}</h1>
    <div class="pm">${rad?rad+' · ':''}Max ${tot} poäng (${p.E}/${p.C}/${p.A}) · ${state.blad.length} uppgifter</div></div></div>`;
  state.blad.forEach((x,i)=>{
    h+=`<div class="pu"><div class="pn">${i+1}.</div><div><span class="pp">${x.poang}</span>${x.t}</div></div>`;
  });
  if(facit){
    h+=`<div class="fk"><h1 style="font-size:14pt;margin-bottom:12pt">Facit</h1>`;
    state.blad.forEach((x,i)=>{ h+=`<div class="fu"><b>${i+1}.</b> ${x.s}</div>`; });
    h+=`</div>`;
  }
  return h;
}
$('#expPdf').addEventListener('click',()=>{
  $('#utskrift').innerHTML=bladHTML({facit:$('#taMedFacit').checked});
  window.print();
});
$('#expWord').addEventListener('click',()=>{
  const kropp=bladHTML({facit:$('#taMedFacit').checked});
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${$('#bTitel').value}</title>
    <style>
      @page{size:A4;margin:2cm}
      body{font-family:Verdana,Arial,sans-serif;font-size:11pt;line-height:1.6;color:#000}
      .ph{border-bottom:2px solid #000;padding-bottom:8pt;margin-bottom:18pt}
      .ph img{height:38px}
      h1{font-size:16pt;margin:6pt 0 0}
      .pm{font-size:9.5pt;color:#444}
      .pu{margin-bottom:14pt}
      .pn{font-weight:bold;float:left;width:26pt}
      .pp{float:right;font-size:9.5pt;color:#444}
      ol{margin:6pt 0 6pt 26pt}
      li{margin-bottom:3pt}
      table.data{border-collapse:collapse;font-size:10pt;margin:6pt 0}
      table.data th,table.data td{border:1px solid #999;padding:3pt 9pt;text-align:right}
      table.data th{background:#eee}
      .fk{page-break-before:always;border-top:2px solid #000;padding-top:12pt}
      .fu{margin-bottom:9pt;font-size:10pt}
    </style></head><body>${kropp}</body></html>`;
  const namn=($('#bTitel').value||'Övningsblad').replace(/[^\wåäöÅÄÖ -]/g,'').trim()||'Övningsblad';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+doc],{type:'application/msword'}));
  a.download=namn+'.doc';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
});

/* ── igång ── */
document.querySelectorAll('.kapgrupp').forEach((g,i)=>{ if(i>2) g.classList.add('stängd'); });
$('#bDatum').value=new Date().toLocaleDateString('sv-SE');
rita(); ritaBlad();
</script>
</body>
</html>
