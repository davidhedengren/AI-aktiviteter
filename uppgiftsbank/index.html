<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uppgiftsbank Fysik 1 – provgenerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1EFEA;--card:#FFF;--ink:#15181C;--soft:#5A6470;--edge:#D6D2CA;
 --blue:#1F4E79;--pen:#A8271C;--eE:#2E6B4F;--eC:#1F4E79;--eA:#7A3E8C;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
 font-size:17.5px;line-height:1.7;padding:22px 16px 70px;text-align:left}
.wrap{max-width:860px;margin:0 auto}
header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 5px}
h1{font-family:'Archivo',sans-serif;font-weight:700;font-size:27px;margin:0;letter-spacing:-.015em}
.panel{background:var(--card);border:1px solid var(--edge);padding:16px 18px;margin-bottom:18px}
.panel h2{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 10px;font-weight:600}
.kap{border-top:1px solid var(--edge);padding:10px 0 4px}
.kap:first-of-type{border-top:none}
.kaphd{display:flex;align-items:center;gap:9px;font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.kaphd input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.kaphd .antal{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--soft);font-weight:400}
.omr{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 4px 26px}
.omr label{font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:500;border:1.5px solid var(--edge);
 padding:5px 10px;cursor:pointer;user-select:none;background:#fff;color:var(--soft)}
.omr label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.omr input{display:none}
.omr label:focus-within{outline:2.5px solid var(--pen);outline-offset:2px}
.nivaer{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.niva{display:flex;flex-direction:column;gap:5px}
.niva label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.niva.E label{color:var(--eE)} .niva.C label{color:var(--eC)} .niva.A label{color:var(--eA)}
.niva input{width:74px;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:8px 10px;border:1.5px solid var(--edge);background:#fff;color:var(--ink)}
button{font-family:'Archivo',sans-serif;font-weight:600;font-size:14px;background:var(--blue);color:#fff;border:none;padding:11px 18px;cursor:pointer}
button.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
button.mini{padding:5px 10px;font-size:12px}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.varn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--pen);margin-top:10px}
.provhuvud{background:var(--card);border:1px solid var(--edge);border-top:3px solid var(--ink);padding:18px 20px;margin-bottom:14px}
.provhuvud h2{font-family:'Archivo',sans-serif;font-size:20px;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.provhuvud p{margin:4px 0 0;font-size:14.5px;color:var(--soft)}
.granser{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:10px;line-height:1.8}
.uppg{background:var(--card);border:1px solid var(--edge);padding:16px 18px;margin-bottom:11px;
 display:grid;grid-template-columns:34px 1fr;gap:12px;break-inside:avoid}
.nr{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--soft)}
.meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
 color:var(--soft);margin:0 0 8px;display:flex;gap:12px;flex-wrap:wrap}
.badge{font-weight:600}
.badge.E{color:var(--eE)} .badge.C{color:var(--eC)} .badge.A{color:var(--eA)}
.poang{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--soft);float:right;margin-left:12px}
.uppg p{margin:0 0 12px;max-width:62ch}
.uppg ol{margin:12px 0 12px;padding-left:0;list-style:none;counter-reset:del}
.uppg li{margin-bottom:9px;padding-left:32px;position:relative;max-width:60ch}
.uppg li::before{counter-increment:del;content:counter(del,lower-alpha) ")";
 position:absolute;left:0;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--blue)}
.uppg{padding:18px 20px}
table.data{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13.5px;margin:10px 0}
table.data th,table.data td{border:1px solid #C9D2DA;padding:6px 14px;text-align:right}
table.data th{background:#E8ECF0;font-weight:600}
#facit{display:none;margin-top:26px}
#facit.open{display:block}
#facit h2{font-family:'Archivo',sans-serif;font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:0 0 14px}
.los{background:var(--card);border:1px solid var(--edge);border-left:3px solid var(--pen);padding:12px 16px;margin-bottom:9px;break-inside:avoid}
.los .lnr{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--pen);font-size:14px}
.los p{margin:7px 0;font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.85;max-width:70ch}
.los strong{color:var(--pen)}
.tom{color:var(--soft);font-style:italic}
body.lattlast{font-size:20px;line-height:2.0;letter-spacing:.015em;--paper:#FBF7EF}
body.lattlast .uppg p,body.lattlast .uppg li{max-width:50ch}
body.lattlast .uppg li{margin-bottom:14px}
body.lattlast .uppg{padding:22px 24px}
@media print{body{background:#fff;padding:0;font-size:11.5pt}
 header,.panel,.actions{display:none}
 .uppg,.provhuvud,.los{border-color:#999;background:#fff}
 #facit{display:block;page-break-before:always}}
</style>
</head>
<body><div class="wrap">
<header><p class="eyebrow">Fysik 1 · fast uppgiftsbank</p><h1>Provgenerator</h1></header>
<div class="panel">
  <h2>Kapitel och område</h2>
  <div id="valj"></div>
  <div class="actions" style="margin:10px 0 16px">
    <button class="ghost mini" id="allaPa">Markera alla</button>
    <button class="ghost mini" id="allaAv">Avmarkera alla</button>
  </div>
  <h2>Antal uppgifter per nivå</h2>
  <div class="nivaer">
    <div class="niva E"><label for="nE">E-nivå</label><input type="number" id="nE" value="5" min="0" max="30"></div>
    <div class="niva C"><label for="nC">C-nivå</label><input type="number" id="nC" value="4" min="0" max="30"></div>
    <div class="niva A"><label for="nA">A-nivå</label><input type="number" id="nA" value="3" min="0" max="30"></div>
  </div>
  <div class="actions">
    <button id="gen">Generera prov</button>
    <button class="ghost" id="facitBtn">Visa facit</button>
    <button class="ghost" id="printBtn">Skriv ut</button>
    <button class="ghost" id="lasBtn">Extra läsvänligt</button>
  </div>
  <div class="varn" id="varn"></div>
</div>
<div id="prov"></div>
<div id="facit"></div>
</div>
<script>
/* Områdesnamn per kapitel */
const OMR={
 2:{enheter:'Måttenheter och prefix',densitet:'Densitet',matnogg:'Mätnoggrannhet'},
 3:{hastighet:'Hastighet och medelhastighet',diagram:'Rörelsediagram',konstacc:'Konstant acceleration'},
 4:{newton:'Kraftresultant och Newtons lagar',gravitation:'Tyngdkraft och normalkraft',
    fjadrar:'Fjädrar och Hookes lag',friktion:'Friktion och lutande plan',moment:'Kraftmoment och tyngdpunkt'},
 5:{arbete:'Arbete och energi',effekt:'Effekt och verkningsgrad',rorelsemangd:'Rörelsemängd och kollisioner'},
 6:{tryck:'Tryck och kraft',vatsketryck:'Vätsketryck och lufttryck',arkimedes:'Arkimedes princip',gaslagen:'Allmänna gaslagen'},
 7:{varme:'Värmeöverföring och temperatur',fasandring:'Fasändringar'},
 8:{laddning:'Laddning och Coulombs lag',kretsar:'Ström, spänning och Ohms lag',
    kopplingar:'Elektriska kopplingar',ems:'Polspänning och effekt',falt:'Elektriska fält och potential'},
 9:{nuklider:'Isotoper och nuklider',karnreaktioner:'Kärnreaktioner',
    aktivitet:'Aktivitet och halveringstid',stralning:'Strålning och stråldoser'}};
const KAPNAMN={2:'Fysikens grunder',3:'Rörelse',4:'Kraft',5:'Energi och rörelsemängd',
 6:'Tryck',7:'Värme och temperatur',8:'Elektricitet',9:'Partikel- och kärnfysik'};

/* u(id, kapitel, område, nivå, poäng, uppgiftstext, facit)
   Familjen härleds ur id: '2.1b' hör till familjen '2.1'.
   Två uppgifter ur samma familj hamnar aldrig i samma prov. */
const u=(id,kap,omr,niva,poang,t,s)=>({id,kap,omr,niva,poang,t,s,familj:id.replace(/[a-z]$/,'')});

const BANK=[

/* ─────────── KAPITEL 2 ─────────── */
u('2.1',2,'enheter','E','(2/0/0)',
`<p>En mobilskärm har upplösningen 2778 × 1284 pixlar och en diagonal på 6,1 tum (1 tum = 25,4 mm).</p>
<ol><li>Hur många pixlar per millimeter har skärmen?</li><li>Hur stor är en enskild pixel?</li></ol>`,
`<p>Diagonalen i pixlar: √(2778² + 1284²) = 3060 px. Diagonalen: 6,1·25,4 = 155 mm</p>
<p>a) 3060/155 = <strong>19,8 px/mm</strong></p>
<p>b) 1/19,8 mm = <strong>51 µm</strong> — strax under vad ögat upplöser på läsavstånd</p>`),

u('2.2',2,'densitet','C','(1/2/0)',
`<p>Guld kan hamras ut extremt tunt. Ett gram guld slås ut till en sammanhängande folie med arean 0,50 m². Guldets densitet är 19,3 g/cm³.</p>
<ol><li>Hur tjock är folien? Svara i nanometer.</li>
<li>En guldatom har diametern ungefär 0,29 nm. Hur många atomlager tjock är folien?</li></ol>`,
`<p>V = m/ρ = 1,0/19,3 = 0,0518 cm³. Arean 0,50 m² = 5000 cm²</p>
<p>a) t = V/A = 1,04·10⁻⁵ cm = <strong>104 nm</strong></p>
<p>b) 104/0,29 ≈ <strong>360 atomlager</strong></p>`),

u('2.3',2,'matnogg','C','(1/2/0)',
`<p>En skogsägare mäter en granstam. Omkretsen är 1,45 ± 0,02 m och längden 12,0 ± 0,3 m. Stammen antas vara en cylinder.</p>
<ol><li>Beräkna stammens volym.</li><li>Ange ett intervall för volymen utifrån mätosäkerheterna.</li></ol>`,
`<p>a) r = C/2π = 0,2308 m. V = πr²h = <strong>2,01 m³</strong></p>
<p>b) Störst: r ur 1,47 m och h = 12,3 → 2,12 m³. Minst: r ur 1,43 m och h = 11,7 → 1,90 m³</p>
<p><strong>1,90 m³ ≤ V ≤ 2,12 m³</strong></p>`),

u('2.4',2,'matnogg','A','(0/1/2)',
`<p>En cylindrisk tank har radien r och höjden h, båda uppmätta med osäkerhet.</p>
<ol><li>Visa att osäkerheten i procent i volymen ungefär blir 2·(Δr/r) + Δh/h.</li>
<li>Förklara varför radien är dubbelt så viktig att mäta noga som höjden.</li>
<li>Den relativa osäkerheten i omkretsen är 1,4 % och i längden 2,5 %. Hur stor blir osäkerheten i volymen?</li></ol>`,
`<p>a) V = πr²h. Maxvärdet π(r+Δr)²(h+Δh) ≈ πr²h(1 + 2Δr/r + Δh/h) när kvadrattermerna försummas</p>
<p>b) Radien förekommer i kvadrat, så ett fel i r slår igenom dubbelt</p>
<p>c) 2·1,4 % + 2,5 % = <strong>5,3 %</strong></p>`),

u('2.5',2,'enheter','E','(2/1/0)',
`<p>I en modell av solsystemet görs solen lika stor som en fotboll, 22 cm i diameter. Solens verkliga diameter är 1,392·10⁹ m.</p>
<ol><li>Bestäm modellens skala.</li><li>Hur långt från fotbollen ska jorden placeras? Avståndet är 1,496·10¹¹ m.</li>
<li>Hur stor blir jorden i modellen? Jordens diameter är 1,276·10⁷ m.</li></ol>`,
`<p>a) Skala = 0,22/1,392·10⁹ = <strong>1,58·10⁻¹⁰</strong></p>
<p>b) 1,496·10¹¹ · 1,58·10⁻¹⁰ = <strong>23,6 m</strong></p>
<p>c) 1,276·10⁷ · 1,58·10⁻¹⁰ = <strong>2,0 mm</strong> — ett knappnålshuvud 24 meter från fotbollen</p>`),

u('2.6',2,'densitet','E','(2/0/0)',
`<p>Ett klassrum är 8,0 m långt, 6,0 m brett och 2,7 m högt. Luftens densitet är 1,20 kg/m³.</p>
<ol><li>Vilken massa har luften i rummet?</li><li>Jämför med en elev som väger 60 kg.</li></ol>`,
`<p>a) V = 8,0·6,0·2,7 = 130 m³. m = ρV = <strong>156 kg</strong></p>
<p>b) Luften väger mer än två elever — men vi märker den inte, eftersom vi själva är omgivna av den och lyftkraften balanserar.</p>`),

u('2.7',2,'densitet','C','(1/2/0)',
`<p>Ett majskorn väger 0,15 g och har volymen 0,12 cm³. När det poppas växer volymen till 2,4 cm³, men massan ändras knappt.</p>
<ol><li>Bestäm densiteten före och efter poppningen.</li>
<li>Hur stor andel av det poppade popcornet är luft?</li>
<li>Skulle popcornet flyta i vatten? Motivera.</li></ol>`,
`<p>a) Före: 0,15/0,12 = <strong>1,25 g/cm³</strong>. Efter: 0,15/2,4 = <strong>0,063 g/cm³</strong></p>
<p>b) Andelen fast materia är 0,063/1,25 = 5 %, alltså är <strong>95 % luft</strong></p>
<p>c) Ja — densiteten är långt under vattnets 1,0 g/cm³. Före poppningen sjunker kornet.</p>`),

u('2.8',2,'densitet','A','(0/1/2)',
`<p>Järn har densiteten 7870 kg/m³ och molmassan 55,85 g/mol. Ett mol innehåller 6,022·10²³ atomer.</p>
<ol><li>Hur stor volym upptar en enskild järnatom?</li>
<li>Uppskatta atomens diameter genom att anta att atomerna är packade som små kuber.</li>
<li>Varför är svaret bara en uppskattning?</li></ol>`,
`<p>a) V = M/(ρ·N_A) = 55,85·10⁻³/(7870 · 6,022·10²³) = <strong>1,18·10⁻²⁹ m³</strong></p>
<p>b) Kubsidan = ∛V = <strong>2,3·10⁻¹⁰ m = 0,23 nm</strong></p>
<p>c) Atomer är inte kuber, och i verkliga kristaller finns mellanrum mellan dem. Storleksordningen blir ändå rätt.</p>`),

/* ─────────── KAPITEL 3 ─────────── */
u('3.1',3,'hastighet','E','(2/0/0)',
`<p>Du står 85 m från en lodrät klippvägg och klappar i händerna. Ekot hörs 0,50 s senare.</p>
<p>Bestäm ljudets hastighet i luften.</p>`,
`<p>Ljudet färdas fram och tillbaka: s = 2·85 = 170 m</p><p>v = 170/0,50 = <strong>340 m/s</strong></p>`),

u('3.2',3,'hastighet','E','(2/1/0)',
`<p>En rulltrappa är 18 m lång och rör sig med 0,50 m/s. Du kan gå med farten 0,75 m/s i förhållande till trappstegen.</p>
<ol><li>Hur lång tid tar det att åka stående?</li><li>Hur lång tid tar det om du går uppför samtidigt?</li>
<li>En kompis går nedför samma uppåtgående rulltrappa med samma egenfart. Vad händer?</li></ol>`,
`<p>a) 18/0,50 = <strong>36 s</strong></p>
<p>b) v = 0,50 + 0,75 = 1,25 m/s → <strong>14,4 s</strong></p>
<p>c) v = 0,50 − 0,75 = −0,25 m/s. Kompisen kommer ned, men det tar 72 s.</p>`),

u('3.3',3,'hastighet','C','(1/2/0)',
`<p>Två tåg befinner sig 60 km från varandra på samma spår och kör mot varandra med 90 km/h vardera. I samma ögonblick startar en fluga från det ena tågets front och flyger med 120 km/h fram och tillbaka mellan tågen tills de möts.</p>
<p>Hur lång sträcka har flugan flugit totalt?</p>`,
`<p>Fokusera på tiden, inte på de oändligt många vändningarna.</p>
<p>Tågen närmar sig med 180 km/h → t = 60/180 = 0,333 h</p>
<p>Flugan flyger hela tiden: s = 120·0,333 = <strong>40 km</strong></p>`),

u('3.4',3,'konstacc','C','(2/2/0)',
`<p>En bil kör i 80 km/h. Normal reaktionstid är 0,8 s. En förare som tittar på mobilen har i praktiken 2,3 s. Bilens retardation vid inbromsning är 7,0 m/s².</p>
<ol><li>Hur lång blir den totala stoppsträckan i de två fallen?</li>
<li>Ett barn springer ut 60 m framför bilen. Vad händer i de två fallen?</li></ol>`,
`<p>v = 22,2 m/s. Bromssträcka v²/2a = 35,3 m</p>
<p>a) Reaktionssträckor 17,8 m och 51,1 m → totalt <strong>53,1 m</strong> och <strong>86,4 m</strong></p>
<p>b) Den uppmärksamma stannar med 7 m marginal. Den distraherade träffar barnet i ungefär 19 m/s.</p>`),

u('3.5',3,'konstacc','A','(0/2/2)',
`<p>En hiss åker uppåt med den konstanta farten 2,0 m/s. En mutter lossnar från hissens tak, 2,6 m ovanför hissgolvet.</p>
<ol><li>Hur lång tid tar det innan muttern träffar hissgolvet?</li>
<li>Spelar hissens fart någon roll för svaret? Motivera.</li>
<li>Hissen accelererar istället uppåt med 1,2 m/s². Hur lång blir falltiden då?</li></ol>`,
`<p>a) I hissens system är muttern i vila när den lossnar: t = √(2·2,6/9,82) = <strong>0,73 s</strong></p>
<p>b) Nej. Muttern har samma hastighet som hissen i frigörelseögonblicket, så den relativa rörelsen startar från noll.</p>
<p>c) Relativ acceleration 9,82 + 1,2 = 11,02 m/s² → t = <strong>0,69 s</strong></p>`),

u('3.6',3,'konstacc','A','(0/1/2)',
`<p>En boll kastas rakt upp med farten 15 m/s. Exakt 1,0 s senare kastas en andra boll rakt upp med samma fart från samma plats.</p>
<p>På vilken höjd möts bollarna, och när?</p>`,
`<p>Sätt lägena lika: 15t − gt²/2 = 15(t−1) − g(t−1)²/2</p>
<p>Kvadrattermerna tar ut varandra: 0 = −15 + 9,82t − 4,91 → t = <strong>2,03 s</strong></p>
<p>Höjd: 15·2,03 − 4,91·2,03² = <strong>10,2 m</strong></p>`),

u('3.7',3,'hastighet','E','(2/1/0)',
`<p>Vid ett 100-meterslopp mäts löparens splittider: 0–30 m på 4,20 s, 30–60 m på 2,70 s och 60–100 m på 3,80 s.</p>
<ol><li>Bestäm medelhastigheten på varje delsträcka.</li><li>Bestäm medelhastigheten över hela loppet.</li>
<li>På vilken delsträcka är löparen snabbast, och varför är den inte den första?</li></ol>`,
`<p>a) 30/4,20 = <strong>7,14 m/s</strong>; 30/2,70 = <strong>11,1 m/s</strong>; 40/3,80 = <strong>10,5 m/s</strong></p>
<p>b) 100/10,70 = <strong>9,35 m/s</strong></p>
<p>c) Snabbast i mitten. Den första sträckan innehåller accelerationen från vila, den sista en viss utmattning.</p>`),

u('3.8',3,'hastighet','E','(2/0/0)',
`<p>Ljusets hastighet är 2,998·10⁸ m/s och ett år har 3,156·10⁷ sekunder.</p>
<ol><li>Hur många meter är ett ljusår?</li>
<li>Mars befinner sig som närmast 2,5·10¹¹ m från jorden. Hur lång tid tar en radiosignal dit?</li></ol>`,
`<p>a) 2,998·10⁸ · 3,156·10⁷ = <strong>9,46·10¹⁵ m</strong></p>
<p>b) t = 2,5·10¹¹/2,998·10⁸ = 834 s = <strong>13,9 minuter</strong> — därför kan man inte fjärrstyra en marsrover i realtid.</p>`),

u('3.9',3,'hastighet','C','(1/2/0)',
`<p>Två cyklister befinner sig 900 m från varandra på en rak väg och cyklar mot varandra. Den ena håller 6,0 m/s och den andra 4,5 m/s.</p>
<ol><li>När möts de?</li><li>Hur långt har vardera cyklist kommit då?</li>
<li>Var på sträckan sker mötet, och varför inte på mitten?</li></ol>`,
`<p>a) De närmar sig med 10,5 m/s → t = 900/10,5 = <strong>86 s</strong></p>
<p>b) 6,0·86 = <strong>514 m</strong> och 4,5·86 = <strong>386 m</strong></p>
<p>c) Mötet sker närmare den långsammare cyklistens startpunkt, eftersom sträckorna förhåller sig som hastigheterna.</p>`),

u('3.10',3,'konstacc','C','(2/1/0)',
`<p>En bil kör i 70 km/h. På torr asfalt är retardationen vid en fullbromsning 7,0 m/s², på isig väg bara 1,5 m/s².</p>
<ol><li>Beräkna bromssträckan i båda fallen.</li><li>Hur många gånger längre blir den på is?</li>
<li>Hur förhåller sig kvoten till kvoten mellan retardationerna?</li></ol>`,
`<p>v = 19,4 m/s. s = v²/2a</p>
<p>a) Asfalt: <strong>27 m</strong>. Is: <strong>126 m</strong></p>
<p>b) <strong>4,7 gånger</strong></p>
<p>c) Exakt samma kvot som mellan retardationerna (7,0/1,5 = 4,7) — bromssträckan är omvänt proportionell mot retardationen.</p>`),

u('3.11',3,'diagram','A','(0/2/2)',
`<p>En boll släpps från 1,80 m höjd och studsar upp till 1,15 m. Varje studs förlorar samma andel av bollens mekaniska energi.</p>
<ol><li>Hur stor andel av energin är kvar efter varje studs?</li>
<li>Hur högt når bollen efter fem studsar?</li>
<li>Hur lång total sträcka färdas bollen innan den ligger stilla?</li></ol>`,
`<p>a) E ∝ h → kvoten 1,15/1,80 = <strong>0,639</strong>, alltså går 36 % förlorat per studs</p>
<p>b) 1,80·0,639⁵ = <strong>0,19 m</strong></p>
<p>c) Geometrisk serie: s = 1,80 + 2·1,80·0,639/(1−0,639) = <strong>8,2 m</strong></p>`),

u('3.12',3,'diagram','A','(0/2/1)',
`<p>En fallskärmshoppare med massan 80 kg når terminalhastigheten 55 m/s i fritt fall. Luftmotståndet kan skrivas F = k·v².</p>
<ol><li>Bestäm konstanten k.</li><li>Hur stor är accelerationen när farten är 30 m/s?</li>
<li>Skissa hastigheten som funktion av tiden och förklara kurvans form.</li></ol>`,
`<p>a) Vid terminalfart: kv² = mg → k = 785,6/55² = <strong>0,26 kg/m</strong></p>
<p>b) F_luft = 0,26·900 = 234 N. Nettokraft 552 N → a = <strong>6,9 m/s²</strong></p>
<p>c) Kurvan startar med lutningen 9,82 m/s² och planar ut asymptotiskt mot 55 m/s. Accelerationen minskar eftersom luftmotståndet växer med farten.</p>`),

/* ─────────── KAPITEL 4 ─────────── */
u('4.1',4,'newton','E','(2/0/0)',
`<p>En skylt med massan 12 kg hänger i två likadana vajrar som var och en bildar vinkeln 25° mot lodlinjen.</p>
<p>Bestäm spännkraften i vardera vajern.</p>`,
`<p>Lodrät jämvikt: 2S·cos 25° = mg = 117,8 N</p><p>S = 117,8/(2·0,906) = <strong>65,0 N</strong></p>`),

u('4.2',4,'newton','C','(2/1/0)',
`<p>En drönare med massan 900 g har fyra rotorer.</p>
<ol><li>Hur stor lyftkraft ger varje rotor när drönaren svävar stilla?</li>
<li>Hur stor blir den när drönaren stiger med accelerationen 1,5 m/s²?</li>
<li>Hur stor är den när drönaren stiger med konstant fart?</li></ol>`,
`<p>a) Total lyftkraft = mg = 8,84 N → <strong>2,21 N per rotor</strong></p>
<p>b) F = m(g+a) = 10,19 N → <strong>2,55 N per rotor</strong></p>
<p>c) Konstant fart ⇒ ingen resulterande kraft ⇒ <strong>2,21 N</strong>, samma som vid svävning.</p>`),

u('4.3',4,'newton','C','(1/2/0)',
`<p>En bogservajer är märkt med brottgränsen 8,0 kN. Den bogserade bilen väger 1400 kg och bromsas av rullmotstånd på 300 N.</p>
<ol><li>Vilken är den största acceleration vajern klarar?</li>
<li>Med säkerhetsfaktorn 3 får vajern belastas med högst en tredjedel av brottgränsen. Vilken acceleration ger det?</li></ol>`,
`<p>a) a = (8000 − 300)/1400 = <strong>5,5 m/s²</strong></p>
<p>b) Tillåten kraft 2667 N → a = (2667 − 300)/1400 = <strong>1,7 m/s²</strong></p>`),

u('4.4',4,'newton','C','(0/2/1)',
`<p>En klättrare med massan 78 kg hänger i två rep fästa i olika grenar. Det ena repet bildar 25° mot lodlinjen, det andra 40° åt motsatt håll.</p>
<p>Bestäm spännkraften i vardera repet.</p>`,
`<p>Vågrätt: S₁·sin 25° = S₂·sin 40° → S₁ = 1,52·S₂</p>
<p>Lodrätt: S₁·cos 25° + S₂·cos 40° = 766 N</p>
<p>S₂(1,379 + 0,766) = 766 → S₂ = <strong>357 N</strong>, S₁ = <strong>543 N</strong></p>`),

u('4.5',4,'newton','A','(0/2/2)',
`<p>En jacka med massan 2,5 kg hängs mitt på en 6,0 m lång tvättlina. Linan sackar ned 12 cm i mitten.</p>
<ol><li>Bestäm spännkraften i linan.</li>
<li>Man spänner linan hårdare så att nedhänget bara blir 2,0 cm. Hur stor blir spännkraften nu?</li>
<li>Varför går det inte att spänna linan helt rak?</li></ol>`,
`<p>Halva linan är 3,0 m → sin θ ≈ 0,12/3,0 = 0,040</p>
<p>a) 2S·sin θ = mg → S = <strong>307 N</strong>, tolv gånger jackans tyngd</p>
<p>b) sin θ = 0,0067 → S = <strong>1841 N</strong></p>
<p>c) När nedhänget går mot noll går sin θ mot noll och S mot oändligheten. Linan går av först.</p>`),

u('4.6',4,'moment','A','(0/1/2)',
`<p>En stege lutas mot en slät vägg. Friktionstalet mellan stegens fot och golvet är 0,40. Väggen kan antas friktionsfri.</p>
<ol><li>Vid vilken minsta vinkel mot golvet står stegen kvar?</li>
<li>Spelar stegens massa någon roll? Motivera.</li></ol>`,
`<p>Momentjämvikt kring foten med tyngden i mitten ger väggens normalkraft N_v = mg/(2 tan θ). Glidvillkor: N_v ≤ μmg</p>
<p>a) mg/(2 tan θ) ≤ 0,40mg → tan θ ≥ 1,25 → θ ≥ <strong>51,3°</strong></p>
<p>b) Nej — mg finns i båda leden och förkortas bort.</p>`),

u('4.7',4,'moment','C','(2/1/0)',
`<p>En hjulbult ska dras åt med momentet 180 Nm.</p>
<ol><li>Hur stor kraft krävs vinkelrätt mot ett 40 cm långt handtag?</li>
<li>En person orkar dra med högst 250 N. Hur långt handtag behövs?</li>
<li>Varför blir det farligt att trä på ett förlängningsrör på en momentnyckel?</li></ol>`,
`<p>a) F = M/l = 180/0,40 = <strong>450 N</strong></p><p>b) l = 180/250 = <strong>0,72 m</strong></p>
<p>c) Nyckeln mäter momentet vid sitt eget handtag. Med förlängningsrör blir det verkliga momentet på bulten större än det nyckeln visar, och bulten kan gå av.</p>`),

u('4.8',4,'fjadrar','E','(2/0/0)',
`<p>Ett träningsgummiband förlängs 25 cm när det dras med kraften 45 N.</p>
<ol><li>Bestäm bandets fjäderkonstant.</li>
<li>Två likadana band används parallellt. Vilken sammanlagd fjäderkonstant får de?</li></ol>`,
`<p>a) k = F/Δl = 45/0,25 = <strong>180 N/m</strong></p>
<p>b) Banden delar kraften men får samma förlängning → k_tot = <strong>360 N/m</strong></p>`),

u('4.9',4,'gravitation','C','(1/2/0)',
`<p>En astronaut med utrustning väger 90 kg och befinner sig fritt svävande 8,0 m från rymdstationen, utan att kunna nå den. Hon har ett verktyg med massan 3,0 kg.</p>
<ol><li>Hon kastar verktyget rakt bort från stationen med farten 4,0 m/s. Vilken fart får hon själv?</li>
<li>Hur lång tid tar det innan hon är framme?</li>
<li>Varför fungerar detta trots att hon inte har något att ta spjärn mot?</li></ol>`,
`<p>a) Rörelsemängden bevaras: v = 3,0·4,0/90 = <strong>0,13 m/s</strong></p>
<p>b) t = 8,0/0,133 = <strong>60 s</strong></p>
<p>c) Newtons tredje lag. Verktyget trycks bort av henne, och hon av verktyget — inget yttre stöd behövs.</p>`),

u('4.10',4,'moment','C','(1/2/0)',
`<p>En byggkran har en motvikt på 4000 kg placerad 6,0 m från tornet.</p>
<ol><li>Hur tung last kan kranen lyfta om lasten hänger 15 m ut på andra sidan?</li>
<li>Vad händer om lasten flyttas längre ut?</li>
<li>Varför sitter motvikten så nära tornet trots att den är tung?</li></ol>`,
`<p>a) Momentjämvikt: m·15 = 4000·6,0 → m = <strong>1600 kg</strong></p>
<p>b) Momentet från lasten överstiger motviktens och kranen tippar.</p>
<p>c) Det är produkten kraft × avstånd som räknas. En kort arm kräver stor massa, men motvikten måste rymmas inom kranens fundament.</p>`),

u('4.11',4,'moment','C','(2/1/0)',
`<p>En skottkärra lastas med 60 kg. Lastens tyngdpunkt ligger 0,45 m från hjulaxeln, och handtagen 1,4 m från axeln.</p>
<ol><li>Hur stor kraft krävs vid handtagen för att lyfta lasten?</li>
<li>Hur ändras kraften om lasten skjuts längre fram, närmare hjulet?</li></ol>`,
`<p>a) Moment kring hjulaxeln: F·1,4 = 60·9,82·0,45 → F = <strong>189 N</strong></p>
<p>b) Kraften minskar, eftersom lastens hävarm blir kortare. Därför lastar man alltid tungt gods så långt fram som möjligt.</p>`),

u('4.12',4,'moment','E','(2/0/0)',
`<p>En hängande mobil består av en 40 cm lång stång som hänger i en tråd. En figur med massan 30 g hänger 12 cm från upphängningspunkten.</p>
<p>Hur tung måste figuren på andra sidan vara om den hängs 28 cm från upphängningspunkten?</p>`,
`<p>Momentjämvikt: m₁·l₁ = m₂·l₂</p><p>m₂ = 30·12/28 = <strong>12,9 g</strong></p>`),

u('4.13',4,'friktion','A','(0/2/2)',
`<p>En container är 2,4 m bred och 2,6 m hög med tyngdpunkten i mitten. Den står på ett lastbilsflak. Friktionstalet mellan container och flak är 0,60.</p>
<ol><li>Vid vilken lutning på flaket börjar containern glida?</li>
<li>Vid vilken lutning skulle den tippa, om den inte gled?</li>
<li>Vilket sker först, och vad betyder det för hur lasten ska säkras?</li></ol>`,
`<p>a) Glidning vid tan θ = μ → θ = <strong>31,0°</strong></p>
<p>b) Tippning när tyngdpunktens lodlinje passerar kanten: tan θ = 2,4/2,6 → θ = <strong>42,7°</strong></p>
<p>c) <strong>Glidning sker först.</strong> Surrningen ska alltså i första hand hindra containern från att glida i sidled, inte från att välta.</p>`),

u('4.14',4,'moment','A','(0/1/2)',
`<p>En planka som är 4,0 m lång och väger 20 kg läggs ut över en kajkant så att 3,2 m ligger på kajen och 0,8 m sticker ut.</p>
<p>Hur långt ut på den utskjutande delen kan en person på 70 kg gå innan plankan tippar?</p>`,
`<p>Plankans tyngdpunkt ligger i mitten, alltså 1,2 m innanför kanten</p>
<p>Moment kring kajkanten: 70·9,82·x = 20·9,82·1,2</p>
<p>x = 235,7/687,4 = <strong>0,34 m</strong> — mindre än halva den utskjutande delen</p>`),

/* ─────────── KAPITEL 5 ─────────── */
u('5.1',5,'effekt','E','(2/0/0)',
`<p>En person med massan 60 kg springer uppför en trappa med höjden 4,2 m på 12 sekunder.</p>
<p>Vilken effekt utvecklar personen?</p>`,
`<p>E = mgh = 60·9,82·4,2 = 2475 J</p><p>P = E/t = <strong>206 W</strong> — en person som anstränger sig lyser svagare än en gammal glödlampa.</p>`),

u('5.2',5,'arbete','C','(1/2/0)',
`<p>En powerbank är märkt 10 000 mAh vid cellspänningen 3,7 V.</p>
<ol><li>Hur mycket energi lagrar den, i joule?</li>
<li>Hur högt skulle den energin kunna lyfta en person på 70 kg, om hela energin kunde användas?</li></ol>`,
`<p>a) Q = 10·3600 = 36 000 C. E = QU = <strong>133 kJ</strong></p>
<p>b) h = E/(mg) = 133 200/687 = <strong>194 m</strong></p>`),

u('5.3',5,'effekt','C','(1/2/0)',
`<p>Ett hustak har arean 120 m². Under ett regn faller 18 mm nederbörd på två timmar. Vattnet rinner ned genom ett stuprör och faller 6,0 m till marken.</p>
<ol><li>Hur mycket lägesenergi frigörs?</li><li>Vilken medeleffekt motsvarar det?</li>
<li>Skulle det löna sig att sätta en generator i stupröret?</li></ol>`,
`<p>a) m = 0,018·120·1000 = 2160 kg. E = mgh = <strong>127 kJ</strong></p>
<p>b) P = 127 300/7200 = <strong>17,7 W</strong></p>
<p>c) Nej. Det är mindre än en LED-lampa, och verkningsgraden i en så liten turbin vore låg.</p>`),

u('5.4',5,'arbete','C','(0/2/0)',
`<p>En person med massan 55 kg faller från 2,4 m höjd ned på en studsmatta. Mattan sjunker 0,80 m innan personen är i vändläget.</p>
<p>Bestäm den genomsnittliga kraft mattan verkar med, och jämför med personens tyngd.</p>`,
`<p>Total fallhöjd 2,4 + 0,80 = 3,2 m</p>
<p>Energiprincipen: mg·3,2 = F·0,80 → F = <strong>2160 N</strong></p>
<p>Tyngden är 540 N, alltså <strong>fyra gånger</strong> så stor kraft.</p>`),

u('5.5',5,'arbete','A','(1/2/2)',
`<p>En pilbåge spänns till förlängningen 0,55 m, där dragkraften är 300 N. Kraften växer ungefär linjärt med förlängningen.</p>
<ol><li>Rita kraften som funktion av förlängningen och bestäm den lagrade energin ur arean.</li>
<li>Pilen väger 25 g. Vilken fart får den om all energi överförs?</li>
<li>Bågens verkningsgrad är i verkligheten cirka 80 %. Vilken fart blir det då?</li></ol>`,
`<p>a) Triangelns area: E = 300·0,55/2 = <strong>82,5 J</strong></p>
<p>b) v = √(2E/m) = <strong>81 m/s</strong></p>
<p>c) v = √(2·66/0,025) = <strong>73 m/s</strong></p>`),

u('5.6',5,'rorelsemangd','A','(0/2/2)',
`<p>En personbil (1400 kg) och en lastbil (16 000 kg) kör mot varandra, båda i 50 km/h, och kolliderar frontalt. Fordonen fastnar i varandra.</p>
<ol><li>Vilken gemensam hastighet får de?</li><li>Hur mycket ändras vardera fordonets hastighet?</li>
<li>Vilket fordon påverkas av störst kraft? Motivera med Newtons tredje lag.</li></ol>`,
`<p>v = 13,89 m/s</p>
<p>a) (16 000·13,89 − 1400·13,89)/17 400 = <strong>11,7 m/s</strong> i lastbilens riktning</p>
<p>b) Bilen: <strong>Δv = 25,5 m/s</strong>. Lastbilen: <strong>Δv = 2,2 m/s</strong></p>
<p>c) Lika stora krafter på båda. Men a = F/m, och bilen har 11,4 gånger mindre massa — därför tar den skadan.</p>`),

u('5.7',5,'effekt','C','(0/2/1)',
`<p>En hisskorg väger 800 kg och lastas med 400 kg. Hissen är förbunden med en motvikt på 700 kg via en lina över ett hjul.</p>
<ol><li>Vilken kraft måste motorn utveckla för att lyfta hissen med konstant fart?</li>
<li>Hur stor hade kraften varit utan motvikt?</li><li>Vilken effekt krävs i de två fallen vid farten 2,0 m/s?</li></ol>`,
`<p>a) F = (800 + 400 − 700)·9,82 = <strong>4,9 kN</strong></p>
<p>b) F = 1200·9,82 = <strong>11,8 kN</strong></p>
<p>c) P = Fv: <strong>9,8 kW</strong> och <strong>23,6 kW</strong></p>`),

u('5.8',5,'arbete','E','(2/0/0)',
`<p>En gunga dras ut i sidled så att sitsen höjs 0,60 m över sitt lägsta läge och släpps sedan från vila.</p>
<ol><li>Vilken fart har gungan i det lägsta läget?</li><li>Spelar barnets massa någon roll? Motivera.</li></ol>`,
`<p>a) mgh = mv²/2 → v = √(2·9,82·0,60) = <strong>3,4 m/s</strong></p>
<p>b) Nej — massan förkortas bort. Ett tungt och ett lätt barn får samma fart.</p>`),

u('5.9',5,'effekt','C','(1/2/1)',
`<p>Ett vindkraftverk har rotordiametern 90 m. Effekten i vinden ges av P = ½ρAv³, där ρ = 1,29 kg/m³ och A är rotorns svepta area.</p>
<ol><li>Hur stor effekt finns i vinden vid vindhastigheten 8,0 m/s?</li>
<li>Verket omvandlar 45 % av den. Vilken eleffekt ger det?</li>
<li>Vad händer med effekten om vindhastigheten fördubblas? Motivera.</li></ol>`,
`<p>a) A = π·45² = 6362 m². P = ½·1,29·6362·8³ = <strong>2,1 MW</strong></p>
<p>b) 0,45·2,1 = <strong>0,95 MW</strong></p>
<p>c) Effekten är proportionell mot v³, så dubbel vind ger <strong>åtta gånger</strong> effekten. Därför är placeringen så avgörande.</p>`),

u('5.10',5,'arbete','C','(1/2/0)',
`<p>En hiss med last väger totalt 1200 kg. Vid ett linbrott faller den fritt 3,0 m innan nödbromsen griper, och stoppas sedan på ytterligare 1,5 m.</p>
<ol><li>Hur mycket energi ska bromsen ta upp?</li><li>Hur stor är den genomsnittliga bromskraften?</li></ol>`,
`<p>a) E = mg·(3,0 + 1,5) = 1200·9,82·4,5 = <strong>53 kJ</strong></p>
<p>b) F = E/s = 53 028/1,5 = <strong>35 kN</strong>, alltså tre gånger hissens tyngd</p>`),

u('5.11',5,'arbete','E','(2/1/0)',
`<p>En kula i kulstötning väger 7,26 kg och lämnar handen med farten 13,5 m/s.</p>
<ol><li>Vilken rörelseenergi har kulan?</li><li>Hur mycket lägesenergi motsvarar det, om kulan lyfts 2,0 m?</li>
<li>Vilken del av arbetet lägger stötaren mest på?</li></ol>`,
`<p>a) E = mv²/2 = <strong>662 J</strong></p><p>b) E = mgh = <strong>143 J</strong></p>
<p>c) Klart mest på att ge kulan fart — rörelseenergin är nästan fem gånger lägesenergin.</p>`),

u('5.12',5,'effekt','A','(0/2/2)',
`<p>En elbil med massan 1600 kg bromsar från 90 km/h till stillastående. Batteriet rymmer 60 kWh.</p>
<ol><li>Hur mycket rörelseenergi omvandlas?</li><li>Vid regenerativ bromsning återvinns 70 %. Hur många kWh blir det?</li>
<li>Hur stor andel av batteriet motsvarar det, och vad säger det om nyttan med tekniken?</li></ol>`,
`<p>a) E = mv²/2 = 1600·25²/2 = <strong>500 kJ</strong> = 0,139 kWh</p>
<p>b) 0,7·0,139 = <strong>0,097 kWh</strong></p>
<p>c) 0,16 % av batteriet per inbromsning. Nyttan syns först i stadstrafik med hundratals inbromsningar — inte vid en enstaka.</p>`),

u('5.13',5,'rorelsemangd','A','(0/1/2)',
`<p>I en Newtons vagga hänger fem lika stora stålkulor i rad. Man lyfter en ytterkula och släpper den. En kula flyger ut på andra sidan med samma fart.</p>
<ol><li>Visa att både rörelsemängd och rörelseenergi bevaras om precis en kula flyger ut.</li>
<li>Visa att två kulor med halva farten skulle bevara rörelsemängden men inte energin.</li>
<li>Varför flyger det då ut en kula och inte två?</li></ol>`,
`<p>a) En kula in med v ger en kula ut med v: p = mv före och efter, E = mv²/2 före och efter. Båda bevaras.</p>
<p>b) Två kulor med v/2: p = 2m·v/2 = mv ✓, men E = 2·m(v/2)²/2 = mv²/4, alltså <strong>bara hälften</strong> av energin.</p>
<p>c) Stöten mellan härdade stålkulor är nästan fullständigt elastisk, och då måste även energin bevaras. Endast ett kula-ut-alternativ uppfyller båda villkoren.</p>`),

/* ─────────── KAPITEL 6 ─────────── */
u('6.1',6,'vatsketryck','C','(1/1/0)',
`<p>Hur högt kan man som mest suga upp vatten i ett sugrör, även med en perfekt vakuumpump? Förklara varför det finns en gräns.</p>`,
`<p>Lufttrycket måste bära vattenpelaren: p₀ = ρgh → h = 101 325/(998·9,82) = <strong>10,3 m</strong></p>
<p>Man suger inte upp vattnet — lufttrycket trycker upp det. Mer än lufttryck finns inte att tillgå.</p>`),

u('6.2',6,'tryck','E','(2/0/0)',
`<p>En person med massan 55 kg står på en enda stilettklack där ytan mot golvet är 1,0 cm². En elefant på 4000 kg står på fyra fötter där fötterna tillsammans har ytan 800 cm².</p>
<p>Jämför trycken mot underlaget.</p>`,
`<p>Klacken: p = 540/1,0·10⁻⁴ = <strong>5,4 MPa</strong></p>
<p>Elefanten: p = 39 280/0,080 = <strong>491 kPa</strong></p>
<p>Klacken ger <strong>11 gånger</strong> större tryck — därför märks klackar i trägolv men inte elefantspår.</p>`),

u('6.3',6,'vatsketryck','C','(2/1/0)',
`<p>Ett vattentorn har vattenytan 32 m över marknivån.</p>
<ol><li>Hur stort blir övertrycket i en kran vid marken?</li><li>Hur många bar motsvarar det?</li>
<li>Tornets tank är bredare upptill än nertill. Påverkar det trycket i kranen?</li></ol>`,
`<p>a) p = ρgh = 998·9,82·32 = <strong>314 kPa</strong></p><p>b) <strong>3,1 bar</strong></p>
<p>c) Nej. Vätsketrycket beror bara på djupet under den fria ytan, inte på behållarens form.</p>`),

u('6.4',6,'gaslagen','C','(1/2/1)',
`<p>En fridykare fyller lungorna med 6,0 liter luft vid ytan och dyker till 20 m djup.</p>
<ol><li>Hur stort är det totala trycket på 20 m?</li><li>Vilken volym har luften i lungorna där nere?</li>
<li>Varför är det livsfarligt för en apparatdykare att hålla andan under uppstigning?</li></ol>`,
`<p>a) 101,3 + 998·9,82·20/1000 = <strong>297 kPa</strong>, nästan tre gånger yttrycket</p>
<p>b) pV konstant: V = 6,0·101,3/297 = <strong>2,0 liter</strong></p>
<p>c) Apparatdykaren fyller lungorna med luft under högt tryck. Vid uppstigning expanderar den till tre gånger volymen och kan spränga lungvävnaden.</p>`),

u('6.5',6,'arkimedes','A','(1/2/2)',
`<p>Havsis har densiteten 917 kg/m³ och havsvatten 1025 kg/m³.</p>
<ol><li>Hur stor andel av ett flytande isberg befinner sig under vattenytan?</li>
<li>Ett isberg smälter helt. Hur mycket stiger havsnivån? Motivera noga.</li>
<li>Varför stiger havsnivån ändå när Grönlands inlandsis smälter?</li></ol>`,
`<p>a) ρ_is·V = ρ_vatten·V_under → andelen = 917/1025 = <strong>89,5 %</strong></p>
<p>b) <strong>Inte alls.</strong> Isberget tränger redan undan en vattenvolym som väger exakt lika mycket som isberget. När isen smälter blir den precis den volymen.</p>
<p>c) Inlandsisen ligger på land och ingår inte i havsvolymen förrän den smälter — då tillförs vatten som inte fanns i havet.</p>`),

u('6.6',6,'arkimedes','C','(0/3/0)',
`<p>En gasballong innehåller 520 m³ helium. Hölje, korg, utrustning och passagerare väger tillsammans 600 kg. Luftens densitet är 1,29 kg/m³ och heliumets 0,178 kg/m³.</p>
<ol><li>Hur stor massa luft tränger ballongen undan?</li><li>Hur stor last kan ballongen bära i jämvikt?</li>
<li>Hur mycket sandbarlast måste kastas för att ballongen ska börja stiga?</li></ol>`,
`<p>a) 1,29·520 = <strong>671 kg</strong></p>
<p>b) Heliumet väger 0,178·520 = 93 kg → nettolyft = <strong>578 kg</strong></p>
<p>c) Lasten är 600 kg, alltså 22 kg för tung. Minst <strong>22 kg</strong> måste kastas.</p>`),

u('6.7',6,'tryck','E','(2/1/0)',
`<p>En sugpropp med diametern 8,0 cm pressas fast mot en slät vägg så att all luft mellan proppen och väggen försvinner. Lufttrycket är 101 kPa.</p>
<ol><li>Hur stor kraft krävs för att dra loss proppen rakt utåt?</li><li>Vad är det egentligen som håller fast proppen?</li></ol>`,
`<p>a) A = π·0,040² = 5,03·10⁻³ m². F = pA = <strong>509 N</strong>, motsvarande en vikt på 52 kg</p>
<p>b) Lufttrycket utifrån. Det finns inget "sug" — det är avsaknaden av mottryck på insidan som gör skillnaden.</p>`),

u('6.8',6,'vatsketryck','C','(2/1/0)',
`<p>Vattentrycket i en villas ledning är 3,0 bar (3,0·10⁵ Pa).</p>
<ol><li>Hur högt upp kan vattnet som mest stiga i ett lodrätt rör?</li>
<li>Räcker trycket till en dusch på tredje våningen, 8,0 m över markplan? Motivera.</li></ol>`,
`<p>a) h = p/(ρg) = 3,0·10⁵/(998·9,82) = <strong>30,6 m</strong></p>
<p>b) Ja, med god marginal. Kvar vid duschen finns 3,0·10⁵ − 998·9,82·8,0 = 2,2·10⁵ Pa, alltså 2,2 bar.</p>`),

u('6.9',6,'vatsketryck','C','(1/2/0)',
`<p>Blodtrycket 120 mmHg mäts i överarmen, i höjd med hjärtat. 1 mmHg motsvarar 133,3 Pa. Blodets densitet är 1060 kg/m³.</p>
<ol><li>Hur många kilopascal är 120 mmHg?</li>
<li>Hjärnan sitter 0,40 m ovanför hjärtat. Hur stort blir blodtrycket där?</li>
<li>Varför kan man svimma om man reser sig för snabbt?</li></ol>`,
`<p>a) 120·133,3 = <strong>16,0 kPa</strong></p>
<p>b) Tryckfall ρgh = 1060·9,82·0,40 = 4,2 kPa → <strong>11,8 kPa</strong> (89 mmHg)</p>
<p>c) När man reser sig ökar höjdskillnaden plötsligt. Hinner inte kroppen höja hjärttrycket sjunker trycket i hjärnan under det som krävs för genomblödning.</p>`),

u('6.10',6,'vatsketryck','A','(0/2/2)',
`<p>En giraffs huvud sitter 2,5 m ovanför hjärtat. Blodets densitet är 1060 kg/m³ och 1 mmHg = 133,3 Pa.</p>
<ol><li>Hur stort extra tryck krävs för att driva blod ända upp till hjärnan?</li>
<li>Vilket blodtryck måste giraffens hjärta hålla om hjärnan behöver samma 90 mmHg som hos en människa?</li>
<li>Vilket problem uppstår när giraffen böjer ner huvudet för att dricka?</li></ol>`,
`<p>a) ρgh = 1060·9,82·2,5 = 26,0 kPa = <strong>195 mmHg</strong></p>
<p>b) 90 + 195 = <strong>285 mmHg</strong> — mer än dubbelt så högt som hos en människa</p>
<p>c) Då hamnar hjärnan under hjärtat och trycket skulle bli farligt högt. Giraffen har klaffar i halsvenerna och ett kärlnät vid hjärnan som dämpar tryckstöten.</p>`),

u('6.11',6,'tryck','A','(0/2/1)',
`<p>I en bils bromssystem trycker föraren på pedalen med 200 N. Pedalens hävarm förstärker kraften fyra gånger innan den når huvudcylindern, vars kolv har arean 2,0 cm². Varje bromsok har en kolvarea på 12 cm².</p>
<ol><li>Vilket tryck uppstår i bromsvätskan?</li><li>Hur stor kraft verkar varje bromsok med?</li>
<li>Varför måste bromsvätskan vara helt fri från luftbubblor?</li></ol>`,
`<p>a) Kraft på huvudcylindern: 4·200 = 800 N. p = F/A = 800/2,0·10⁻⁴ = <strong>4,0 MPa</strong></p>
<p>b) F = pA = 4,0·10⁶·12·10⁻⁴ = <strong>4,8 kN</strong> per ok</p>
<p>c) Vätskor är i praktiken inkompressibla, men gas komprimeras. En luftbubbla trycks ihop istället för att föra vidare trycket, och pedalen blir svampig.</p>`),

/* ─────────── KAPITEL 7 ─────────── */
u('7.1',7,'varme','C','(2/1/0)',
`<p>En dusch använder 12 liter vatten per minut och används i 8 minuter. Vattnet värms från 10 °C till 40 °C. Elpriset är 2,50 kr/kWh.</p>
<ol><li>Hur mycket energi går åt?</li><li>Vad kostar duschen?</li>
<li>Hur mycket sparas per år om duschen kortas till 5 minuter, varje dag?</li></ol>`,
`<p>a) m = 96 kg. E = 4180·96·30 = <strong>12,0 MJ</strong> = 3,34 kWh</p>
<p>b) 3,34·2,50 = <strong>8,4 kr</strong></p>
<p>c) 3/8 av kostnaden sparas: 0,375·8,4·365 ≈ <strong>1150 kr/år</strong></p>`),

u('7.2',7,'varme','E','(2/0/0)',
`<p>En vattenkokare på 2000 W fylls med 1,7 liter vatten som håller 20 °C. Verkningsgraden är 90 %.</p>
<p>Hur lång tid tar det innan vattnet kokar?</p>`,
`<p>E = 4180·1,7·80 = 568 kJ. Nyttig effekt 1800 W</p>
<p>t = 568 480/1800 = 316 s = <strong>5,3 minuter</strong></p>`),

u('7.3',7,'varme','C','(0/2/0)',
`<p>I en bastu är luften 90 °C, vilket går att sitta i. Vatten som håller 90 °C ger omedelbara brännskador.</p>
<ol><li>Beräkna hur mycket energi en liter luft och en liter vatten kan avge när den kyls 70 °C. Luftens densitet är 1,0 kg/m³ och dess specifika värmekapacitet 1005 J/(kg·K).</li>
<li>Förklara skillnaden i praktiken.</li></ol>`,
`<p>a) Luft: 1005·0,0010·70 = <strong>70 J</strong>. Vatten: 4180·1,0·70 = <strong>293 kJ</strong></p>
<p>b) Vattnet kan avge omkring <strong>4000 gånger</strong> mer energi per liter. Huden hinner inte leda bort den.</p>`),

u('7.4',7,'varme','C','(1/2/0)',
`<p>En bilmotor avger 40 kW nyttig effekt vid verkningsgraden 30 %.</p>
<ol><li>Hur mycket effekt tillförs som bränsle?</li><li>Hur mycket blir spillvärme?</li>
<li>Kylsystemet ska ta bort 60 kW och kylvattnet får värmas 8 °C. Vilket flöde krävs?</li></ol>`,
`<p>a) 40/0,30 = <strong>133 kW</strong></p><p>b) 133 − 40 = <strong>93 kW</strong></p>
<p>c) m/t = P/(cΔT) = 60 000/(4180·8) = <strong>1,8 kg/s</strong></p>`),

u('7.5',7,'fasandring','A','(0/2/1)',
`<p>Ett glas med 250 g dryck håller 25 °C. Man vill kyla den till 5 °C med iskuber som håller 0 °C.</p>
<ol><li>Hur mycket is behövs?</li><li>Varför är is så mycket effektivare än lika mycket kylskåpskallt vatten?</li></ol>`,
`<p>Drycken avger 4180·0,250·20 = 20 900 J</p>
<p>Isen tar upp smältvärme och uppvärmning: (334 000 + 4180·5)·m = 20 900</p>
<p>a) m = <strong>59 g</strong></p>
<p>b) Smältningen ensam står för 334 kJ/kg. Även 0-gradigt vatten hade behövt fyra gånger större massa.</p>`),

u('7.6',7,'fasandring','A','(0/1/2)',
`<p>Fruktodlare sprutar ibland vatten på sina träd inför en frostnatt, trots att det verkar bakvänt.</p>
<ol><li>Förklara varför det skyddar knopparna. Använd att det frigörs energi när vatten fryser.</li>
<li>Ett träd täcks av 1,0 kg vatten. Hur mycket energi avges när allt fryser?</li>
<li>Om omgivningen kyler bort 40 W från trädet, hur länge håller skyddet?</li></ol>`,
`<p>a) När vatten fryser avges 334 kJ/kg och temperaturen står stilla vid 0 °C. Isen håller knoppen vid exakt 0 °C istället för att låta den sjunka till luftens −5 °C.</p>
<p>b) E = <strong>334 kJ</strong></p><p>c) t = 334 000/40 = 8350 s = <strong>2,3 timmar</strong></p>`),

u('7.7',7,'fasandring','E','(2/0/0)',
`<p>Ett kilo vatten som håller 20 °C ska frysas in till −18 °C i en frys. Det krävs 334 kJ för att smälta ett kilo is, isens specifika värmekapacitet 2100 J/(kg·K).</p>
<p>Hur mycket energi måste frysen transportera bort?</p>`,
`<p>Kylning till 0 °C: 4180·1,0·20 = 84 kJ</p><p>Frysning: 334 kJ</p><p>Kylning av isen: 2100·1,0·18 = 38 kJ</p>
<p>Totalt <strong>455 kJ</strong>, varav frysningen ensam står för nästan tre fjärdedelar.</p>`),

u('7.8',7,'varme','C','(1/2/0)',
`<p>Ett hus behöver 15 000 kWh värme per år. En värmepump har värmefaktorn (COP) 3,5, vilket betyder att den levererar 3,5 gånger så mycket värme som den elenergi den förbrukar.</p>
<ol><li>Hur mycket el förbrukar värmepumpen per år?</li>
<li>Hur mycket sparas jämfört med direktverkande el, vid 2,50 kr/kWh?</li>
<li>Bryter värmepumpen mot energiprincipen? Motivera.</li></ol>`,
`<p>a) 15 000/3,5 = <strong>4300 kWh</strong></p>
<p>b) Besparing 10 700 kWh → <strong>ca 27 000 kr/år</strong></p>
<p>c) Nej. Den skapar ingen energi utan flyttar värme från utomhusluften in i huset. Elen driver bara transporten.</p>`),

u('7.9',7,'varme','C','(2/1/0)',
`<p>Ett fönster har arean 2,4 m² och U-värdet 1,2 W/(m²·K), vilket anger effekten per kvadratmeter och grads temperaturskillnad.</p>
<ol><li>Hur mycket effekt läcker ut när det är 20 °C inne och −2 °C ute?</li>
<li>Hur mycket energi blir det under 2000 timmar vinterhalvår?</li>
<li>Ett treglasfönster har U-värdet 0,8. Hur mycket sparas?</li></ol>`,
`<p>a) P = U·A·ΔT = 1,2·2,4·22 = <strong>63 W</strong></p>
<p>b) 63,4·2000/1000 = <strong>127 kWh</strong></p>
<p>c) Effekten sjunker till 42 W → besparing <strong>42 kWh</strong>, alltså en tredjedel</p>`),

u('7.10',7,'varme','C','(0/2/0)',
`<p>Du häller upp 200 g kaffe som håller 90 °C och vill dricka det om tio minuter. Du ska ha i 30 g kylskåpskall mjölk (5 °C).</p>
<ol><li>Vilken temperatur får blandningen direkt efter att mjölken hällts i?</li>
<li>Blir kaffet varmast om du häller i mjölken direkt eller precis innan du dricker? Motivera med hur avsvalningen beror på temperaturskillnaden mot rummet.</li></ol>`,
`<p>a) T = (200·90 + 30·5)/230 = <strong>79 °C</strong></p>
<p>b) <strong>Direkt.</strong> Ett svalare kaffe har mindre temperaturskillnad mot rummet och förlorar därför värme långsammare under de tio minuterna. Häller man i mjölken sist har kaffet svalnat snabbare hela tiden.</p>`),

u('7.11',7,'varme','A','(0/1/2)',
`<p>Solen levererar i genomsnitt 1361 W/m² vinkelrätt mot jordbanan. Jorden är ett klot, så effekten sprids ut över fyra gånger så stor yta.</p>
<ol><li>Hur stor är den genomsnittliga instrålningen per kvadratmeter jordyta?</li>
<li>Jordens albedo är 0,30. Hur mycket absorberas?</li>
<li>Vad skulle hända med jordens temperatur om albedot ökade, och vad kan orsaka det?</li></ol>`,
`<p>a) 1361/4 = <strong>340 W/m²</strong></p><p>b) 0,70·340 = <strong>238 W/m²</strong></p>
<p>c) Högre albedo ⇒ mindre absorberad energi ⇒ lägre jämviktstemperatur. Mer is och moln höjer albedot; smältande is sänker det, vilket gör att effekten förstärker sig själv.</p>`),

u('7.12',7,'varme','A','(0/2/1)',
`<p>Vatten har den specifika värmekapaciteten 4180 J/(kg·K) och luft 1005 J/(kg·K). Vattnets densitet är 1000 kg/m³ och luftens 1,29 kg/m³.</p>
<ol><li>Hur hög luftpelare med basytan 1,0 m² har samma värmekapacitet som 1,0 m³ vatten?</li>
<li>Förklara med hjälp av svaret varför kustklimat har mindre temperaturskillnad mellan sommar och vinter än inlandsklimat.</li></ol>`,
`<p>a) 4180·1000 = 1005·1,29·h → h = <strong>3200 m</strong></p>
<p>b) En meter havsvatten lagrar lika mycket värme som drygt tre kilometer luft. Havet värms och kyls därför långsamt och dämpar årstidernas svängningar för den luft som passerar över det.</p>`),

/* ─────────── KAPITEL 8 ─────────── */
u('8.1',8,'kretsar','C','(2/1/0)',
`<p>En laddare levererar 5,0 V och 2,0 A i 90 minuter.</p>
<ol><li>Hur mycket energi har överförts?</li>
<li>Mobilbatteriet är märkt 4000 mAh vid 3,7 V. Hur mycket energi rymmer det?</li><li>Kommentera skillnaden.</li></ol>`,
`<p>a) E = UIt = 5,0·2,0·5400 = <strong>54 kJ</strong> (15 Wh)</p>
<p>b) Q = 14 400 C → E = 14 400·3,7 = <strong>53 kJ</strong></p>
<p>c) Nästan exakt en full laddning — i verkligheten går en del bort som värme i laddare och batteri.</p>`),

u('8.2',8,'ems','E','(2/1/0)',
`<p>En glödlampa på 60 W byts mot en LED-lampa på 9 W som lyser lika starkt. Lampan är tänd 4 timmar per dag. Elpriset är 2,50 kr/kWh.</p>
<ol><li>Hur mycket energi sparas per år?</li><li>Hur mycket pengar?</li>
<li>LED-lampan kostar 45 kr. Hur snabbt är den betald?</li></ol>`,
`<p>a) (60 − 9)·4·365/1000 = <strong>74,5 kWh/år</strong></p>
<p>b) 74,5·2,50 = <strong>186 kr/år</strong></p><p>c) 45/186 år ≈ <strong>3 månader</strong></p>`),

u('8.3',8,'kretsar','A','(0/2/1)',
`<p>En förlängningskabel är 25 m lång och har ledararean 1,5 mm². Kopparns resistivitet är 1,72·10⁻⁸ Ωm. Genom kabeln går strömmen 10 A.</p>
<ol><li>Vilken resistans har kabeln? Tänk på att strömmen går fram och tillbaka.</li>
<li>Hur stort blir spänningsfallet?</li><li>Hur mycket effekt utvecklas som värme i kabeln?</li>
<li>Varför blir en hoprullad kabel varmare än en utrullad?</li></ol>`,
`<p>a) Ledarlängd 50 m. R = ρL/A = <strong>0,57 Ω</strong></p>
<p>b) U = RI = <strong>5,7 V</strong></p><p>c) P = RI² = <strong>57 W</strong></p>
<p>d) Samma effekt utvecklas, men värmen kan inte ledas bort lika lätt från en rulle. Temperaturen stiger tills isoleringen kan skadas.</p>`),

u('8.4',8,'kopplingar','C','(1/2/0)',
`<p>En julgranslinga med 20 seriekopplade lampor ansluts till 230 V. Linjan förbrukar totalt 15 W.</p>
<ol><li>Vilken spänning ligger över varje lampa?</li><li>Vilken resistans har en lampa?</li>
<li>En lampa kortsluts inuti sockeln. Vad händer med de övriga?</li></ol>`,
`<p>a) 230/20 = <strong>11,5 V</strong></p>
<p>b) I = P/U = 65 mA. R_tot = 3527 Ω → <strong>176 Ω per lampa</strong></p>
<p>c) 230 V delas nu på 19 lampor: <strong>12,1 V</strong> vardera. Resistansen sjunker, strömmen ökar och effekten stiger till 15,8 W. Lamporna lyser starkare — och brinner av snabbare, en i taget.</p>`),

u('8.5',8,'ems','A','(0/2/1)',
`<p>Ett bilbatteri har emk 12,6 V. Den inre resistansen är 0,012 Ω vid 20 °C men stiger till 0,030 Ω vid −20 °C. Startmotorn har resistansen 0,020 Ω.</p>
<ol><li>Hur stor blir startströmmen vid de två temperaturerna?</li>
<li>Vilken polspänning ligger över startmotorn i de två fallen?</li>
<li>Förklara varför bilen inte startar en kall morgon.</li></ol>`,
`<p>a) I = ε/(R+r): <strong>394 A</strong> vid 20 °C, <strong>252 A</strong> vid −20 °C</p>
<p>b) U = RI: <strong>7,9 V</strong> och <strong>5,0 V</strong></p>
<p>c) Startmotorns effekt sjunker från ca 3,1 kW till 1,3 kW samtidigt som oljan är trögare och motorn kräver mer. Marginalen försvinner.</p>`),

u('8.6',8,'ems','C','(1/2/1)',
`<p>En elbil har ett batteri på 60 kWh och förbrukar 18 kWh per 100 km vid normal körning.</p>
<ol><li>Vilken räckvidd ger det?</li>
<li>På vintern går kupévärmaren på 2,0 kW och medelfarten är 80 km/h. Hur mycket extra energi går åt per 100 km?</li>
<li>Vilken blir vinterräckvidden?</li></ol>`,
`<p>a) 60/18·100 = <strong>333 km</strong></p>
<p>b) 100 km tar 1,25 h → 2,0·1,25 = <strong>2,5 kWh per 100 km</strong></p>
<p>c) 60/20,5·100 = <strong>293 km</strong>, alltså 12 % kortare</p>`),

u('8.7',8,'falt','A','(0/2/2)',
`<p>Vid ett blixtnedslag överförs laddningen 20 C mellan moln och mark, där spänningen mellan moln och mark är 100 MV.</p>
<ol><li>Hur mycket energi frigörs?</li><li>Hur många kilowattimmar motsvarar det, och vad räcker det till?</li>
<li>Luft slår igenom vid ungefär 3 MV/m. Vilket avstånd skulle 100 MV motsvara? Jämför med verklig molnhöjd och förklara skillnaden.</li></ol>`,
`<p>a) E = QU = 20·100·10⁶ = <strong>2,0·10⁹ J</strong></p>
<p>b) <strong>556 kWh</strong> — ungefär en villas elförbrukning under två veckor</p>
<p>c) d = 100·10⁶/3·10⁶ = <strong>33 m</strong>, men moln ligger på kilometers höjd. Blixten byggs upp stegvis genom joniserade kanaler där det krävs mycket svagare fält för att slå igenom.</p>`),

u('8.8',8,'kretsar','C','(0/2/1)',
`<p>Torr hud ger kroppen resistansen ungefär 100 kΩ, våt hud ungefär 1,0 kΩ. Nätspänningen är 230 V.</p>
<ol><li>Vilken ström går genom kroppen i de två fallen?</li>
<li>Ström över 100 mA genom hjärtat kan ge kammarflimmer. Bedöm de två fallen.</li>
<li>Varför är badrum och kök särskilt reglerade utrymmen?</li></ol>`,
`<p>a) I = U/R: <strong>2,3 mA</strong> och <strong>230 mA</strong></p>
<p>b) 2,3 mA känns obehagligt men är sällan livsfarligt. 230 mA är klart över gränsen för kammarflimmer.</p>
<p>c) Vatten sänker hudens resistans med två tiopotenser. Samma spänning som är obehaglig i ett vardagsrum kan vara dödlig i ett badkar.</p>`),

u('8.9',8,'laddning','E','(2/0/0)',
`<p>En ballong gnids mot håret och får laddningen −8,0 nC.</p>
<ol><li>Hur många överskottselektroner har ballongen fått?</li><li>Var kom de ifrån?</li></ol>`,
`<p>a) n = Q/e = 8,0·10⁻⁹/1,602·10⁻¹⁹ = <strong>5,0·10¹⁰ elektroner</strong></p>
<p>b) Från håret, som därmed blir lika mycket positivt laddat. Laddning skapas inte utan flyttas.</p>`),

u('8.10',8,'ems','E','(2/1/0)',
`<p>En lägenhet har en säkring på 10 A vid 230 V.</p>
<ol><li>Vilken total effekt kan tas ut innan säkringen löser?</li>
<li>Kan man samtidigt köra en vattenkokare på 2000 W och en brödrost på 800 W? Motivera.</li>
<li>Varför löser säkringen ut istället för att kabeln bara blir varm?</li></ol>`,
`<p>a) P = UI = 230·10 = <strong>2300 W</strong></p>
<p>b) Nej. 2800 W kräver 12,2 A, alltså över gränsen.</p>
<p>c) Säkringen är avsiktligt kretsens svagaste punkt. Utan den skulle värmen istället utvecklas i väggkabeln, som inte går att byta och kan antända huset.</p>`),

u('8.11',8,'falt','C','(1/2/0)',
`<p>I en laserskrivare styrs tonerpartiklar av ett elektriskt fält. En partikel har massan 5,0·10⁻¹² kg och laddningen 1,0·10⁻¹⁵ C. Fältstyrkan är 1,0·10⁶ V/m.</p>
<ol><li>Hur stor elektrisk kraft verkar på partikeln?</li><li>Hur stor är tyngdkraften?</li>
<li>Varför kan skrivaren styra partiklarna så exakt?</li></ol>`,
`<p>a) F = qE = 1,0·10⁻¹⁵·1,0·10⁶ = <strong>1,0·10⁻⁹ N</strong></p>
<p>b) F = mg = <strong>4,9·10⁻¹¹ N</strong></p>
<p>c) Den elektriska kraften är <strong>20 gånger</strong> större än tyngdkraften. Tonern följer fältet i praktiken helt och faller inte.</p>`),

u('8.12',8,'falt','C','(1/2/0)',
`<p>Ett batteri på 12 V är kopplat till två seriekopplade resistorer, R₁ = 100 Ω och R₂ = 200 Ω. Punkten mellan resistorerna är jordad, alltså har potentialen 0 V.</p>
<ol><li>Vilken ström går i kretsen?</li><li>Bestäm spänningen över varje resistor.</li>
<li>Bestäm potentialen vid batteriets båda poler.</li></ol>`,
`<p>a) I = 12/300 = <strong>40 mA</strong></p>
<p>b) U₁ = <strong>4,0 V</strong>, U₂ = <strong>8,0 V</strong></p>
<p>c) Polen bortom R₁ ligger på <strong>+4,0 V</strong> och polen bortom R₂ på <strong>−8,0 V</strong>. Jordpunkten avgör var nollan läggs, inte spänningarna.</p>`),

u('8.13',8,'ems','C','(1/2/0)',
`<p>En solcellspanel har arean 1,7 m². Vid en instrålning på 800 W/m² levererar den 22,5 V och 9,0 A.</p>
<ol><li>Hur stor effekt träffar panelen?</li><li>Hur stor eleffekt ger den?</li><li>Vilken verkningsgrad har panelen?</li></ol>`,
`<p>a) 800·1,7 = <strong>1360 W</strong></p><p>b) P = UI = 22,5·9,0 = <strong>202 W</strong></p>
<p>c) η = 202/1360 = <strong>15 %</strong>, vilket är typiskt för kiselceller.</p>`),

u('8.14',8,'ems','A','(0/2/2)',
`<p>Från ett kraftverk ska 100 MW överföras 200 km. Ledningens resistans är 0,050 Ω per km.</p>
<ol><li>Vilken resistans har hela ledningen?</li>
<li>Beräkna strömmen och effektförlusten vid överföringsspänningen 400 kV.</li>
<li>Gör samma beräkning vid 20 kV och förklara resultatet.</li></ol>`,
`<p>a) R = 0,050·200 = <strong>10 Ω</strong></p>
<p>b) I = P/U = 250 A → förlust RI² = <strong>0,63 MW</strong>, alltså 0,6 %</p>
<p>c) I = 5000 A → RI² = <strong>250 MW</strong>, mer än vad som skickas. Överföringen vore omöjlig. Eftersom förlusten går som I² lönar det sig alltid att höja spänningen och sänka strömmen.</p>`),

u('8.15',8,'ems','C','(0/2/1)',
`<p>Ett elstängsel ger pulser med energin 0,20 J, en puls per sekund, vid spänningen 5,0 kV.</p>
<ol><li>Vilken medeleffekt har stängslet?</li>
<li>Varför är 5000 V ofarligt här, trots att 230 V i ett vägguttag kan döda?</li></ol>`,
`<p>a) P = 0,20 J/s = <strong>0,20 W</strong></p>
<p>b) Det avgörande är strömmens storlek <em>och</em> varaktighet. Pulsen varar bråkdelar av en millisekund och innehåller mycket lite energi, medan ett vägguttag levererar ström kontinuerligt tills man släpper eller säkringen löser.</p>`),

/* ─────────── KAPITEL 9 ─────────── */
u('9.1',9,'aktivitet','E','(2/0/0)',
`<p>En banan innehåller kalium, varav en liten del är den radioaktiva isotopen kalium-40. Aktiviteten hos en genomsnittlig banan är cirka 15 Bq.</p>
<ol><li>Vad betyder det?</li><li>Hur många sönderfall sker i bananen under ett år?</li></ol>`,
`<p>a) I genomsnitt sönderfaller <strong>15 kalium-40-kärnor per sekund</strong></p>
<p>b) 15·3,156·10⁷ = <strong>4,7·10⁸ sönderfall</strong></p>`),

u('9.2',9,'stralning','C','(2/1/0)',
`<p>Ett röntgenrör drivs med spänningen 60 kV, som accelererar elektronerna.</p>
<ol><li>Vilken är den högsta energi en enskild röntgenfoton kan få?</li><li>Vilken våglängd motsvarar det?</li>
<li>Varför kan ingen foton få högre energi än så?</li></ol>`,
`<p>a) E = eU = 60·10³·1,602·10⁻¹⁹ = <strong>9,6·10⁻¹⁵ J</strong> = 60 keV</p>
<p>b) λ = hc/E = <strong>21 pm</strong></p>
<p>c) Elektronen har högst den rörelseenergi spänningen gett den, och en foton kan inte bära mer energi än vad elektronen kan avge på en gång.</p>`),

u('9.3',9,'aktivitet','C','(1/2/0)',
`<p>Många brandvarnare innehåller americium-241 med aktiviteten 37 kBq. Halveringstiden är 432 år.</p>
<ol><li>Hur stor är aktiviteten efter 10 år?</li><li>Efter 100 år?</li>
<li>Vad säger det om varför just Am-241 valts?</li></ol>`,
`<p>a) 37·0,5^(10/432) = <strong>36,4 kBq</strong></p><p>b) <strong>31,5 kBq</strong></p>
<p>c) Aktiviteten är i praktiken konstant över apparatens livslängd — detektorn behöver inte kalibreras om och källan blir inte verkningslös.</p>`),

u('9.4',9,'aktivitet','A','(1/2/1)',
`<p>Vid PET-undersökningar används fluor-18 med halveringstiden 110 minuter. En dos med aktiviteten 20 GBq framställs klockan 09:00.</p>
<ol><li>Vilken aktivitet återstår klockan 12:30?</li><li>Varför måste F-18 tillverkas nära sjukhuset?</li>
<li>Vore en halveringstid på 10 dygn bättre eller sämre? Motivera ur två perspektiv.</li></ol>`,
`<p>a) 210 min = 1,91 halveringstider → 20·0,5^1,91 = <strong>5,3 GBq</strong></p>
<p>b) Efter ett dygn återstår mindre än en promille — transport över längre avstånd är omöjlig.</p>
<p>c) Bättre logistiskt, men sämre för patienten: aktiviteten skulle finnas kvar i kroppen i veckor och ge onödig stråldos. Kort halveringstid är ett medvetet val.</p>`),

u('9.5',9,'aktivitet','A','(0/2/1)',
`<p>En källare på 120 m³ har radonhalten 300 Bq/m³. Referensvärdet för bostäder i Sverige är 200 Bq/m³.</p>
<ol><li>Hur många sönderfall sker i källarluften varje sekund?</li>
<li>Hur mycket måste halten sänkas i procent för att nå referensvärdet?</li>
<li>Radon-222 har halveringstiden 3,8 dygn. Varför räcker det inte att stänga källaren och vänta?</li></ol>`,
`<p>a) 300·120 = <strong>36 000 Bq</strong></p>
<p>b) Från 300 till 200 Bq/m³ ⇒ en sänkning med <strong>33 %</strong></p>
<p>c) Radon tillförs kontinuerligt från marken och byggmaterialet. Sönderfallet motverkas av ständig nybildning, så halten ställer in sig på en jämviktsnivå som bara ventilation kan sänka.</p>`),

u('9.6',9,'karnreaktioner','A','(0/1/3)',
`<p>Solen strålar ut effekten 3,85·10²⁶ W. Solens massa är 1,989·10³⁰ kg.</p>
<ol><li>Hur mycket massa omvandlas till energi varje sekund?</li><li>Hur mycket blir det på ett år?</li>
<li>Solen har lyst i ungefär 4,6 miljarder år. Hur stor andel av sin massa har den förlorat på det sättet?</li></ol>`,
`<p>a) m = P/c² = 3,85·10²⁶/(2,998·10⁸)² = <strong>4,3·10⁹ kg per sekund</strong></p>
<p>b) <strong>1,4·10¹⁷ kg per år</strong></p>
<p>c) 6,2·10²⁶ kg, vilket är <strong>0,031 %</strong> av solmassan. Fyra miljarder ton per sekund, och solen har ändå knappt märkt det.</p>`),

u('9.7',9,'stralning','E','(2/0/0)',
`<p>Absorberad dos mäts i gray, där 1 Gy = 1 J/kg. En person med massan 60 kg absorberar 3,0 mJ strålningsenergi jämnt fördelad över kroppen.</p>
<ol><li>Vilken absorberad dos motsvarar det?</li>
<li>Strålningen är gammastrålning med viktfaktorn 1. Vilken ekvivalent dos ger det?</li></ol>`,
`<p>a) D = E/m = 3,0·10⁻³/60 = <strong>5,0·10⁻⁵ Gy = 50 µGy</strong></p>
<p>b) H = w·D = <strong>50 µSv</strong>, ungefär som en flygresa över Atlanten</p>`),

u('9.8',9,'karnreaktioner','E','(2/1/0)',
`<p>Vid fission av en U-235-kärna frigörs ungefär 200 MeV.</p>
<ol><li>Hur många joule är det?</li><li>Hur många fissioner krävs för att frigöra 1,0 J?</li>
<li>Ett gram U-235 innehåller 2,56·10²¹ kärnor. Hur mycket energi ger ett gram?</li></ol>`,
`<p>a) 200·10⁶·1,602·10⁻¹⁹ = <strong>3,2·10⁻¹¹ J</strong></p>
<p>b) 1/3,2·10⁻¹¹ = <strong>3,1·10¹⁰ fissioner</strong></p>
<p>c) 2,56·10²¹·3,2·10⁻¹¹ = <strong>8,2·10¹⁰ J</strong> — samma energi som i knappt 3 ton stenkol</p>`),

u('9.9',9,'karnreaktioner','C','(1/2/0)',
`<p>Ett kärnkraftverk levererar 1000 MW elektrisk effekt vid verkningsgraden 33 %. Ett gram U-235 ger 8,2·10¹⁰ J. Ett år har 3,156·10⁷ s.</p>
<ol><li>Hur stor termisk effekt utvecklas i reaktorn?</li><li>Hur mycket energi produceras termiskt per år?</li>
<li>Hur mycket U-235 förbrukas per år?</li></ol>`,
`<p>a) 1000/0,33 = <strong>3000 MW</strong></p>
<p>b) 3,03·10⁹·3,156·10⁷ = <strong>9,6·10¹⁶ J</strong></p>
<p>c) m = 9,6·10¹⁶/8,2·10¹⁰ = 1,2·10⁶ g = <strong>1,2 ton</strong>. Ett kolkraftverk hade behövt miljontals ton.</p>`),

u('9.10',9,'karnreaktioner','C','(1/2/0)',
`<p>I solen omvandlas fyra väteatomer till en heliumatom. Väteatomens massa är 1,007825 u och heliumatomens 4,002603 u. 1 u motsvarar 931,5 MeV.</p>
<ol><li>Hur stor är massdefekten?</li><li>Hur mycket energi frigörs per bildad heliumkärna?</li>
<li>Hur stor andel av väteatomernas massa omvandlas?</li></ol>`,
`<p>a) Δm = 4·1,007825 − 4,002603 = <strong>0,0287 u</strong></p>
<p>b) E = 0,0287·931,5 = <strong>26,7 MeV</strong></p>
<p>c) 0,0287/4,031 = <strong>0,71 %</strong> — solen omvandlar alltså mindre än en procent av det väte den förbrukar.</p>`),

u('9.11',9,'aktivitet','C','(1/2/0)',
`<p>Vid en laboration mäts aktiviteten hos ett preparat.</p>
<table class="data"><tr><th>t (min)</th><th>A (Bq)</th></tr>
<tr><td>0</td><td>800</td></tr><tr><td>10</td><td>566</td></tr><tr><td>20</td><td>400</td></tr>
<tr><td>30</td><td>283</td></tr><tr><td>40</td><td>200</td></tr></table>
<ol><li>Bestäm halveringstiden ur tabellen utan att rita graf.</li><li>Bestäm sönderfallskonstanten.</li>
<li>Vilken aktivitet väntas efter 60 minuter?</li></ol>`,
`<p>a) 800 → 400 tar 20 min, och 400 → 200 tar också 20 min → T½ = <strong>20 minuter</strong></p>
<p>b) λ = ln2/T½ = 0,693/1200 s = <strong>5,8·10⁻⁴ s⁻¹</strong></p>
<p>c) 60 min = 3 halveringstider → 800/8 = <strong>100 Bq</strong></p>`),

u('9.12',9,'stralning','A','(0/2/2)',
`<p>Vid strålbehandling ska en tumör med massan 0,15 kg få den absorberade dosen 2,0 Gy per behandlingstillfälle. Behandlingen upprepas 30 gånger.</p>
<ol><li>Hur mycket energi absorberas i tumören vid ett tillfälle?</li>
<li>Hur mycket stiger tumörens temperatur, om vävnaden har samma värmekapacitet som vatten?</li>
<li>Den totala dosen blir 60 Gy, vilket är dödligt för en hel kropp. Förklara varför behandlingen ändå fungerar.</li></ol>`,
`<p>a) E = D·m = 2,0·0,15 = <strong>0,30 J</strong></p>
<p>b) ΔT = E/(mc) = 0,30/(0,15·4180) = <strong>4,8·10⁻⁴ °C</strong> — helt omätbart</p>
<p>c) Dosen ges lokalt, inte till hela kroppen, och delas upp på 30 tillfällen så att frisk vävnad hinner reparera sig mellan gångerna. Skadan sitter i joniseringen av DNA, inte i uppvärmningen.</p>`),

u('4.15',4,'moment','E','(2/0/0)',
`<p>En dörr är 0,80 m bred. Handtaget sitter längst ut från gångjärnen och man trycker vinkelrätt med kraften 15 N.</p>
<ol><li>Hur stort kraftmoment ger det kring gångjärnen?</li>
<li>Hur stor kraft skulle krävas om man istället tryckte mitt på dörren?</li></ol>`,
`<p>a) M = F·l = 15·0,80 = <strong>12 Nm</strong></p>
<p>b) Halva hävarmen kräver dubbel kraft: <strong>30 N</strong>. Därför sitter handtaget alltid så långt från gångjärnen som möjligt.</p>`),

u('6.12',6,'gaslagen','E','(2/0/0)',
`<p>En dykflaska är fylld till trycket 200 bar. Ett bar motsvarar 1,0·10⁵ Pa.</p>
<ol><li>Hur många pascal är det?</li>
<li>Flaskans ventilöppning har arean 3,0 cm². Hur stor kraft verkar inifrån på ventilen?</li></ol>`,
`<p>a) 200·1,0·10⁵ = <strong>2,0·10⁷ Pa</strong></p>
<p>b) F = pA = 2,0·10⁷·3,0·10⁻⁴ = <strong>6,0 kN</strong>, motsvarande tyngden av 610 kg</p>`),

u('7.13',7,'varme','E','(2/0/0)',
`<p>En termos innehåller 0,50 kg kaffe som håller 85 °C. Efter några timmar har kaffet svalnat till 62 °C. Kaffet kan behandlas som vatten.</p>
<ol><li>Hur mycket värmeenergi har kaffet avgett?</li>
<li>Vart tog energin vägen?</li></ol>`,
`<p>a) E = cmΔT = 4180·0,50·23 = <strong>48 kJ</strong></p>
<p>b) Ut i omgivningen genom termosens väggar och lock. En termos bromsar värmeflödet men stoppar det inte.</p>`)
];

<ol><li>Hur många liter per 100 km motsvarar det?</li><li>Hur många kWh går åt per 100 km?</li>
<li>En elbil förbrukar 18 kWh per 100 km. Kommentera skillnaden.</li></ol>`,

u('2.11',2,'enheter','C','(1/2/0)',

u('2.12',2,'enheter','C','(0/2/0)',

<li>Hur många värdesiffror är rimliga att ange, och varför?</li></ol>`,

u('2.13',2,'matnogg','E','(2/0/0)',
`<p>Vid en mätning bestäms en plattas längd till 12,4 cm och bredd till 3,0 cm.</p>
<ol><li>Hur många värdesiffror har vardera mätvärde?</li>
<li>Vilken area får plattan, med rätt antal värdesiffror?</li></ol>`,

<p>b) 12,4·3,0 = 37,2 cm², men svaret får inte ha fler värdesiffror än det sämsta mätvärdet: <strong>37 cm²</strong></p>`),

u('2.14',2,'matnogg','C','(0/2/0)',
`<p>Två elever mäter samma pendels svängningstid fem gånger.</p>
<table class="data"><tr><th>Elev</th><th>Mätvärden (s)</th></tr>
<tr><td>A</td><td>1,42 · 1,41 · 1,43 · 1,42 · 1,42</td></tr>

<ol><li>Beräkna medelvärdet för båda.</li><li>Vem har mest precisa mätningar? Motivera.</li>
<li>Betyder det att den eleven också ligger närmast det sanna värdet?</li></ol>`,

<p>b) A — spridningen är 0,02 s mot B:s 0,15 s.</p>

u('2.15',2,'matnogg','C','(1/2/0)',
`<p>En elev ska mäta svängningstiden hos en pendel. Tidtagningen har osäkerheten ± 0,20 s på grund av reaktionstid.</p>
<ol><li>Eleven mäter en svängning som tar 1,4 s. Hur stor blir osäkerheten i procent?</li>
<li>Istället mäts tiden för 20 svängningar, som tar 28 s. Hur stor blir osäkerheten i procent i svängningstiden nu?</li>
<li>Förklara varför metoden i b är bättre.</li></ol>`,

<p>c) Reaktionsfelet uppstår bara två gånger (start och stopp) oavsett hur många svängningar man mäter, men delas på en mycket längre tid.</p>`),

u('2.16',2,'matnogg','A','(0/1/2)',
`<p>En badrumsvåg visar alltid 0,3 kg för mycket. En annan våg visar rätt i genomsnitt men slumpmässigt ± 0,4 kg.</p>
<ol><li>Vilken sorts fel har de två vågarna?</li>
<li>Du väger dig tio gånger på varje våg och tar medelvärdet. Vilket fel försvinner, och vilket blir kvar?</li>
<li>Hur skulle du kunna upptäcka och åtgärda det kvarvarande felet?</li></ol>`,
`<p>a) Första vågen har ett <strong>systematiskt fel</strong>, andra ett <strong>slumpmässigt</strong>.</p>
<p>b) Medelvärdesbildning minskar det slumpmässiga felet men påverkar inte det systematiska — det ligger kvar på 0,3 kg.</p>
<p>c) Genom kalibrering mot en känd massa. Systematiska fel kan bara upptäckas genom jämförelse med en oberoende referens, aldrig genom fler mätningar med samma instrument.</p>`),

u('2.17',2,'densitet','E','(2/1/0)',
`<p>Mässing är en legering av koppar (8930 kg/m³) och zink (7130 kg/m³). En viss mässing består av 60 volymprocent koppar och 40 volymprocent zink.</p>
<p>Bestäm legeringens densitet.</p>`,

<p>Densiteten hamnar mellan de ingående ämnenas, närmare kopparns eftersom den dominerar volymen.</p>`),

u('2.18',2,'densitet','C','(1/2/0)',
`<p>Vatten har densiteten 998 kg/m³ och is 917 kg/m³.</p>
<ol><li>Hur många procent ökar volymen när vatten fryser?</li>
<li>En glasflaska rymmer 0,50 liter och fylls helt med vatten innan den ställs i frysen. Vad händer?</li>
<li>Varför flyter is, till skillnad från de flesta ämnens fasta form?</li></ol>`,

<p>b) Isen behöver 0,544 liter men flaskan rymmer 0,50. Flaskan spricker — vattnet är i praktiken inte hopptryckbart.</p>
<p>c) Vattenmolekylerna binder i ett öppet gitter med hålrum när de fryser, vilket ger lägre densitet än vätskan.</p>`),

u('3.14',3,'diagram','C','(1/2/0)',

u('3.15',3,'diagram','C','(0/2/0)',

u('3.16',3,'diagram','A','(0/2/2)',
`<p>Två löpare startar samtidigt från samma plats. Den ena håller konstant 4,0 m/s. Den andra startar från vila och accelererar likformigt med 0,50 m/s².</p>

`<p>b) 0,50t = 4,0 → <strong>t = 8,0 s</strong></p>

u('3.17',3,'konstacc','E','(2/0/0)',
`<p>Ett flygplan accelererar likformigt med 2,4 m/s² på startbanan och lyfter vid farten 72 m/s.</p>
<ol><li>Hur lång tid tar starten?</li><li>Hur lång startbana krävs?</li></ol>`,

u('3.18',3,'konstacc','C','(1/2/0)',
`<p>En hiss startar från vila, accelererar med 0,80 m/s² tills den når 2,0 m/s, håller den farten i 4,0 s och bromsar sedan in med samma retardation.</p>

u('4.16',4,'fjadrar','E','(2/0/0)',
`<p>En fjädervåg har fjäderkonstanten 120 N/m. När ett föremål hängs i den dras fjädern ut 8,5 cm.</p>
<p>Bestäm föremålets massa.</p>`,

u('4.17',4,'fjadrar','C','(1/2/0)',
`<p>Två fjädrar har fjäderkonstanterna 40 N/m och 60 N/m.</p>
<ol><li>Vilken sammanlagd fjäderkonstant får de om de kopplas efter varandra?</li>
<li>Vilken får de om de kopplas parallellt?</li>
<li>Varför blir seriekopplingen mjukare än den mjukaste enskilda fjädern?</li></ol>`,
`<p>a) 1/k = 1/40 + 1/60 → k = <strong>24 N/m</strong></p>
<p>b) k = 40 + 60 = <strong>100 N/m</strong></p>
<p>c) Båda fjädrarna bär samma kraft men förlängningarna adderas, så den totala förlängningen blir större än för endera fjädern.</p>`),

u('4.18',4,'fjadrar','C','(1/2/0)',
`<p>En bil har fyra fjädrar med fjäderkonstanten 25 kN/m vardera. Bilen lastas med 300 kg jämnt fördelat.</p>
<ol><li>Hur mycket sjunker bilen?</li>
<li>Vad skulle hända med körkomforten om fjädrarna byttes mot betydligt styvare?</li></ol>`,
`<p>a) Varje fjäder bär 75 kg: Δl = 75·9,82/25 000 = <strong>29 mm</strong></p>
<p>b) Bilen skulle sjunka mindre men överföra fler ojämnheter till kupén, eftersom fjädringen inte hinner ta upp dem.</p>`),

u('4.19',4,'fjadrar','C','(0/2/1)',
`<p>En leksakspistol har en fjäder med fjäderkonstanten 350 N/m som trycks ihop 12 cm. Projektilen väger 20 g. Fjäderns lagrade energi är ½kx².</p>
<ol><li>Hur mycket energi lagras i fjädern?</li><li>Vilken fart får projektilen om all energi överförs?</li>
<li>Varför blir den verkliga farten lägre?</li></ol>`,
`<p>a) E = ½·350·0,12² = <strong>2,5 J</strong></p>
<p>b) v = √(2E/m) = <strong>16 m/s</strong></p>
<p>c) Friktion i loppet, luftmotstånd och att fjädern själv måste accelereras tar en del av energin.</p>`),

u('4.20',4,'fjadrar','A','(0/1/2)',
`<p>En bungyjumpare med massan 70 kg hoppar från en bro 25 m över vattnet. Repet är 15 m långt och beter sig som en fjäder när det sträcks.</p>
<ol><li>Hur långt sträcks repet om hopparen precis nuddar vattenytan?</li>
<li>Vilken fjäderkonstant krävs då? Använd att all lägesenergi omvandlas till fjäderenergi ½kx².</li>
<li>Varför är det farligt om repet är ens någon meter för långt?</li></ol>`,
`<p>a) 25 − 15 = <strong>10 m</strong></p>
<p>b) mg·25 = ½kx² → k = 2·70·9,82·25/10² = <strong>344 N/m</strong></p>
<p>c) Sträckningen måste öka mer än proportionellt för att ta upp den extra energin, samtidigt som marginalen till vattnet försvinner helt.</p>`),

u('4.21',4,'gravitation','E','(2/0/0)',
`<p>På månen är tyngdaccelerationen 1,62 m/s².</p>
<ol><li>Hur stor tyngd har en astronaut med massan 65 kg på månen?</li><li>Och på jorden?</li>
<li>Vad händer med astronautens massa?</li></ol>`,
`<p>a) F = 65·1,62 = <strong>105 N</strong></p><p>b) F = 65·9,82 = <strong>638 N</strong></p>
<p>c) Massan är fortfarande 65 kg. Det är tyngden som ändras, inte materiemängden.</p>`),

u('4.22',4,'gravitation','E','(2/1/0)',
`<p>En låda med massan 12 kg står på golvet i en hiss.</p>
<ol><li>Hur stor är normalkraften när hissen står stilla?</li>
<li>Hissen accelererar uppåt med 1,5 m/s². Hur stor blir normalkraften?</li>
<li>Hissen accelererar nedåt med 1,5 m/s². Hur stor blir den då?</li></ol>`,
`<p>a) N = mg = <strong>118 N</strong></p>
<p>b) N = m(g+a) = 12·11,32 = <strong>136 N</strong></p>
<p>c) N = m(g−a) = 12·8,32 = <strong>100 N</strong></p>`),

u('4.23',4,'gravitation','C','(0/2/0)',
`<p>En person med massan 68 kg står på en våg i en hiss. Under en del av färden visar vågen 75 kg.</p>
<ol><li>Hur stor är hissens acceleration, och åt vilket håll?</li>

`<p>a) N = m(g+a) → a = (75−68)·9,82/68 = <strong>1,0 m/s² riktad uppåt</strong></p>
<p>b) Nej. Accelerationen är uppåtriktad både när hissen startar uppåt och när den bromsar in på väg nedåt. Vågen mäter acceleration, inte hastighet.</p>`),

u('4.24',4,'gravitation','C','(1/2/0)',
`<p>Två personer med massan 70 kg vardera står 1,0 m från varandra. Gravitationskonstanten är 6,674·10⁻¹¹ Nm²/kg².</p>

<li>Varför märker vi ingenting av dragningen mellan vardagsföremål?</li></ol>`,

<p>b) Tyngdkraften är 687 N, alltså <strong>2·10⁹ gånger</strong> större</p>
<p>c) G är extremt liten. Gravitationen märks först när en av massorna är av planetstorlek.</p>`),

u('4.25',4,'gravitation','A','(0/1/2)',
`<p>Jordens radie är 6371 km. Tyngdaccelerationen avtar med kvadraten på avståndet från jordens centrum.</p>
<ol><li>På vilket avstånd från jordens centrum är tyngdaccelerationen halverad?</li>
<li>Vilken höjd över markytan motsvarar det?</li>

<p>c) g = 9,82·(6371/6791)² = <strong>8,6 m/s²</strong>, alltså nästan som på marken. Tyngdlösheten beror på att stationen ständigt faller fritt runt jorden, inte på att gravitationen upphört.</p>`),

u('4.26',4,'friktion','E','(2/1/0)',
`<p>En låda med massan 25 kg ligger på ett plan som lutar 18°. Friktionstalet är 0,35.</p>

<p>c) Drivande kraft mg·sin 18° = 76 N < 82 N → <strong>lådan ligger kvar</strong>, med liten marginal.</p>`),

u('4.27',4,'friktion','E','(2/0/0)',
`<p>Det krävs 95 N för att få en soffa att börja röra sig, men bara 70 N för att sedan hålla den i konstant rörelse.</p>

u('4.28',4,'friktion','C','(1/2/0)',
`<p>En låda står oförankrad på ett lastbilsflak. Friktionstalet mellan låda och flak är 0,35. Lastbilen bromsar med retardationen 4,0 m/s².</p>

<li>Spelar lådans massa någon roll?</li></ol>`,

<p>b) 4,0 > 3,4 → <strong>lådan glider framåt</strong> på flaket</p>
<p>c) Nej — massan förkortas bort i μmg = ma.</p>`),

u('4.29',4,'friktion','C','(1/2/0)',
`<p>En skidåkare åker rakt nedför en backe med lutningen 12°. Friktionstalet mellan skidor och snö är 0,080.</p>
<ol><li>Bestäm accelerationen.</li><li>Vilken fart har åkaren efter 60 m, med start från vila?</li>

<p>c) Att friktionstalet vore tan 12° = 0,21, eller att luftmotståndet vuxit till motsvarande kraft.</p>`),

u('4.30',4,'friktion','A','(0/2/1)',
`<p>När man häller upp torr sand bildas en kon. Sluttningens vinkel mot marken blir alltid ungefär densamma, cirka 34°, oavsett hur mycket sand man häller.</p>
<ol><li>Förklara vinkeln med hjälp av friktion.</li><li>Vilket friktionstal motsvarar den?</li>

`<p>a) Sandkornen längst ut glider så snart lutningen överstiger den vinkel där tyngdkomposanten längs ytan överstiger friktionen — precis samma villkor som för en låda på ett lutande plan.</p>
<p>b) μ = tan 34° = <strong>0,67</strong></p>
<p>c) Villkoret tan θ = μ innehåller varken massa eller storlek. Högen växer tills ytan når just den vinkeln och rasar sedan tillbaka.</p>`),

u('4.31',4,'newton','E','(2/0/0)',
`<p>På en boll verkar två krafter i samma plan: 30 N åt höger och 40 N rakt uppåt. Bollen ligger stilla.</p>
<ol><li>Hur stor är resultanten av de två krafterna?</li><li>Hur stor och åt vilket håll måste den tredje kraften vara?</li></ol>`,

<p>b) Jämvikt kräver att summan är noll: <strong>50 N riktad snett nedåt vänster</strong>, exakt motsatt resultanten.</p>`),

u('5.14',5,'rorelsemangd','E','(2/0/0)',
`<p>Bestäm rörelsemängden för</p>

u('5.15',5,'rorelsemangd','E','(2/1/0)',
`<p>Ett gevär med massan 4,2 kg avfyrar en kula med massan 9,5 g och farten 780 m/s när den lämnar pipan.</p>
<ol><li>Vilken rekylfart får geväret?</li><li>Varför känns rekylen ändå kraftig?</li></ol>`,

<p>b) Farten är liten, men hela rörelsemängden överförs på någon millisekund. Kraften F = Δp/Δt blir därför stor.</p>`),

u('5.16',5,'rorelsemangd','C','(1/2/0)',
`<p>En biljardboll rullar med 2,4 m/s och träffar en likadan stillastående boll rakt på. Stöten är fullständigt elastisk.</p>
<ol><li>Visa att den enda lösning som bevarar både rörelsemängd och energi är att den första bollen stannar.</li>
<li>Vilken fart får den andra bollen?</li></ol>`,
`<p>a) Rörelsemängd: mv = mu₁ + mu₂ → u₁ + u₂ = 2,4. Energi: v² = u₁² + u₂². Kombineras dessa fås u₁u₂ = 0, alltså måste en av dem vara noll — och det kan inte vara den andra bollen.</p>
<p>b) <strong>2,4 m/s</strong>, alltså exakt den första bollens fart.</p>`),

u('5.17',5,'rorelsemangd','C','(0/2/1)',
`<p>En brandslang sprutar 2,5 kg vatten per sekund med farten 12 m/s rakt mot en vägg. Vattnet rinner nedför väggen utan att studsa tillbaka.</p>
<ol><li>Hur stor rörelsemängd träffar väggen varje sekund?</li><li>Hur stor kraft verkar strålen med?</li>
<li>Hur skulle kraften ändras om vattnet studsade rakt tillbaka med samma fart?</li></ol>`,

<p>b) F = Δp/Δt = <strong>30 N</strong></p>
<p>c) Då blir hastighetsändringen dubbelt så stor → <strong>60 N</strong>. Därför är en studsande stråle effektivare än en absorberad.</p>`),

u('5.18',5,'rorelsemangd','A','(0/1/2)',
`<p>En satellit med massan 900 kg ska ändra bana. Den släpper ut 4,0 kg gas som strömmar ut med farten 2500 m/s.</p>
<ol><li>Vilken hastighetsändring får satelliten?</li>
<li>Varför fungerar detta i vakuum, där det inte finns något att trycka mot?</li>
<li>Vad skulle krävas för att fördubbla hastighetsändringen?</li></ol>`,

<p>b) Rörelsemängden hos systemet satellit + gas bevaras. Gasen får rörelsemängd åt ena hållet, satelliten lika mycket åt det andra. Inget yttre stöd behövs.</p>
<p>c) Antingen dubbelt så mycket gas eller dubbelt så hög utströmningsfart. Det senare är effektivare, eftersom bränslet också måste bäras med.</p>`),

u('5.19',5,'arbete','E','(2/0/0)',
`<p>En låda med massan 25 kg dras 8,0 m längs ett golv med konstant fart. Friktionstalet är 0,40.</p>
<ol><li>Hur stor är dragkraften?</li><li>Hur stort arbete uträttas?</li><li>Vad har energin omvandlats till?</li></ol>`,
`<p>a) F = μmg = 0,40·25·9,82 = <strong>98 N</strong></p><p>b) W = Fs = <strong>0,79 kJ</strong></p>
<p>c) Till värme i golvet och lådans undersida. Ingen rörelseenergi tillkommer, eftersom farten är konstant.</p>`),

u('5.20',5,'arbete','C','(1/2/0)',
`<p>En berg-och-dalbanevagn startar från vila på 32 m höjd. Räkna utan friktion.</p>
<ol><li>Vilken fart har vagnen längst ned?</li>
<li>Vilken fart har den på en efterföljande kulle, 12 m över marken?</li>
<li>Kan vagnen ta sig över en kulle som är 35 m hög? Motivera.</li></ol>`,
