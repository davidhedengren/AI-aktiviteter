.pstep.done .pn{background:rgba(61,220,132,.15);color:var(--grn)}
.pstep.done .pshead{color:var(--sub)}
.pstep.on.back::after{content:'du tittar bakåt';position:absolute;top:12px;right:15px;
  font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pstep.avail{cursor:pointer}
.pstep.avail:hover:not(.on){background:rgba(255,255,255,.055)}
.pline{width:2px;height:15px;margin-left:32px;background:var(--line2);flex:none}
.looprail{position:absolute;right:-6px;top:var(--lt,0);height:var(--lh,0);width:22px;pointer-events:none;
  border:2px dashed var(--line2);border-left:none;border-radius:0 14px 14px 0;transition:.45s var(--ez)}

  writing-mode:vertical-rl;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.pipe.live .looprail{border-color:var(--gold);animation:railPulse 2s var(--ez) infinite}
.pipe.done .looprail{border-color:var(--grn);border-style:solid;animation:railDone .7s var(--sp)}
@keyframes railDone{0%{opacity:.4;transform:scaleX(1.12)}100%{opacity:1;transform:none}}
.pstep.win{animation:winGlow 1.1s var(--ez)}
@keyframes winGlow{0%{box-shadow:0 0 0 1px var(--c),0 0 0 0 rgba(61,220,132,.5)}
  55%{box-shadow:0 0 0 1px var(--c),0 0 0 16px rgba(61,220,132,0)}
  100%{box-shadow:0 0 0 1px var(--c),0 18px 46px -22px var(--c)}}
@keyframes railPulse{0%,100%{opacity:.5}50%{opacity:1}}
.pd2 .fml{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);text-align:center;
  background:rgba(0,0,0,.3);border-radius:11px;padding:12px 10px;margin:11px 0}
.linky{background:none;border:none;color:var(--a1);font-family:inherit;font-size:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:0}
.pd2 p{margin-bottom:9px}.pd2 p:last-child{margin-bottom:0}.pd2 b{color:var(--tx);font-weight:600}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbig{flex:1;min-width:140px;padding:12px 15px;border-radius:13px;border:none;background:var(--c);color:#07090f;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:.24s var(--sp)}
.pbig:hover:not(:disabled){transform:translateY(-1.5px);box-shadow:0 10px 28px -10px var(--c)}

  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:.24s var(--sp)}
.psub:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--tx)}
.psub:disabled{opacity:.32;cursor:not-allowed}
@media(max-width:640px){.pstep{padding:13px 14px}.looprail{right:-3px;width:16px}.looprail .lcap{display:none}}

<body>
<div class="hd">
  <div class="links">
    <a class="lk" href="/">← AI-aktiviteter</a>
    <a class="lk" href="/k-means_ENG"><svg viewBox="0 0 50 30"><rect width="50" height="30" fill="#012169"/><path d="M0,0 L50,30 M50,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M25,0 L25,30 M0,15 L50,15" stroke="#fff" stroke-width="10"/><path d="M25,0 L25,30 M0,15 L50,15" stroke="#C8102E" stroke-width="6"/></svg>English</a>
  </div>
  <h1>k-means-klustring</h1>
  <div class="tag">Modellen får data som inte har några kända svar, och försöker själv hitta mönster i den.</div>
</div>

<div class="wrap">
  <div class="lay">

    <aside class="pipe" id="pipe">
      <div class="pstep" data-s="1">
        <div class="pn">1</div>
        <div class="pbody"><div class="pshead">Välj datamängd</div>
          <div class="pd2" id="p1body"></div></div>
      </div>
      <div class="pline"></div>
      <div class="pstep" data-s="2">
        <div class="pn">2</div>
        <div class="pbody"><div class="pshead">Placera centroider</div>
          <div class="pd2" id="p2body"></div></div>
      </div>
      <div class="pline"></div>
      <div class="looprail"><span class="lcap">upprepas</span></div>
      <div class="pstep loopstep" data-s="3">
        <div class="pn">3</div>
        <div class="pbody"><div class="pshead">Tilldela datapunkter</div>
          <div class="pd2" id="p3body"></div></div>
      </div>
      <div class="pline in-loop"></div>
      <div class="pstep loopstep" data-s="4">
        <div class="pn">4</div>
        <div class="pbody"><div class="pshead">Flytta centroider</div>
          <div class="pd2" id="p4body"></div></div>
      </div>
      <div class="pline"></div>
      <div class="pstep" data-s="5">
        <div class="pn">5</div>
        <div class="pbody"><div class="pshead">Hur många grupper?</div>
          <div class="pd2" id="p5body"></div></div>
      </div>
    </aside>

    <div class="canvascol">
      <div class="panel canvaspanel">
        <div class="ph"><span class="pd"></span><span id="ptitle"></span><span class="meta" id="pmeta"></span></div>
        <div class="stage"><svg class="plot" id="plot" viewBox="0 0 620 450"></svg></div>
        <div class="mets" id="mets"></div><div class="tl" id="tl"></div>
      </div>

</div>

<div class="scrim" id="scrim" onclick="closeCard()"></div>
<div class="ccard" id="ccard" role="dialog" aria-modal="true">
  <div class="ccard-in" id="ccardIn">
    <button class="cclose" onclick="closeCard()" aria-label="Stäng">✕</button>
    <div class="cicon" id="cIc"></div>

    <div class="cdef" id="cCa"></div>

<script>
function rng(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function gs(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function blob(r,cx,cy,sx,sy,n,rot){const o=[];for(let i=0;i<n;i++){let x=gs(r)*sx,y=gs(r)*sy;
  if(rot){const c=Math.cos(rot),s=Math.sin(rot);[x,y]=[x*c-y*s,x*s+y*c];}o.push({x:cx+x,y:cy+y});}return o;}
const DS={
 three:{n:'Tre tydliga grupper',best:3,ax:['Egenskap A','Egenskap B'],tip:'Tre tydligt åtskilda moln. Här hittar algoritmen samma grupper som ditt öga gör.',
   g:(sd)=>{const r=rng(7+(sd||0)*137);return[...blob(r,26,70,7,7,34),...blob(r,66,26,7,7,34),...blob(r,74,74,7,7,34)];}},
 elong:{n:'Avlånga grupper',best:2,ax:['Egenskap A','Egenskap B'],tip:'Två långsmala band. Ögat ser två grupper direkt, men algoritmen delar upp dem på ett annat sätt.',
   g:(sd)=>{const r=rng(19+(sd||0)*137);return[...blob(r,36,42,21,4.2,48,-.62),...blob(r,64,60,21,4.2,48,-.62)];}},
 sizes:{n:'Olika täthet',best:3,ax:['Egenskap A','Egenskap B'],tip:'Ett stort glest moln och två små täta. Hur tätt punkterna ligger avgör var gränserna hamnar.',
   g:(sd)=>{const r=rng(31+(sd||0)*137);return[...blob(r,32,50,15,15,60),...blob(r,74,28,4.5,4.5,24),...blob(r,76,72,4.5,4.5,24)];}},
 none:{n:'Ingen struktur',best:null,ax:['Egenskap A','Egenskap B'],tip:'Jämnt utspridda punkter utan grupper. Vad svarar algoritmen då?',
   g:(sd)=>{const r=rng(53+(sd||0)*137);const o=[];for(let i=0;i<100;i++)o.push({x:12+r()*76,y:12+r()*76});return o;}}
};
const COL=['#5b8cff','#ffcf5c','#3ddc84','#8b7dff','#ff9f5c','#3ee0e0'];
const GOOD={three:1,elong:1,sizes:1,none:1};

let lastChanged=-1,lastMoved=-1,ds=null,pts=[],K=3,cens=[],iter=0,phase='init',hist=[],changed=null,
    busy=false,snaps=[],vSnap=null,tick=0;

let dataSeed=0;
function load(){pts=ds?DS[ds].g(dataSeed).map(p=>({...p,c:-1})):[];reset();}
function reset(){cens=[];iter=0;lastChanged=-1;lastMoved=-1;phase='init';hist=[];changed=null;snaps=[];vSnap=null;pts.forEach(p=>p.c=-1);}
function seed(){const r=rng(GOOD[ds]+tick*997+dataSeed*37);tick++;
  /* k-means++: första centroiden slumpas, resten dras med sannolikhet i proportion
     till kvadrerat avstånd från närmaste redan valda. Sprider ut dem utan att fuska. */
  cens=[{...pts[Math.floor(r()*pts.length)]}];
  while(cens.length<K){const d=pts.map(q=>Math.min(...cens.map(c=>(q.x-c.x)**2+(q.y-c.y)**2)));
    const Tt=d.reduce((a,b)=>a+b,0);let t=r()*Tt,i=0;
    while(t>d[i]&&i<d.length-1){t-=d[i];i++;}
    cens.push({x:pts[i].x,y:pts[i].y});}
  cens=cens.slice(0,K).map(c=>({x:c.x,y:c.y}));
  iter=0;phase='seeded';hist=[];changed=null;snaps=[];vSnap=null;pts.forEach(p=>p.c=-1);}
function near(p){let b=0,bd=Infinity;cens.forEach((c,i)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2;if(d<bd){bd=d;b=i;}});return b;}
function wcss(){return pts.reduce((s,p)=>{const c=cens[p.c];return c?s+(p.x-c.x)**2+(p.y-c.y)**2:s;},0);}
function fin(){return iter>0&&changed===0;}
function snap(){snaps.push({cens:cens.map(c=>({...c})),cs:pts.map(p=>p.c),it:iter});}


const PW=620,PH=450,PD=24;
const X=v=>PD+(v/100)*(PW-2*PD),Y=v=>PD+((100-v)/100)*(PH-2*PD);
let built=false;
function build(){
  const svg=document.getElementById('plot');
  let g='<g class="grid" id="gG"></g><g id="gL"></g><g id="gR"></g><g id="gP"></g><g id="gC"></g>';
  svg.innerHTML=g;
  let gr='';for(let i=0;i<=10;i++)gr+=`<line x1="${X(i*10)}" y1="${Y(0)}" x2="${X(i*10)}" y2="${Y(100)}"/><line x1="${X(0)}" y1="${Y(i*10)}" x2="${X(100)}" y2="${Y(i*10)}"/>`;
  document.getElementById('gG').innerHTML=gr;
  document.getElementById('gP').innerHTML=pts.map((p,i)=>`<circle class="pt" id="p${i}" cx="${X(p.x)}" cy="${Y(p.y)}" r="5.4" fill="#4d5771" fill-opacity=".6"/>`).join('');
  document.getElementById('gR').innerHTML=pts.map((p,i)=>`<circle class="ring" id="r${i}" cx="${X(p.x)}" cy="${Y(p.y)}" r="5"/>`).join('');
  document.getElementById('gL').innerHTML=pts.map((p,i)=>`<line class="lnk" id="l${i}"/>`).join('');
  document.getElementById('gC').innerHTML='';
  const ax=(ds&&DS[ds].ax)||['',''];
  svg.insertAdjacentHTML('beforeend',
    `<g class="axl"><text x="${PW-PD}" y="${PH-6}" text-anchor="end">${ax[0]} →</text>`
   +`<text x="${PD}" y="${PD-8}" text-anchor="start">↑ ${ax[1]}</text></g>`);
  built=true;}
function syncC(){const h=document.getElementById('gC');
  if(h.childElementCount!==cens.length){
    h.innerHTML=cens.map((c,i)=>`<g class="cen" id="c${i}" onclick="showCen(${i})" transform="translate(${X(c.x)},${Y(c.y)})">
      <g class="cin" style="animation-delay:${i*120}ms">
      <circle class="halo" r="16" fill="${COL[i%6]}" opacity=".18"/>
      <circle r="10" fill="${COL[i%6]}" fill-opacity=".3" stroke="${COL[i%6]}" stroke-width="2"/>
      <circle r="10.5" fill="#080a11" fill-opacity=".55"/>
      <circle r="10.5" fill="${COL[i%6]}" fill-opacity=".26" stroke="${COL[i%6]}" stroke-width="1.8"/>
      <path d="M-4.4,0 H4.4 M0,-4.4 V4.4" stroke="${COL[i%6]}" stroke-width="2.1" stroke-linecap="round"/>
      <path class="tick" d="M-3.4,.2 L-1,2.6 L3.6,-2.4" stroke="${COL[i%6]}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-16)"/></g></g>`).join('');
  } else cens.forEach((c,i)=>document.getElementById('c'+i).setAttribute('transform',`translate(${X(c.x)},${Y(c.y)})`));}
function paint(v){
  const V=v||{cens,cs:pts.map(p=>p.c)};
  pts.forEach((p,i)=>{const c=V.cs[i],e=document.getElementById('p'+i);if(!e)return;
    e.setAttribute('fill',c<0?'#4d5771':COL[c%6]);e.setAttribute('fill-opacity',c<0?'.6':'.95');
    const L=document.getElementById('l'+i);
    if(c>=0&&V.cens[c]){L.setAttribute('x1',X(p.x));L.setAttribute('y1',Y(p.y));
      L.setAttribute('x2',X(V.cens[c].x));L.setAttribute('y2',Y(V.cens[c].y));L.setAttribute('stroke',COL[c%6]);
      L.classList.toggle('show',phase==='assigned');}else L.classList.remove('show');});
  document.getElementById('pmeta').textContent=cens.length?`${pts.length} punkter · k = ${K}`:`${pts.length} punkter`;}

function doAssign(){
  if(busy||!cens.length||phase==='assigned')return;busy=true;vSnap=null;forced=null;
  const nc=pts.map(p=>near(p));
  const first=pts.every(p=>p.c<0);
  changed=first?null:pts.reduce((s,p,i)=>s+(p.c!==nc[i]?1:0),0);
  phase='assigned';
  pts.forEach((p,i)=>{const c=nc[i],L=document.getElementById('l'+i);
    L.setAttribute('x1',X(p.x));L.setAttribute('y1',Y(p.y));
    L.setAttribute('x2',X(cens[c].x));L.setAttribute('y2',Y(cens[c].y));
    L.setAttribute('stroke',COL[c%6]);L.classList.add('show');});
  /* punkterna färgas en i taget, i ordning ut från centroiderna */
  lastChanged=-1;
  const order=pts.map((p,i)=>({i,d:Math.hypot(p.x-cens[nc[i]].x,p.y-cens[nc[i]].y)}))
                 .sort((a,b)=>a.d-b.d).map(o=>o.i);
  const gap=Math.max(7,Math.min(26,900/pts.length));
  order.forEach((i,rank)=>setTimeout(()=>{
    const p=pts[i],was=p.c;p.c=nc[i];
    if(was>=0&&was!==p.c&&lastChanged<0)lastChanged=i;
    const e=document.getElementById('p'+i);if(!e)return;
    e.setAttribute('fill',COL[p.c%6]);e.setAttribute('fill-opacity','.95');
    e.classList.remove('pop');void e.getBBox;e.classList.add('pop');
    if(was>=0&&was!==p.c){
      const R=document.getElementById('r'+i);
      R.setAttribute('stroke',COL[was%6]);R.classList.remove('show');void R.getBBox;R.classList.add('show');
      e.setAttribute('stroke',COL[was%6]);e.setAttribute('stroke-width','3.2');
      e.classList.remove('swap');void e.getBBox;e.classList.add('swap');}
  },170+rank*gap));
  setTimeout(()=>{hist.push(wcss());snap();paint();busy=false;refresh();},210+order.length*gap);}
function doMove(){
  if(busy||phase!=='assigned')return;busy=true;vSnap=null;forced=null;
  let bs=-1;
  cens.forEach((c,i)=>{const o=pts.filter(p=>p.c===i);if(!o.length)return;
    const nx=o.reduce((s,p)=>s+p.x,0)/o.length,ny=o.reduce((s,p)=>s+p.y,0)/o.length;
    const dd=Math.hypot(nx-c.x,ny-c.y);if(dd>bs){bs=dd;lastMoved=i;}c.x=nx;c.y=ny;});
  iter++;phase='moved';
  cens.forEach((_,i)=>{const e=document.getElementById('c'+i);if(!e)return;e.classList.add('glide');
    setTimeout(()=>e.classList.remove('glide'),660);});
  syncC();paint();
  setTimeout(()=>{busy=false;refresh();},660);}
async function auto(){
  if(busy)return;
  for(let i=0;i<40;i++){
    doAssign();await new Promise(r=>setTimeout(r,620));
    if(fin())break;
    doMove();await new Promise(r=>setTimeout(r,800));}
  document.querySelectorAll('.cen').forEach(e=>e.classList.add('fin'));refresh();}
function fastRun(){for(let n=0;n<60;n++){const nc=pts.map(p=>near(p));
  const first=pts.every(p=>p.c<0);
  changed=first?null:pts.reduce((s,p,i)=>s+(p.c!==nc[i]?1:0),0);
  pts.forEach((p,i)=>p.c=nc[i]);phase='assigned';hist.push(wcss());snap();
  if(!first&&changed===0)break;
  cens.forEach((c,i)=>{const o=pts.filter(p=>p.c===i);if(!o.length)return;
    c.x=o.reduce((s,p)=>s+p.x,0)/o.length;c.y=o.reduce((s,p)=>s+p.y,0)/o.length;});iter++;}}
function runFull(k,sd){const r=rng(sd),P=pts.map(p=>({...p,c:-1}));
  let C=[{...P[Math.floor(r()*P.length)]}];
  while(C.length<k){const d=P.map(p=>Math.min(...C.map(c=>(p.x-c.x)**2+(p.y-c.y)**2)));
    const T=d.reduce((a,b)=>a+b,0);let t=r()*T,i=0;while(t>d[i]&&i<d.length-1){t-=d[i];i++;}
    C.push({x:P[i].x,y:P[i].y});}
  for(let it=0;it<60;it++){P.forEach(p=>{let b=0,bd=Infinity;C.forEach((c,i)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2;if(d<bd){bd=d;b=i;}});p.c=b;});
    let sh=0;C.forEach((c,i)=>{const o=P.filter(p=>p.c===i);if(!o.length)return;
      const nx=o.reduce((s,p)=>s+p.x,0)/o.length,ny=o.reduce((s,p)=>s+p.y,0)/o.length;
      sh+=Math.hypot(nx-c.x,ny-c.y);c.x=nx;c.y=ny;});if(sh<.01)break;}
  return P.reduce((s,p)=>s+(p.x-C[p.c].x)**2+(p.y-C[p.c].y)**2,0);}

function mets(){
  const el=document.getElementById('mets');
  if(!cens.length){el.innerHTML=pts.length?`<div><div class="mk">Datapunkter</div><div class="mv">${pts.length}</div></div>`:'';
    document.getElementById('tl').innerHTML='';return;}
  const w=hist.length?hist[hist.length-1]:null,pw=hist.length>1?hist[hist.length-2]:null;
  const dp=(w!==null&&pw)?Math.round((w-pw)/pw*100):null;
  const sz=cens.map((_,i)=>pts.filter(p=>p.c===i).length);
  el.innerHTML=`<div><div class="mk">Varv i loopen</div><div class="mv">${iter}</div></div>
    <div><div class="mk">Punkter som bytte grupp</div><div class="mv ${fin()?'zero':''}">${changed===null?'–':changed}</div></div>
    <div><div class="mk">Punkter per grupp</div><div class="mv" style="font-size:19px">${sz.length?sz.join(' · '):'–'}</div></div>`;}
function timeline(){const el=document.getElementById('tl');if(!el)return;
  if(snaps.length<2){el.innerHTML='';return;}
  el.innerHTML=`<span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-right:11px">HISTORIK</span>`
   +snaps.map((s,i)=>`${i?'<span class="tll"></span>':''}<button class="tp${(vSnap===null?i===snaps.length-1:vSnap===i)?' on':''}" onclick="showSnap(${i})">${s.it}</button>`).join('');}
function showSnap(i){vSnap=i;const s=snaps[i];
  s.cens.forEach((c,j)=>{const e=document.getElementById('c'+j);if(e)e.setAttribute('transform',`translate(${X(c.x)},${Y(c.y)})`);});
  paint({cens:s.cens,cs:s.cs});timeline();}

const T={
 centroid:{i:'✛',t:'Centroid',p:'Mittpunkten i en grupp, räknad som medelvärdet av de punkter som hör dit. Centroiden är algoritmens gissning på var gruppen har sin mitt. Den flyttar sig varje varv, tills gissningen inte längre ändras.'},
 oover:{i:'🔍',t:'Oövervakad inlärning',p:'Inlärning från data <b>utan facit</b>. Eftersom ingen har talat om vad punkterna föreställer kan modellen inte lära sig att härma rätt svar. Den kan bara leta efter mönster i hur punkterna ligger.'},
 avst:{i:'📉',t:'Hur tätt grupperna sitter',p:'Mät avståndet från varje datapunkt till sin egen centroid och lägg ihop alla dessa avstånd. Blir summan <b>liten</b> sitter punkterna tätt kring sina mittpunkter, alltså har algoritmen hittat sammanhållna grupper. Blir den <b>stor</b> ligger punkterna utspridda långt från sina centroider.<br><br>Det är precis den här summan k-means arbetar för att göra så liten som möjligt.<br><br>Måttet har ett eget namn: <b>WCSS</b>, efter engelskans <i>within-cluster sum of squares</i> — summan av kvadrerade avstånd inom klustren. Avstånden kvadreras innan de läggs ihop, vilket gör att en punkt som ligger riktigt långt bort väger tyngre än flera som ligger nästan rätt. Måttet straffar alltså enstaka punkter i fel grupp extra hårt.'},
 plus:{i:'✨',t:'Smart startläge (k-means++)',p:'Var centroiderna hamnar från början spelar roll. Om två av dem placeras i samma grupp kan algoritmen fastna i en dålig lösning som den inte tar sig ur.<br><br>Därför placeras de inte helt slumpmässigt. Den <b>första</b> centroiden lottas fram bland datapunkterna. Därefter är chansen att bli vald större för punkter som ligger <b>långt från de centroider som redan placerats</b>. På så vis hamnar de sällan nära varandra.<br><br>Metoden kallas <b>k-means++</b> och är det vanligaste sättet att välja startlägen. Den gör också att algoritmen blir färdig efter färre varv.'},
  lokal:{i:'🕳️',t:'Lokalt minimum',p:'En lösning som inte går att förbättra med ett litet steg, men som ändå inte är den bästa möjliga. k-means hamnar där om centroiderna startar olyckligt, och kan inte ta sig därifrån på egen hand.'},
 armb:{i:'💪',t:'Armbågsmetoden',p:'Ett sätt att välja k. Man kör algoritmen med flera olika värden på k och ritar upp resultatet. Kurvan faller brant så länge extra centroider delar upp verkliga grupper, och planar ut när de bara delar upp grupper som redan är hela. Knäckpunkten kallas armbågen.'}
};
let cardEv=null;
function placeCard(){
  const c=document.getElementById('ccard');
  if(cardEv){const dx=cardEv.clientX-window.innerWidth/2, dy=cardEv.clientY-window.innerHeight/2;
    c.style.setProperty('--dx',dx+'px');c.style.setProperty('--dy',dy+'px');}
  else{c.style.setProperty('--dx','0px');c.style.setProperty('--dy','0px');}
  requestAnimationFrame(()=>{document.getElementById('scrim').classList.add('show');c.classList.add('show');});
}
function openCard(id,ev){const c=T[id];if(!c)return;cardEv=ev||window.event||null;
  cIc.textContent=c.i;cTi.textContent=c.t;cBo.innerHTML=c.p;cCa.innerHTML='';placeCard();}
function showCen(i){const o=pts.filter(p=>p.c===i),c=cens[i],L=String.fromCharCode(65+i);
  cardEv=window.event||null;
  cIc.textContent='✛';cTi.textContent='Centroid '+L;
  cBo.innerHTML='Centroiden sitter i <b>medelvärdet</b> av de punkter som valt den. Varje gång punkterna byter tillhörighet räknas medelvärdet om, och centroiden glider dit.';
  cCa.innerHTML=o.length?`<div class="calc">punkter som valt ${L} = <b>${o.length}</b><br>
    x = (${o.slice(0,3).map(p=>p.x.toFixed(1)).join(' + ')}${o.length>3?' + …':''}) / ${o.length} = <b>${c.x.toFixed(1)}</b><br>
    y = (${o.slice(0,3).map(p=>p.y.toFixed(1)).join(' + ')}${o.length>3?' + …':''}) / ${o.length} = <b>${c.y.toFixed(1)}</b></div>`:'';
  placeCard();}
function closeCard(){document.getElementById('ccard').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();});
(function(){const inn=document.getElementById('ccardIn');if(!inn)return;
  inn.addEventListener('pointermove',e=>{const r=inn.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
    inn.style.setProperty('--mx',(px*100)+'%');inn.style.setProperty('--my',(py*100)+'%');
    inn.style.transform=`perspective(1000px) rotateX(${(0.5-py)*7}deg) rotateY(${(px-0.5)*7}deg)`;});
  inn.addEventListener('pointerleave',()=>{inn.style.transform='perspective(1000px) rotateX(0deg) rotateY(0deg)';});})();
function hyd(){document.querySelectorAll('.term[data-t]').forEach(e=>e.onclick=(ev)=>openCard(e.dataset.t,ev));}



/* ═════════ gränssnitt: vertikal pipeline ═════════ */
const PC=['#5b8cff','#8b7dff','#ffcf5c','#3ddc84','#3ee0e0'];
let dsChosen=false,celebrated=false;
function naturalStep(){
  if(!ds||(!dsChosen&&!cens.length))return 1;
  if(!cens.length)return 2;
  if(fin())return 5;
  return phase==='assigned'?4:3;
}
/* forced låter eleven bläddra tillbaka utan att tappa körningen */
function activeStep(){return forced!==null?forced:naturalStep();}
function pipeUI(){
  const act=activeStep();
  document.querySelectorAll('.pstep').forEach(el=>{
    const n=+el.dataset.s;
    el.style.setProperty('--c',PC[n-1]);
    const nat=naturalStep();
    el.classList.toggle('on',n===act);
    el.classList.toggle('back',n===act&&forced!==null&&forced!==nat);
    el.classList.toggle('done',n<nat||(fin()&&n<5));
    el.classList.toggle('avail',n<=Math.max(nat,act));
    el.onclick=n<=Math.max(nat,act)?(ev)=>{ev.stopPropagation();focusStep(n);}:null;
  });
  const pipe0=document.getElementById('pipe');
  pipe0.classList.toggle('live',cens.length&&!fin());
  pipe0.classList.toggle('done',fin());
  if(fin()&&!celebrated){celebrated=true;const s5=document.querySelector('.pstep[data-s="5"]');
    if(s5){s5.classList.remove('win');void s5.offsetWidth;s5.classList.add('win');}}
  if(!fin())celebrated=false;
  /* loopbågen spänns över steg 3 och 4 */
  const a=document.querySelector('.pstep[data-s="3"]'),b=document.querySelector('.pstep[data-s="4"]'),
        rail=document.querySelector('.looprail'),pipe=document.getElementById('pipe');
  if(a&&b&&rail){const pr=pipe.getBoundingClientRect();
    rail.style.setProperty('--lt',(a.getBoundingClientRect().top-pr.top-8)+'px');
    rail.style.setProperty('--lh',(b.getBoundingClientRect().bottom-a.getBoundingClientRect().top+16)+'px');}
}
function focusStep(n){if(n>=2)dsChosen=true;forced=(forced===n?null:n);render();}
let forced=null;
function pipeBodies(){
  const B=id=>document.getElementById(id);
  B('p1body').innerHTML=`<p>Varje punkt är ett objekt som beskrivs av två mätvärden. <b>Ingen har talat om vilken grupp punkterna hör till</b> — det finns inget rätt svar att härma efter, bara avstånd att tolka. Det kallas <span class="term" data-t="oover">oövervakad inlärning</span>.</p>
    <div class="chips" style="margin-top:11px">${Object.entries(DS).map(([id,d])=>`<button class="chip${id===ds?' on':''}" onclick="event.stopPropagation();pick('${id}')">${d.n}</button>`).join('')}</div>
    <p style="margin-top:11px">${ds?DS[ds].tip:'Välj en datamängd ovan för att börja.'}</p>
    ${ds?`<div class="pact"><button class="psub" onclick="event.stopPropagation();newData()">↺ Nya datapunkter</button></div>`:''}`;
  B('p2body').innerHTML=`<p>Först bestäms ett värde på <b>k</b> — hur många kluster algoritmen ska hitta. Sedan placeras k punkter ut i diagrammet. En sådan punkt representerar ett klusters mittpunkt och kallas <span class="term" data-t="centroid">centroid</span>.</p>
    <div class="chips krow" style="margin-top:11px">${[2,3,4,5,6].map(k=>`<button class="chip${k===K?' on':''}" onclick="event.stopPropagation();setK(${k})">${k}</button>`).join('')}</div>
    <div class="pact"><button class="pbig" style="--c:#8b7dff" onclick="event.stopPropagation();place()" ${ds?'':'disabled'}>${cens.length?'Placera om':'Placera centroider'}</button></div>
    ${cens.length?`<p style="margin-top:11px">Placeringen är slumpmässig, men styrd så att centroiderna hamnar utspridda. Metoden kallas <span class="term" data-t="plus">k-means++</span>.</p>`:''}`;
  B('p3body').innerHTML=`<p>För varje datapunkt beräknas avståndet till <b>alla</b> centroider, och punkten tilldelas den närmaste. Oftast används det euklidiska avståndet:</p>
    <div class="fml">d = √( (x<sub>i</sub> − x<sub>c</sub>)² + (y<sub>i</sub> − y<sub>c</sub>)² )</div>
    <div class="pact"><button class="pbig" style="--c:#ffcf5c" onclick="event.stopPropagation();doAssign()" ${cens.length&&phase!=='assigned'&&!busy?'':'disabled'}>Tilldela datapunkter</button></div>`;
  B('p4body').innerHTML=`<p>En <b>ny mittpunkt</b> beräknas för varje kluster: genomsnittet av alla datapunkters koordinater i klustret. Centroiden flyttas dit.</p>
    <p>Eftersom centroiderna rört sig kan vissa punkter nu ligga närmare en <b>annan</b> centroid. Därför börjar algoritmen om från steg 3. De två stegen växlar tills inga punkter längre byter kluster.</p>
    <div class="pact"><button class="pbig" style="--c:#3ddc84" onclick="event.stopPropagation();doMove()" ${phase==='assigned'&&!busy?'':'disabled'}>Flytta centroider</button>
      <button class="psub" onclick="event.stopPropagation();auto()" ${cens.length&&!busy&&!fin()?'':'disabled'}>Träna klart →</button></div>`;
  const b=ds?DS[ds].best:null;
  B('p5body').innerHTML=`<p>${fin()?`<b>Klart efter ${iter} varv.</b> Ingen punkt bytte kluster i sista varvet, så centroiderna kan inte flytta sig mer.</p><p>`:''}Det finns inget objektivt rätt värde på k — valet beror på situationen och syftet. Ett lågt k ger en övergripande indelning, ett högre ger en mer detaljerad bild.</p>
    <div id="elb" style="margin:12px 0"></div>
    <p>Kurvan visar hur det <span class="term" data-t="avst">måttet på hur tätt grupperna sitter</span> minskar för varje extra kluster. Den planar ut när extra centroider bara delar upp grupper som redan är hela.${b?` Här böjer den av vid <b>k = ${b}</b>.`:` Här finns ingen tydlig knäck.`}</p>`;
}
function elbow(){
  const w=document.getElementById('elb');if(!w||!pts.length)return;
  const ks=[1,2,3,4,5,6],v=ks.map(k=>runFull(k,99));
  const W=470,H=222,L=20,R=18,Tp=20,B=40,mx=Math.max(...v),mn=Math.min(...v);
  const px=i=>L+(i/(ks.length-1))*(W-L-R),py=x=>Tp+(1-(x-mn)/((mx-mn)||1))*(H-Tp-B);
  let g=`<svg class="elb" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="eg" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b7dff"/></linearGradient></defs>`;
  g+=`<path class="ln" stroke="url(#eg)" d="${v.map((x,i)=>(i?'L':'M')+px(i)+','+py(x)).join(' ')}"/>`;
  v.forEach((x,i)=>{const on=ks[i]===K;
    if(on)g+=`<circle cx="${px(i)}" cy="${py(x)}" r="14" fill="none" stroke="#3ee0e0" stroke-opacity=".45"/>`;
    g+=`<circle class="kd" cx="${px(i)}" cy="${py(x)}" r="${on?7.5:5}" fill="${on?'#3ee0e0':'#5b8cff'}" onclick="setK(${ks[i]})"/>`;
    g+=`<text x="${px(i)}" y="${H-B+19}" text-anchor="middle" font-size="12" ${on?'fill="#eef1f8"':''}>${ks[i]}</text>`;});
  g+=`<text x="${(L+W-R)/2}" y="${H-7}" text-anchor="middle" font-size="11.5">antal grupper (k)</text></svg>`;
  w.innerHTML=g;}
function newData(){if(!ds)return;dataSeed++;dsChosen=true;forced=null;load();built=false;build();render();}
function pick(id){ds=id;dsChosen=true;dataSeed++;forced=null;load();built=false;build();render();}
function setK(k){if(!ds)return;K=k;forced=null;reset();built=false;build();render();}
function place(){if(!ds||!pts.length)return;dsChosen=true;forced=null;seed();syncC();paint();render();}
function refresh(){mets();timeline();
  document.querySelectorAll('.cen').forEach(e=>e.classList.toggle('fin',fin()));
  pipeBodies();pipeUI();elbow();hyd();}
function render(){
  document.getElementById('ptitle').textContent=ds?DS[ds].n:'Välj en datamängd för att börja';
  document.querySelector('.ph').style.setProperty('--c',PC[activeStep()-1]);
  if(!built)build();
  syncC();paint();refresh();
  requestAnimationFrame(pipeUI);
}
load();build();render();
</script>
